# Luna taalmodule: Français
automation:
  - id: luna_language_fr_module
    alias: Luna taalmodule Français
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_select.luna_language_taal
          - input_text.luna_platformstatus
          - input_text.luna_prediction_status
          - input_text.luna_health_status
          - input_text.luna_planner_status
          - input_text.luna_memory_status
    conditions:
      - condition: state
        entity_id: input_select.luna_language_taal
        state: Français
    actions:
      - action: input_text.set_value
        target: {entity_id: input_text.luna_language_status}
        data: {value: "Luna-taal: Français"}
      - action: input_text.set_value
        target: {entity_id: input_text.luna_platformstatus}
        data:
          value: >-
            {% set translations = {
              "AUTOMATISCH · basis zonder AI": "AUTOMATIQUE · mode de base sans IA",
              "BASIS · AI uitgeschakeld": "BASE · IA désactivée",
              "AI GEKOZEN · backend niet bereikbaar": "IA SÉLECTIONNÉE · backend indisponible",
              "AI · lokale backend bereikbaar": "IA · backend local disponible",
              "Geen voorspelling · onvoldoende klantgegevens": "Aucune prédiction · données client insuffisantes",
              "OK · geen apparaatkoppelingen · fail-closed actief": "OK · aucune connexion d'appareil · fail-closed actif",
              "Voorstelstand · geen fysieke uitvoering": "Mode proposition · aucune exécution physique",
              "Leeg klantgeheugen · lokale opslag · geen geïmporteerde privégegevens": "Mémoire client vide · stockage local · aucune donnée privée importée",
            } %}
            {{ translations.get(states('input_text.luna_platformstatus'), states('input_text.luna_platformstatus')) }}
