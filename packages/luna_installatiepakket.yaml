# Luna installatiepakket
# Plaats dit bestand als package in Home Assistant.
# AI blijft uitgeschakeld totdat een lokale backend werkelijk bereikbaar is.

input_select:
  luna_installatieprofiel:
    name: Luna installatieprofiel
    icon: mdi:package-variant-closed
    options:
      - Automatisch
      - Basis zonder AI
      - Lokale AI

input_text:
  luna_ai_backend_light:
    name: Luna AI Backend Light
    icon: mdi:brain
    max: 255
  luna_ai_backend_heavy:
    name: Luna AI Backend Heavy
    icon: mdi:brain-circuit
    max: 255
  luna_platformstatus:
    name: Luna platformstatus
    icon: mdi:state-machine
    max: 100

template:
  - binary_sensor:
      - name: Luna lokale AI beschikbaar
        unique_id: luna_lokale_ai_beschikbaar
        icon: mdi:robot
        device_class: connectivity
        state: >-
          {% set profile = states('input_select.luna_installatieprofiel') %}
          {% set refs = [
            states('input_text.luna_ai_backend_light'),
            states('input_text.luna_ai_backend_heavy')
          ] %}
          {% set ns = namespace(ok=false) %}
          {% if profile != 'Basis zonder AI' %}
            {% for ref in refs %}
              {% if ref is match('^[a-z_]+\\.[a-z0-9_]+$')
                    and states(ref) not in ['unknown', 'unavailable', ''] %}
                {% set ns.ok = true %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.ok }}

automation:
  - id: luna_installatieprofiel_core
    alias: Luna installatieprofiel Core
    description: >-
      Kiest automatisch tussen de basisinstallatie en lokale AI.
      Externe AI en fysieke sturing worden niet ingeschakeld.
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
        id: startup
      - trigger: time_pattern
        minutes: "/10"
        id: periodic_check
      - trigger: state
        entity_id:
          - input_select.luna_installatieprofiel
          - input_text.luna_ai_backend_light
          - input_text.luna_ai_backend_heavy
          - binary_sensor.luna_lokale_ai_beschikbaar
        id: capability_change
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.luna_installatieprofiel
                state: Basis zonder AI
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.luna_platformstatus
                data:
                  value: BASIS · AI uitgeschakeld
          - conditions:
              - condition: state
                entity_id: binary_sensor.luna_lokale_ai_beschikbaar
                state: "on"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.luna_platformstatus
                data:
                  value: AI · lokale backend bereikbaar
          - conditions:
              - condition: state
                entity_id: input_select.luna_installatieprofiel
                state: Lokale AI
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.luna_platformstatus
                data:
                  value: AI GEKOZEN · backend niet bereikbaar
        default:
          - action: input_text.set_value
            target:
              entity_id: input_text.luna_platformstatus
            data:
              value: AUTOMATISCH · basis zonder AI
