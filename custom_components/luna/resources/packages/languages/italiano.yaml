          value: >-
            {% set translations = {
              "AUTOMATISCH · basis zonder AI": "AUTOMATICO · modalità base senza IA",
              "BASIS · AI uitgeschakeld": "BASE · IA disattivata",
              "AI GEKOZEN · backend niet bereikbaar": "IA SELEZIONATA · backend non disponibile",
              "AI · lokale backend bereikbaar": "IA · backend locale disponibile",
              "Geen voorspelling · onvoldoende klantgegevens": "Nessuna previsione · dati cliente insufficienti",
              "OK · geen apparaatkoppelingen · fail-closed actief": "OK · nessun dispositivo collegato · fail-closed attivo",
              "Voorstelstand · geen fysieke uitvoering": "Modalità proposta · nessuna esecuzione fisica",
              "Leeg klantgeheugen · lokale opslag · geen geïmporteerde privégegevens": "Memoria cliente vuota · archiviazione locale · nessun dato privato importato",
            } %}
            {{ translations.get(states('input_text.luna_platformstatus'), states('input_text.luna_platformstatus')) }}
