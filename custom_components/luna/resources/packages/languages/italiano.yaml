# Luna taalmodule: Italiano
automation:
  - id: luna_language_it_module
    alias: Luna taalmodule Italiano
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.luna_language_taal
    conditions:
      - condition: state
        entity_id: input_select.luna_language_taal
        state: Italiano
    actions:
      - action: input_text.set_value
        target: {entity_id: input_text.luna_language_status}
        data: {value: "Luna-taal: Italiano"}
      - action: input_text.set_value
        target: {entity_id: input_text.luna_platformstatus}
