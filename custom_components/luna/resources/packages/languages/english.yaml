            } %}
            {{ translations.get(states('input_text.luna_prediction_status'), states('input_text.luna_prediction_status')) }}
      - action: input_text.set_value
        target: {entity_id: input_text.luna_health_status}
        data:
          value: >-
            {% set translations = {
