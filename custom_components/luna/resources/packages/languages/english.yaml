# Luna taalmodule: English
automation:
  - id: luna_language_en_module
    alias: Luna taalmodule English
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_select.luna_language_taal
          - input_text.luna_platformstatus
          - input_text.luna_prediction_status
          - input_text.luna_health_status
          - input_text.luna_planner_status
          - input_text.luna_memory_status
    conditions:
      - condition: state
        entity_id: input_select.luna_language_taal
        state: English
    actions:
      - action: input_text.set_value
        target: {entity_id: input_text.luna_language_status}
        data: {value: "Luna-taal: English"}
      - action: input_text.set_value
        target: {entity_id: input_text.luna_platformstatus}
        data:
          value: >-
            {% set translations = {
              "AUTOMATISCH · basis zonder AI": "AUTOMATIC · basic without AI",
              "BASIS · AI uitgeschakeld": "BASIC · AI disabled",
              "AI GEKOZEN · backend niet bereikbaar": "AI SELECTED · backend unavailable",
              "AI · lokale backend bereikbaar": "AI · local backend available",
              "Geen voorspelling · onvoldoende klantgegevens": "No prediction · insufficient customer data",
              "OK · geen apparaatkoppelingen · fail-closed actief": "OK · no device bindings · fail-closed active",
              "Voorstelstand · geen fysieke uitvoering": "Proposal mode · no physical execution",
              "Leeg klantgeheugen · lokale opslag · geen geïmporteerde privégegevens": "Empty customer memory · local storage · no imported private data",
            } %}
            {{ translations.get(states('input_text.luna_platformstatus'), states('input_text.luna_platformstatus')) }}
      - action: input_text.set_value
        target: {entity_id: input_text.luna_prediction_status}
        data:
          value: >-
            {% set translations = {
