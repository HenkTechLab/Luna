title: Luna
views:
  - title: Luna
    path: luna
    type: sections
    sections:
      - cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_select.luna_language_taal
                name: Language / Taal / Sprache / Langue
      - cards:
          - type: heading
            heading: Luna
            icon: mdi:robot
          - type: tile
            entity: input_select.luna_actiemodus
            name: Action mode
            icon: mdi:shield-lock
          - type: tile
            entity: input_text.luna_installatie_status
            name: Installation status
            icon: mdi:robot
          - type: tile
            entity: input_boolean.luna_physical_control
            name: Physical control
            icon: mdi:shield-lock
          - type: tile
            entity: input_boolean.luna_safety_ok
            name: Safety OK
            icon: mdi:shield-check
          - type: tile
            entity: input_text.luna_selfcheck_status
            name: Self-check
            icon: mdi:check-decagram
          - type: markdown
            content: >-
              ## Luna
              Safe Home Assistant layer. Physical control, planner execution,
              self-recovery and local AI remain fail-closed until deliberately configured.
  - title: Setup
    path: setup
    type: sections
    max_columns: 3
    sections:
      - cards:
          - type: heading
            heading: Luna Setup
            icon: mdi:tune-variant
          - type: tile
            entity: input_select.luna_language_taal
            name: Language / Taal
            features:
              - type: select-options
                style: dropdown
          - type: tile
            entity: input_select.luna_actiemodus
            name: Action mode
            features:
              - type: select-options
                style: dropdown
          - type: tile
            entity: input_select.luna_ai_mode
            name: AI mode
            features:
              - type: select-options
                style: dropdown
      - cards:
          - type: heading
            heading: Generic sources
            icon: mdi:source-branch
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_text.luna_presence_source
                name: Presence source
              - entity: input_text.luna_temperature_source
                name: Temperature source
              - entity: input_text.luna_energy_source
                name: Energy source
              - entity: input_text.luna_calendar_source
                name: Calendar source
      - cards:
          - type: heading
            heading: AI backends
            icon: mdi:brain-circuit
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_text.luna_ai_backend_light
                name: Light backend
              - entity: input_text.luna_ai_backend_heavy
                name: Heavy backend
              - entity: input_text.luna_ai_router_status
                name: Router status
      - cards:
          - type: heading
            heading: Safety
            icon: mdi:shield-lock
          - type: tile
            entity: input_boolean.luna_physical_control
            name: Physical control
          - type: tile
            entity: input_boolean.luna_safety_ok
            name: Safety OK
          - type: tile
            entity: input_text.luna_config_status
            name: Configuration status
  - title: Modules
    path: modules
    type: sections
    max_columns: 4
    sections:
      - cards:
          - type: heading
            heading: Memory & Decisions
            icon: mdi:database
          - type: tile
            entity: input_text.luna_memory_status
            name: Memory
          - type: tile
            entity: input_text.luna_memory_last_record
            name: Last memory record
          - type: tile
            entity: counter.luna_memory_records
            name: Memory records
          - type: tile
            entity: input_text.luna_decision_journal_status
            name: Decision Journal
          - type: tile
            entity: input_text.luna_decision_last_record
            name: Last decision
          - type: tile
            entity: counter.luna_decision_records
            name: Decision records
      - cards:
          - type: heading
            heading: Prediction & Routine
            icon: mdi:crystal-ball
          - type: tile
            entity: input_text.luna_prediction_status
            name: Prediction
          - type: tile
            entity: input_number.luna_prediction_reliability
            name: Prediction reliability
          - type: tile
            entity: input_number.luna_prediction_coverage
            name: Prediction coverage
          - type: tile
            entity: input_text.luna_routine_status
            name: Routine
          - type: tile
            entity: input_number.luna_routine_reliability
            name: Routine reliability
          - type: tile
            entity: input_number.luna_routine_evidence_days
            name: Evidence days
      - cards:
          - type: heading
            heading: Comfort & Forecast
            icon: mdi:weather-partly-cloudy
          - type: tile
            entity: input_text.luna_comfort_status
            name: Comfort
          - type: tile
            entity: input_text.luna_forecast_10m
            name: Forecast 10m
          - type: tile
            entity: input_text.luna_forecast_1h
            name: Forecast 1h
          - type: tile
            entity: input_text.luna_forecast_later
            name: Forecast later
          - type: tile
            entity: input_text.luna_anomaly_status
            name: Anomaly
          - type: tile
            entity: input_text.luna_personal_assistant_status
            name: Personal Assistant
      - cards:
          - type: heading
            heading: Timeline, Trace & Health
            icon: mdi:timeline-text
          - type: tile
            entity: input_text.luna_timeline_last_event
            name: Last event
          - type: tile
            entity: input_text.luna_timeline_previous_event
            name: Previous event
          - type: tile
            entity: input_text.luna_trace_status
            name: Trace
          - type: tile
            entity: input_text.luna_explain_status
            name: Explain
          - type: tile
            entity: input_text.luna_health_status
            name: Health
          - type: tile
            entity: input_text.luna_selfcheck_status
            name: Self-check
          - type: tile
            entity: input_text.luna_verifier_status
            name: Verifier
