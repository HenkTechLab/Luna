title: Luna
views:
  - title: Luna
    path: luna
    icon: mdi:robot-excited
    type: sections
    max_columns: 4
    header:
      layout: responsive
      badges_position: top
      card:
        type: markdown
        text_only: true
        content: |
          # Luna Command Center
          Rustig, modern en volledig opgebouwd uit standaard Home Assistant-kaarten.
    badges:
      - type: entity
        entity: binary_sensor.luna_veilig_fail_closed
        show_name: true
        show_state: true
        color: green
      - type: entity
        entity: input_select.luna_ai_mode
        show_name: true
        show_state: true
        color: purple
      - type: entity
        entity: input_select.luna_actiemodus
        show_name: true
        show_state: true
        color: blue
    sections:
      - type: grid
        background:
          color: primary
          opacity: 8
        cards:
          - type: heading
            heading: Directe bediening
            heading_style: title
            icon: mdi:flash
          - type: tile
            entity: input_select.luna_language_taal
            name: Taal
            icon: mdi:translate
            features_position: bottom
            features:
              - type: select-options
                style: dropdown
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_select.luna_actiemodus
            name: Actiemodus
            icon: mdi:shield-lock
            features_position: bottom
            features:
              - type: select-options
                style: dropdown
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_select.luna_ai_mode
            name: AI-modus
            icon: mdi:brain
            features_position: bottom
            features:
              - type: select-options
                style: dropdown
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_boolean.luna_physical_control
            name: Fysieke bediening
            icon: mdi:power
            features:
              - type: toggle
            grid_options:
              columns: 6
              rows: 2

      - type: grid
        background:
          color: green
          opacity: 7
        cards:
          - type: heading
            heading: Kernstatus
            heading_style: title
            icon: mdi:shield-check
          - type: tile
            entity: input_text.luna_installation_status
            name: Installatie
            icon: mdi:package-variant-closed-check
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: binary_sensor.luna_configuratie_gereed
            name: Configuratie
            icon: mdi:cog-check
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_text.luna_health_status
            name: Gezondheid
            icon: mdi:heart-pulse
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_text.luna_selfcheck_status
            name: Zelfcontrole
            icon: mdi:check-decagram
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_text.luna_timeline_status
            name: Tijdlijn
            icon: mdi:timeline-check
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_text.luna_evidence_status
            name: Verificatie
            icon: mdi:shield-search
            grid_options:
              columns: 6
              rows: 2

      - type: grid
        background:
          color: purple
          opacity: 7
        cards:
          - type: heading
            heading: Intelligentie
            heading_style: title
            icon: mdi:brain
          - type: tile
            entity: input_text.luna_memory_status
            name: Geheugen
            icon: mdi:database
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: counter.luna_memory_records
            name: Geheugenrecords
            icon: mdi:counter
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_text.luna_prediction_status
            name: Voorspelling
            icon: mdi:crystal-ball
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_number.luna_prediction_score
            name: Betrouwbaarheid voorspelling
            icon: mdi:percent-circle
            features:
              - type: bar-gauge
                min: 0
                max: 100
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_text.luna_routine_status
            name: Routine
            icon: mdi:repeat
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_number.luna_routine_reliability
            name: Betrouwbaarheid routine
            icon: mdi:gauge
            features:
              - type: bar-gauge
                min: 0
                max: 100
            grid_options:
              columns: 6
              rows: 2

      - type: grid
        background:
          color: orange
          opacity: 7
        cards:
          - type: heading
            heading: Planning & inzicht
            heading_style: title
            icon: mdi:home-lightning-bolt
          - type: tile
            entity: input_text.luna_platformstatus
            name: Platform
            icon: mdi:state-machine
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_text.luna_analytics_status
            name: Analytics
            icon: mdi:chart-line
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_text.luna_planner_status
            name: Planner
            icon: mdi:calendar-check
            grid_options:
              columns: 4
              rows: 2
          - type: tile
            entity: input_text.luna_proactive_proposal
            name: Voorstel
            icon: mdi:lightbulb-on-outline
            grid_options:
              columns: 4
              rows: 2
          - type: tile
            entity: input_text.luna_maintenance_status
            name: Onderhoud
            icon: mdi:wrench-check
            grid_options:
              columns: 4
              rows: 2

      - type: grid
        column_span: 2
        background:
          color: blue
          opacity: 5
        cards:
          - type: heading
            heading: Tijdlijn & beslissingen
            heading_style: title
            icon: mdi:timeline-text
          - type: tile
            entity: input_text.luna_last_event
            name: Laatste gebeurtenis
            icon: mdi:history
            grid_options:
              columns: 12
              rows: 2
          - type: tile
            entity: input_text.luna_timeline_status
            name: Tijdlijnstatus
            icon: mdi:timeline-text
            grid_options:
              columns: 12
              rows: 2
          - type: tile
            entity: input_text.luna_learning_status
            name: Leerstatus
            icon: mdi:school
            grid_options:
              columns: 12
              rows: 2
          - type: tile
            entity: input_text.luna_decision_status
            name: Beslisstatus
            icon: mdi:scale-balance
            grid_options:
              columns: 12
              rows: 2

  - title: Setup
    path: setup
    icon: mdi:tune-variant
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Sensoren & apparaten
            heading_style: title
            icon: mdi:tune-variant
          - type: markdown
            content: |
              Kies hier rechtstreeks wat Luna mag observeren. **Niet ingesteld** is toegestaan. Het toevoegen van een bestuurbaar apparaat schakelt fysieke bediening niet in.
          - type: tile
            entity: select.luna_aanwezigheidsbron
            name: Aanwezigheid
            icon: mdi:home-account
            features_position: bottom
            features:
              - type: select-options
                style: dropdown
          - type: tile
            entity: select.luna_temperatuurbron
            name: Hoofdtemperatuur
            icon: mdi:thermometer
            features_position: bottom
            features:
              - type: select-options
                style: dropdown
          - type: tile
            entity: select.luna_energiebron
            name: Energie
            icon: mdi:lightning-bolt
            features_position: bottom
            features:
              - type: select-options
                style: dropdown
          - type: tile
            entity: select.luna_vermogenbron
            name: Vermogen
            icon: mdi:flash
            features_position: bottom
            features:
              - type: select-options
                style: dropdown
          - type: tile
            entity: select.luna_agendabron
            name: Agenda
            icon: mdi:calendar
            features_position: bottom
            features:
              - type: select-options
                style: dropdown

      - type: grid
        cards:
          - type: heading
            heading: Extra observaties
            icon: mdi:database-eye
          - type: tile
            entity: select.luna_observatie_toevoegen
            name: Observatie toevoegen
            icon: mdi:database-plus
            features_position: bottom
            features:
              - type: select-options
                style: dropdown
          - type: tile
            entity: select.luna_observatie_verwijderen
            name: Observatie verwijderen
            icon: mdi:database-minus
            features_position: bottom
            features:
              - type: select-options
                style: dropdown
          - type: tile
            entity: sensor.luna_gekoppelde_bronnen
            name: Aantal gekoppelde bronnen
            icon: mdi:database-eye

      - type: grid
        cards:
          - type: heading
            heading: Bestuurbare apparaten
            icon: mdi:devices
          - type: markdown
            content: |
              Hier kies je alleen welke apparaten Luna **kent als bestuurbaar**. Automatische fysieke bediening blijft afzonderlijk uit en fail-closed.
          - type: tile
            entity: select.luna_apparaat_toevoegen
            name: Apparaat toevoegen
            icon: mdi:devices-plus
            features_position: bottom
            features:
              - type: select-options
                style: dropdown
          - type: tile
            entity: select.luna_apparaat_verwijderen
            name: Apparaat verwijderen
            icon: mdi:devices-minus
            features_position: bottom
            features:
              - type: select-options
                style: dropdown
          - type: tile
            entity: sensor.luna_gekoppelde_apparaten
            name: Aantal gekoppelde apparaten
            icon: mdi:devices

      - type: grid
        cards:
          - type: heading
            heading: Actuele Luna-bronnen
            icon: mdi:connection
          - type: tile
            entity: binary_sensor.luna_aanwezigheid
            name: Aanwezigheid
            icon: mdi:home-account
          - type: tile
            entity: sensor.luna_temperatuur
            name: Temperatuur
            icon: mdi:thermometer
          - type: tile
            entity: sensor.luna_energie
            name: Energie
            icon: mdi:lightning-bolt
          - type: tile
            entity: sensor.luna_vermogen
            name: Vermogen
            icon: mdi:flash
          - type: tile
            entity: sensor.luna_agenda
            name: Agenda
            icon: mdi:calendar

      - type: grid
        cards:
          - type: heading
            heading: Installatie
            icon: mdi:tune-variant
          - type: tile
            entity: input_select.luna_installatieprofiel
            name: Installatieprofiel
            icon: mdi:package-variant-closed
          - type: tile
            entity: input_text.luna_platformstatus
            name: Platformstatus
            icon: mdi:state-machine
          - type: tile
            entity: input_text.luna_language_status
            name: Taalstatus
            icon: mdi:translate
          - type: tile
            entity: input_text.luna_safety_status
            name: Veiligheidsstatus
            icon: mdi:shield-check

      - type: grid
        cards:
          - type: heading
            heading: AI backends
            icon: mdi:brain-circuit
          - type: tile
            entity: input_text.luna_ai_backend_light
            name: Licht model
            icon: mdi:feather
          - type: tile
            entity: input_text.luna_ai_backend_heavy
            name: Zwaar model
            icon: mdi:weight
          - type: tile
            entity: input_text.luna_ai_queue_status
            name: Wachtrijstatus
            icon: mdi:format-list-bulleted

      - type: grid
        cards:
          - type: heading
            heading: Veiligheid
            icon: mdi:shield-lock
          - type: tile
            entity: binary_sensor.luna_veilig_fail_closed
            name: Fail-closed actief
            icon: mdi:shield-check
          - type: markdown
            content: |
              **Fysieke bediening** blijft uit totdat alle gebruikte entiteiten bewust zijn gecontroleerd.

              **Lokale AI** adviseert alleen en is nooit een autorisatiebron.
