  {
    "id": "1787235695890",
    "alias": "Luna Prediction Core",
    "description": "Prediction Core v2.1. Betrouwbaarheid blijft uitsluitend gebaseerd op BEWEZEN_GOED/SLECHT; daarnaast wordt bewijsdekking apart gemeten en krijgt Prediction een readiness/calibratiestatus. ONBEKEND blijft apart en is nooit succes of fout.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "time_pattern",
        "minutes": "/30"
      },
      {
        "trigger": "state",
        "entity_id": [
          "counter.luna_prediction_goede_beslissingen_totaal",
          "counter.luna_prediction_slechte_beslissingen_totaal",
          "counter.luna_prediction_onbekende_beslissingen_totaal"
        ]
      }
    ],
    "conditions": [],
    "actions": [
      {
        "variables": {
          "goed": "{{ states('counter.luna_prediction_goede_beslissingen_totaal') | int(0) }}",
          "slecht": "{{ states('counter.luna_prediction_slechte_beslissingen_totaal') | int(0) }}",
          "onbekend": "{{ states('counter.luna_prediction_onbekende_beslissingen_totaal') | int(0) }}"
        },
        "note": "Prediction v2 stap 1: lees alleen ruwe bewezen/onbekende tellers."
      },
      {
        "variables": {
          "bewezen_totaal": "{{ goed + slecht }}",
          "waargenomen_totaal": "{{ goed + slecht + onbekend }}",
          "dekking": "{{ (((goed+slecht)*100/(goed+slecht+onbekend)) if (goed+slecht+onbekend)>0 else 0)|round(0)|int }}"
        },
        "note": "Prediction v2 stap 2: bereken totalen nadat ruwe tellers bestaan."
      },
      {
        "variables": {
          "succes": "{{ ((goed * 100 / bewezen_totaal) if bewezen_totaal > 0 else 0) | round(0) | int }}",
          "bewijsfactor": "{{ ([bewezen_totaal, 10] | min / 10) }}"
        },
        "note": "Prediction v2 stap 3: succesratio en bewijsfactor."
      },
      {
        "variables": {
          "betrouwbaarheid": "{{ (succes * bewijsfactor) | round(0) | int }}",
          "readiness": "{% if bewezen_totaal < 5 %}LEREN{% elif bewezen_totaal < 10 %}KALIBREREN{% elif dekking < 50 %}LAGE_DEKKING{% elif betrouwbaarheid < 60 %}VOORZICHTIG{% else %}MEETBAAR{% endif %}",
          "unknown_ratio": "{{ ((onbekend*100/waargenomen_totaal) if waargenomen_totaal>0 else 0)|round(0)|int }}"
        },
        "note": "Prediction v2 stap 4: uiteindelijke betrouwbaarheid."
      },
      {
        "action": "input_number.set_value",
        "target": {
          "entity_id": "input_number.luna_prediction_coverage"
        },
        "data": {
          "value": "{{ dekking }}"
        }
      },
      {
        "action": "input_number.set_value",
        "target": {
          "entity_id": "input_number.luna_prediction_betrouwbaarheid"
        },
        "data": {
          "value": "{{ betrouwbaarheid }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_prediction_laatste_voorspelling"
        },
        "data": {
          "value": "{{ ('Prediction ' ~ readiness ~ ' · betrouwbaarheid=' ~ betrouwbaarheid ~ '% · bewijsdekking=' ~ dekking ~ '% · bewezen=' ~ bewezen_totaal ~ ' (goed=' ~ goed ~ ', slecht=' ~ slecht ~ ') · onbekend=' ~ onbekend ~ ' (' ~ unknown_ratio ~ '% van waargenomen) · ONBEKEND telt nooit als succes/fout')[:255] }}"
        }
      },
      {
        "action": "input_datetime.set_datetime",
        "target": {
          "entity_id": "input_datetime.luna_prediction_laatste_update"
        },
        "data": {
          "datetime": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        }
      }
    ],
    "mode": "restart",
    "initial_state": false
  }
]
