  {
    "id": "1787235581756",
    "alias": "Luna Mega Integrator Core",
    "description": "Luna Mega Integrator v2.0. Centrale deterministische observatielaag: modulecatalogus, afhankelijkheden, fail-closed veiligheid, geheugenkwaliteit, Prediction-dekking en lokale-AI-efficiëntie. Stuurt geen apparaten aan.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "time_pattern",
        "minutes": "/15",
        "seconds": 35
      },
      {
        "trigger": "homeassistant",
        "event": "start"
      }
    ],
    "conditions": [],
    "actions": [
      {
        "variables": {
          "module_json": "{% set ns=namespace(total=0,on=0,off=0,unavailable=0,never=0,test=0) %}{% for e in states.automation %}{% set n=e.attributes.friendly_name|default('',true) %}{% if e.entity_id.startswith('automation.luna_') or e.entity_id.startswith('automation.ai_luna_') or n.startswith('Luna ') or n.startswith('AI - Luna') %}{% set ns.total=ns.total+1 %}{% if e.state=='on' %}{% set ns.on=ns.on+1 %}{% elif e.state=='off' %}{% set ns.off=ns.off+1 %}{% else %}{% set ns.unavailable=ns.unavailable+1 %}{% endif %}{% if e.attributes.last_triggered is none %}{% set ns.never=ns.never+1 %}{% endif %}{% if 'test' in n|lower or 'test' in e.entity_id %}{% set ns.test=ns.test+1 %}{% endif %}{% endif %}{% endfor %}{{ {'total':ns.total,'on':ns.on,'off':ns.off,'unavailable':ns.unavailable,'never':ns.never,'test':ns.test}|to_json }}",
          "kritiek": "{{ states('input_number.luna_health_kritieke_storingen')|int(0) }}",
          "modus": "{{ states('input_select.luna_actiemodus') }}",
          "verifier": "{{ states('input_text.luna_verifier_status') }}",
