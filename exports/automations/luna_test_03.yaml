    "description": "Luna AI Metrics v1.1. Vat lokale AI-belasting samen zonder zelf AI aan te roepen. Toont totaal 4B/8B-gebruik, cache-hitratio en vanaf invoering van deze meting gemiddelde inference- en wachttijd plus afzonderlijke 4B/8B-gemiddelden; piek-CPU en minimum vrij RAM komen uit de bestaande resource sampler.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "homeassistant",
        "event": "start",
        "id": "start"
      },
      {
        "trigger": "time_pattern",
        "minutes": "/5",
        "id": "periodiek"
      },
      {
        "trigger": "state",
        "entity_id": [
          "counter.luna_ollama_gemeten_taken",
          "counter.luna_ollama_cache_hits",
          "counter.luna_ollama_cache_misses"
        ],
        "id": "wijziging"
      }
    ],
    "conditions": [],
    "actions": [
      {
        "variables": {
          "taken": "{{ states('counter.luna_ollama_taken') | int(0) }}",
          "taken4": "{{ states('counter.luna_ollama_4b_taken') | int(0) }}",
          "taken8": "{{ states('counter.luna_ollama_8b_taken') | int(0) }}",
          "gemeten": "{{ states('counter.luna_ollama_gemeten_taken') | int(0) }}",
          "hits": "{{ states('counter.luna_ollama_cache_hits') | int(0) }}",
          "misses": "{{ states('counter.luna_ollama_cache_misses') | int(0) }}",
          "totaal_duur": "{{ states('input_number.luna_ollama_totaal_duur') | float(0) }}",
          "totaal_wacht": "{{ states('input_number.luna_ollama_totaal_wachttijd') | float(0) }}",
          "piek_cpu": "{{ states('input_number.luna_ollama_piek_cpu') | float(0) | round(0) | int }}",
          "min_ram": "{{ states('input_number.luna_ollama_min_vrij_ram') | float(0) | round(0) | int }}",
          "gemeten4": "{{ states('counter.luna_ollama_4b_gemeten') | int(0) }}",
          "gemeten8": "{{ states('counter.luna_ollama_8b_gemeten') | int(0) }}",
          "duur4": "{{ states('input_number.luna_ollama_4b_totaal_duur') | float(0) }}",
          "duur8": "{{ states('input_number.luna_ollama_8b_totaal_duur') | float(0) }}"
        }
      },
      {
        "variables": {
          "cache_pct": "{{ ((hits * 100 / (hits + misses)) if (hits + misses) > 0 else 0) | round(0) | int }}",
          "avg_duur": "{{ ((totaal_duur / gemeten) if gemeten > 0 else 0) | round(0) | int }}",
          "avg_wacht": "{{ ((totaal_wacht / gemeten) if gemeten > 0 else 0) | round(0) | int }}",
          "avg4": "{{ ((duur4 / gemeten4) if gemeten4 > 0 else 0) | round(0) | int }}",
          "avg8": "{{ ((duur8 / gemeten8) if gemeten8 > 0 else 0) | round(0) | int }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_ollama_metrics_status"
