[
  {
    "id": "1787235569165",
    "alias": "Luna - laatste sturing vastleggen",
    "description": "Luna Sturing/Trace/Timeline/Explain v2.0. Legt een relevante sturing één keer vast en werkt direct de trace-status, Timeline en leesbare uitleg bij. Vervangt de losse Trace-, Timeline- en Explain-doorvoerautomations. Stuurt zelf geen apparaten aan.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "state",
        "entity_id": [
          "input_text.luna_shadow_state",
          "input_text.luna_shadow_state",
          "input_text.luna_shadow_state",
          "input_boolean.luna_shadow_binary",
          "input_boolean.luna_shadow_binary",
          "input_boolean.luna_shadow_binary",
          "input_boolean.luna_shadow_binary"
        ],
        "to": "on"
      },
      {
        "trigger": "state",
        "entity_id": [
          "input_text.luna_shadow_state",
          "input_text.luna_shadow_state",
          "input_text.luna_shadow_state",
          "input_boolean.luna_shadow_binary",
          "input_boolean.luna_shadow_binary",
          "input_boolean.luna_shadow_binary",
          "input_boolean.luna_shadow_binary"
        ],
        "to": "off"
      }
    ],
    "conditions": [],
    "actions": [
      {
        "variables": {
          "bron": "{{ 'handmatig' if trigger.to_state.context.user_id else ('automatisch' if trigger.to_state.context.parent_id else 'extern/onbekend') }}",
          "trace_bewijs": "{{ 'context' if bron in ['automatisch','handmatig'] else 'onzeker' }}",
          "oude_timeline": "{{ states('input_text.luna_timeline_laatste_gebeurtenis') if states('input_text.luna_timeline_laatste_gebeurtenis') not in ['unknown','unavailable','none',''] else 'Geen vorige gebeurtenis' }}",
          "nieuwe_sturing": "{{ (now().strftime('%d-%m %H:%M') ~ ' · ' ~ trigger.to_state.name ~ ' → ' ~ trigger.to_state.state ~ ' · lux ' ~ (states('input_number.luna_shadow_numeric')|float(0)|round(0)) ~ ' · regen ' ~ states('input_boolean.luna_shadow_binary') ~ ' · wind ' ~ (state_attr('weather.forecast_thuis','wind_speed')|float(0)|round(1)) ~ ' · ' ~ bron)[:255] }}",
          "geheugen_beslissing": "{{ states('input_text.luna_memory_laatste_beslissing') }}",
          "geheugen_bewijs": "{{ states('input_text.luna_memory_laatste_bewijs') }}",
          "geheugen_bron": "{{ states('input_text.luna_memory_laatste_bron') }}",
          "geheugen_betrouwbaarheid": "{{ states('input_number.luna_memory_laatste_betrouwbaarheid') }}",
          "explain_uitleg": "{{ geheugen_beslissing if geheugen_beslissing not in ['unknown','unavailable','none',''] else nieuwe_sturing }}",
          "explain_bewijs": "{% set basis = geheugen_bewijs if geheugen_bewijs not in ['unknown','unavailable','none',''] else ('Bron: ' ~ geheugen_bron ~ ' · betrouwbaarheid ' ~ geheugen_betrouwbaarheid ~ '%') %}{% if bron == 'automatisch' %}{{ (basis[:175] ~ ' · automatische HA-context; exacte automation vereist echte trace')[:255] }}{% elif bron == 'handmatig' %}{{ (basis[:205] ~ ' · handmatige gebruikerscontext')[:255] }}{% else %}{{ (basis[:205] ~ ' · veroorzaker nog niet bewezen')[:255] }}{% endif %}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_laatste_sturing_trace_context"
        },
        "data": {
          "value": "{{ ('entity=' ~ trigger.entity_id ~ '; context=' ~ (trigger.to_state.context.id | default('', true)) ~ '; parent=' ~ (trigger.to_state.context.parent_id | default('', true)) ~ '; bron=' ~ bron)[:255] }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_laatste_sturing"
        },
        "data": {
          "value": "{{ nieuwe_sturing }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_timeline_vorige_gebeurtenis"
        },
        "data": {
          "value": "{{ oude_timeline[:255] }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_timeline_laatste_gebeurtenis"
        },
        "data": {
          "value": "{{ nieuwe_sturing }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_trace_status"
        },
        "data": {
          "value": "{{ ('entity=' ~ trigger.entity_id ~ ';bron=' ~ bron ~ ';bewijs=' ~ trace_bewijs)[:255] }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_explain_laatste_uitleg"
        },
        "data": {
          "value": "{{ explain_uitleg[:255] }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_explain_laatste_bewijs"
        },
        "data": {
          "value": "{{ explain_bewijs[:255] }}"
        }
      },
      {
        "action": "logbook.log",
        "data": {
          "name": "Luna sturing",
          "message": "{{ nieuwe_sturing }}",
          "entity_id": "input_text.luna_laatste_sturing"
        }
      },
      {
        "action": "todo.add_item",
        "target": {
          "entity_id": "todo.luna_timeline"
        },
        "data": {
          "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · TRACE · {{ trigger.entity_id }}",
          "description": "entity={{ trigger.entity_id }} | bron={{ bron }} | status={{ trace_bewijs }} | exacte automationnaam niet bewezen zonder echte trace"
        },
        "continue_on_error": true
      }
    ],
    "mode": "queued",
    "max": 20,
    "max_exceeded": "silent",
    "initial_state": false
  },
