    "alias": "Luna Ollama queue watchdog",
    "description": "Luna Ollama watchdog v1.1. Herstelt uitsluitend een achtergebleven inference-meetvlag. De vlag wordt gereset na HA-start, wanneer de centrale queue langer dan twee minuten uit staat, of wanneer de queue aantoonbaar op WACHT staat terwijl de vlag al langer dan twee minuten aan is. Een echte DRAAIT-status wordt nooit door deze watchdog onderbroken.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "homeassistant",
        "event": "start",
        "id": "start"
      },
      {
        "trigger": "time_pattern",
        "minutes": "/1",
        "id": "controle"
      }
    ],
    "actions": [
      {
        "choose": [
          {
            "conditions": [
              {
                "condition": "trigger",
                "id": "start"
              }
            ],
            "sequence": [
              {
                "action": "input_boolean.turn_off",
                "target": {
                  "entity_id": "input_boolean.luna_ollama_inference_actief"
