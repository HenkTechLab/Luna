              }
            ]
          },
          {
            "conditions": [
              {
                "condition": "trigger",
                "id": "controle"
              },
              {
                "condition": "state",
                "entity_id": "input_boolean.luna_ollama_inference_actief",
                "state": "on",
                "for": {
                  "minutes": 2
                }
              },
              {
                "condition": "or",
                "conditions": [
                  {
                    "condition": "state",
                    "entity_id": "script.luna_ollama_queue",
                    "state": "off"
                  },
                  {
                    "condition": "template",
                    "value_template": "{{ states('input_text.luna_ollama_queue_status').startswith('WACHT') }}"
                  }
                ]
              }
            ],
            "sequence": [
              {
                "action": "input_boolean.turn_off",
                "target": {
                  "entity_id": "input_boolean.luna_ollama_inference_actief"
