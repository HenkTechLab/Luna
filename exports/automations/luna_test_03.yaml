    "alias": "Luna Persoonlijke Assistent Core",
    "description": "Luna Persoonlijke Assistent v2.0. Read-only dagoverzicht met contextfiltering, herhalingsonderdrukking en scheiding vandaag/binnenkort. Lege of niet-relevante Health/energie/routinecontext wordt niet aan AI gevoerd.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
