              },
              "required": true
            },
            "vandaag": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "binnenkort": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "huis": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "samenvatting": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            }
          },
          "complexity": "light",
          "cacheable": false,
          "freshness": "live",
          "task_category": "persoonlijk"
        },
        "response_variable": "pa_ai",
        "continue_on_error": true
      },
      {
        "if": [
          {
            "condition": "template",
            "value_template": "{{ pa_ai is defined and pa_ai.data is defined }}"
          }
        ],
        "then": [
          {
            "variables": {
              "pa_summary": "{{ 'Geen nieuwe bijzonderheden' if pa_ai.data.status=='GEEN_NIEUWS' else pa_ai.data.samenvatting }}"
            }
          },
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_persoonlijke_assistent_status"
            },
            "data": {
              "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · ' ~ pa_ai.data.status ~ ' · ' ~ pa_summary)[:255] }}"
