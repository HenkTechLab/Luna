                  "value": "{{ now().strftime('%d-%m %H:%M') }} {{ 'te vroeg' if trigger.id == 'placeholder_device_te_vroeg' else 'te laat' }}; lux {{ states('input_number.luna_shadow_numeric') }}; zonhoogte {{ state_attr('sun.sun','elevation') }}; weer {{ states('weather.forecast_thuis') }}; regen {{ states('input_boolean.luna_shadow_binary') }}"
