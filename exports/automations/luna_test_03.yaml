  {
    "id": "1787206864201",
    "alias": "Luna Learning Intake",
    "description": "Generieke intake voor Luna. Elke interne testgebeurtenis wordt conservatief verwerkt naar Memory, Decision Journal, Prediction-unknown en Routine shadow. Geen fysieke apparaatsturing en geen AI-autorisatie.",
    "triggers": [
      {
        "trigger": "state",
        "entity_id": "input_text.luna_event_input"
      }
    ],
    "conditions": [
      {
        "condition": "not",
        "conditions": [
          {
            "condition": "state",
            "entity_id": "input_text.luna_event_input",
            "state": [
              "unknown",
              "unavailable",
              "READY",
              "EMPTY",
              "LEEG",
              ""
            ]
          }
        ]
      }
    ],
    "actions": [
      {
        "event": "luna_runtime_event",
        "event_data": {
          "module": "memory",
          "record": "{{ trigger.to_state.state[:240] }}"
        }
      },
      {
        "event": "luna_runtime_event",
        "event_data": {
          "module": "decision",
          "record": "{{ ('observed · no autonomous action · ' ~ trigger.to_state.state)[:240] }}"
        }
      },
      {
        "action": "counter.increment",
        "target": {
          "entity_id": "counter.luna_prediction_unknown"
        }
      },
      {
        "event": "luna_runtime_event",
        "event_data": {
          "module": "prediction",
          "reliability": "{{ states('input_number.luna_prediction_reliability') | float(0) }}",
          "coverage": "{{ states('input_number.luna_prediction_coverage') | float(0) }}",
          "status": "LEARNING · outcome unknown"
        }
      },
      {
        "event": "luna_runtime_event",
        "event_data": {
          "module": "routine",
          "reliability": "{{ states('input_number.luna_routine_reliability') | float(0) }}",
          "evidence_days": "{{ states('input_number.luna_routine_evidence_days') | float(0) }}",
          "status": "SHADOW · observation stored"
        }
      },
      {
        "event": "luna_runtime_event",
        "event_data": {
          "module": "comfort",
          "status": "LEARNING · observation stored · no action"
        }
      },
      {
        "event": "luna_runtime_event",
        "event_data": {
          "module": "assistant",
          "status": "READY · read-only · event recorded"
        }
      }
    ],
    "mode": "queued",
    "max": 20
  },
  {
    "id": "1787235574642",
