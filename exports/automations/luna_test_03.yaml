    "description": "Slaat de laatste handmatige feedback met actuele omstandigheden blijvend op voor placeholder_device, placeholder_room en placeholder_cover. De bestaande sturingen blijven leidend.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
