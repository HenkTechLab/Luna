    "description": "Luna voorspellende huiscontrole v1.4. Voorspellingen krijgen een expliciete bewijssterkte op basis van forecast-beschikbaarheid, minimaal 10 beoordeelde beslissingen en 70% betrouwbaarheid. Bij weinig bewijs formuleert Luna alleen voorzichtige verwachtingen. Geen apparaatsturing.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
