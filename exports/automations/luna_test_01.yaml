          "safe_niet_goed": "{{ states('counter.luna_autonomie_safe_repair_niet_goed') | int(0) }}",
          "safe_totaal": "{{ safe_goed + safe_niet_goed }}",
          "safe_ratio": "{{ ((safe_goed * 100 / safe_totaal) if safe_totaal > 0 else 0) | round(0) | int }}",
          "safe_drempel": "{% if safe_niet_goed > 0 and safe_goed == 0 %}95{% elif safe_totaal >= 30 and safe_ratio >= 95 %}80{% elif safe_totaal >= 10 and safe_ratio >= 90 %}85{% elif safe_totaal >= 5 and safe_ratio < 80 %}95{% else %}90{% endif %}",
          "watchman_details": "{{ states('input_text.luna_health_watchman') }}",
          "sensor_details": "{{ 'huiskamer=' ~ states('input_number.luna_sensor_score_huiskamer') ~ '%, beweging=' ~ states('input_number.luna_sensor_score_beweging_huiskamer') ~ '%, tv=' ~ states('input_number.luna_sensor_score_tv') ~ '%, keuken=' ~ states('input_number.luna_sensor_score_keuken') ~ '%' }}",
          "beheer_goed": "{{ states('counter.luna_autonomie_automation_beheer_goed') | int(0) }}",
          "beheer_niet_goed": "{{ states('counter.luna_autonomie_automation_beheer_niet_goed') | int(0) }}",
          "beheer_totaal": "{{ beheer_goed + beheer_niet_goed }}",
          "beheer_ratio": "{{ ((beheer_goed * 100 / beheer_totaal) if beheer_totaal > 0 else 0) | round(0) | int }}",
          "beheer_drempel": "{% if beheer_niet_goed > 0 and beheer_goed < 5 %}95{% elif beheer_totaal >= 15 and beheer_ratio >= 95 %}85{% elif beheer_totaal >= 5 and beheer_ratio >= 95 %}90{% else %}95{% endif %}",
          "conflict_algemeen": "{{ states('input_text.luna_automation_scan_advies') }}",
          "safe_succes_geheugen": "{{ states('input_text.luna_safe_repair_laatste_succesvolle_entries') }}",
          "prediction_beoordelingen": "{{ states('counter.luna_prediction_goede_beslissingen_totaal') | int(0) + states('counter.luna_prediction_slechte_beslissingen_totaal') | int(0) }}",
          "autonomie_gereed": "{{ states('input_text.luna_autonomie_gereedheid').startswith('GEREED') }}",
          "verifier": "{{ states('input_text.luna_verifier_status') }}",
          "verifier_beheer_ok": "{{ verifier.startswith('BEHEER=OK') }}",
          "verifier_safe_ok": "{{ 'SAFE_REPAIR=OK' in verifier }}"
        }
      },
      {
        "action": "script.luna_ollama_background_queue",
        "data": {
          "task_name": "Luna zelfstandig Home Assistant beheer",
          "instructions": "Je bent Luna, zelfstandig beheerder van placeholder_users Home Assistant. Je doel is niet bestaande goede automations te vervangen, maar placeholder_user werk uit handen te nemen door problemen, afwijkingen, dubbelingen en verbeterkansen zelfstandig te beoordelen.\n\nActuele lokale bronnen:\n- Health: {{ health }}\n- Health advies: {{ health_advies }}\n- Kritieke storingen: {{ kritiek }}\n- Watchman belangrijk: {{ watchman }}\n- Watchman concrete referenties: {{ watchman_details }}\n- Conflict Watch zonwering: {{ conflict }}\n- Algemene automation-voorselectie: {{ conflict_algemeen }}\n- Analytics: {{ analytics }}\n- Sensorscore: {{ sensor_score }}%\n- Sensorbetrouwbaarheid per bron: {{ sensor_details }}\n- Prediction: {{ prediction }}\n- Prediction betrouwbaarheid: {{ prediction_score }}% op {{ prediction_beoordelingen }} beoordeelde beslissingen\n- Centrale autonomiebewijspoort: {{ states('input_text.luna_autonomie_gereedheid') }}\n- Deterministische lokale verifier: {{ verifier }}\n- Trace: {{ trace }}\n- Functionele validatie: {{ validatie }}\n- Validatiefouten: {{ validatiefouten }}\n- Vorig beheeradvies: {{ beheer_laatste }}\n- Laatste beheerleerervaring: {{ leerfeedback }}\n- Afgeleid leeradvies: {{ leeradvies }}\n\nBeoordeel vier rollen:\n1. BEHEERDER: conflicten, oude/dubbele automations, storingen en configuratieschuld.\n2. AFWIJKINGSBEWAKER: onverwacht sensor-, energie-, klimaat- of automatiseringsgedrag.\n3. OPTIMALISATOR: kansen om bestaande automations betrouwbaarder, rustiger of goedkoper te maken zonder hun functie te vervangen.\n4. UITLEGGER: benoem wat bewezen is, wat waarschijnlijk is en welk bewijs ontbreekt.\n\nRegels:\n- Verwijder nooit iets en adviseer nooit automatische verwijdering.\n- Veiligheidsautomations, alarm, rook/brand, sloten en noodfuncties nooit uitschakelen.\n- Bestaande lokale veiligheidslogica blijft leidend.\n- Gebruik alleen aangeleverde gegevens; verzin geen oorzaken, entity_id's of vervangers.\n- Gebruik het afgeleide leeradvies actief. NEGATIEF/GEEN_EFFECT/ONZEKER verlaagt autonomie: herhaal een vergelijkbare actie niet zonder nieuw concreet bewijs. POSITIEF mag confidence ondersteunen, maar nooit veiligheidsgrenzen verruimen.\n- Leg in evidence kort vast hoe eerdere leerfeedback de huidige keuze wel of niet beinvloedde.\n- Beoordeel alle vier rollen in dezelfde ronde. Je mag meerdere problemen tegelijk meenemen in summary en evidence. Kies voor action alleen de zwaarste vervolgactie die werkelijk nodig is; de overige bevindingen blijven onderdeel van dezelfde beheerregistratie.\n- Als niets nuttigs nodig is: action='GEEN' en summary='Geen actie nodig'.\n- action='CONTROLE' bij alleen nader bewijs verzamelen.\n- action='VOORSTEL' bij een concrete optimalisatie die nog niet zelfstandig uitgevoerd mag worden.\n- action='BEHEER' alleen als het bestaande Luna Automation Beheer opnieuw een conflictbeoordeling moet doen. Een autonome BEHEER-uitvoering vereist bovendien lokale validatiefouten=0 en Prediction betrouwbaarheid minimaal 70% en minimaal 10 blijvend beoordeelde beslissingen en de centrale autonomiebewijspoort moet GEREED zijn én de deterministische verifier moet BEHEER=OK melden; anders alleen CONTROLE of VOORSTEL.\n- action='SAFE_REPAIR' alleen bij concrete integratie-uitval die al onder de bestaande Luna Safe Repair valt.\n- notify alleen wanneer placeholder_user direct fysiek moet handelen vanwege veiligheid of een ernstig actief probleem. Gewone onderhoudsadviezen, batterijen, optimalisaties, onzekerheden en niet-urgente storingen nooit melden; alleen stil registreren.\n- summary maximaal 220 tekens en in helder Nederlands.\n- Actiemodus={{ actiemodus }}. Als deze niet exact Safe Repair is, kies voor wijzigingen maximaal VOORSTEL; BEHEER en SAFE_REPAIR mogen dan niet als uitvoeractie worden gekozen.\n- Safe Repair succesvol entrygeheugen: {{ safe_succes_geheugen }}\n- Safe Repair leerbewijs: goed={{ safe_goed }}, niet-goed={{ safe_niet_goed }}, totaal={{ safe_totaal }}, succesratio={{ safe_ratio }}%, actuele uitvoerdrempel={{ safe_drempel }}%. Gebruik dit uitsluitend voor SAFE_REPAIR; succes in deze categorie verruimt geen andere autonomie. Bij weinig of negatief bewijs blijft de drempel hoog.\n- Gebruik een aanwezigheidssensor met een geleerde betrouwbaarheid onder 80% nooit als enig bewijs voor een autonome wijziging. Verzamel dan een tweede onafhankelijke bron of kies CONTROLE/VOORSTEL.\n- Automation Beheer leerbewijs: goed={{ beheer_goed }}, niet-goed={{ beheer_niet_goed }}, succesratio={{ beheer_ratio }}%, actuele BEHEER-drempel={{ beheer_drempel }}%. Dit geldt uitsluitend voor automation-beheer.\n- Een algemene conflictscan is alleen een voorselectie. Kies nooit BEHEER uitsluitend op basis daarvan; een concrete kandidaat moet daarna door Automation Beheer met zijn eigen allowlist, vervangercheck, confidence en rollback worden bewezen.\n\nDOELGESTUURDE CONTEXT:\n- Doelprofiel={{ states('input_text.luna_doelprofiel') }}\n- Comfortprofiel={{ states('input_text.luna_comfortprofiel_status') }}\n- Vooruitblik={{ states('input_text.luna_vooruitblik_status') }}\n- Afwijking={{ states('input_text.luna_afwijking_status') }}\n- Simulatie={{ states('input_text.luna_simulatie_status') }}\nGebruik doelen alleen om opties te rangschikken. Ze mogen lokale veiligheidsregels, verifierpoorten, actiemodus of bewijsdrempels nooit versoepelen. Een geleerd patroon mag pas als uitvoeringskandidaat gelden nadat de simulatiestatus KLAAR_VOOR_VOORSTEL meldt; ook dan blijft de bestaande bevestigings-/veiligheidspoort leidend.",
          "structure": {
            "role": {
              "selector": {
                "select": {
                  "options": [
                    "BEHEERDER",
                    "AFWIJKINGSBEWAKER",
                    "OPTIMALISATOR",
                    "UITLEGGER"
                  ]
                }
              },
              "required": true
            },
            "action": {
              "selector": {
                "select": {
                  "options": [
                    "GEEN",
                    "CONTROLE",
                    "VOORSTEL",
                    "BEHEER",
                    "SAFE_REPAIR"
                  ]
                }
              },
              "required": true
            },
            "confidence": {
              "selector": {
                "number": {
                  "min": 0,
                  "max": 100,
                  "step": 1
                }
              },
              "required": true
            },
            "priority": {
              "selector": {
                "select": {
                  "options": [
                    "laag",
                    "normaal",
                    "hoog"
                  ]
                }
              },
              "required": true
            },
            "notify": {
              "selector": {
                "boolean": {}
              },
              "required": true
            },
            "summary": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "evidence": {
              "selector": {
                "text": {
                  "multiline": true
                }
              },
              "required": true
            }
          }
        },
        "response_variable": "zelfstandig_ai",
        "continue_on_error": true
      },
      {
        "if": [
          {
            "condition": "template",
            "value_template": "{{ zelfstandig_ai is defined and zelfstandig_ai.data is defined }}"
          }
        ],
        "then": [
          {
            "variables": {
              "rol": "{{ zelfstandig_ai.data.role }}",
              "actie": "{{ zelfstandig_ai.data.action }}",
              "zekerheid": "{{ (((zelfstandig_ai.data.confidence | float(0)) * 100) if (zelfstandig_ai.data.confidence | float(0)) <= 1 else (zelfstandig_ai.data.confidence | float(0))) | round(0) | int }}",
              "prioriteit": "{{ zelfstandig_ai.data.priority }}",
              "samenvatting": "{{ zelfstandig_ai.data.summary | trim }}",
              "bewijs": "{{ zelfstandig_ai.data.evidence | trim }}"
            }
          },
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_beheerder_laatste_advies"
            },
            "data": {
              "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · ' ~ rol ~ ' · ' ~ actie ~ ' · ' ~ zekerheid ~ '% · ' ~ samenvatting)[:255] }}"
            }
          },
          {
            "choose": [
              {
                "conditions": [
                  {
                    "condition": "template",
                    "value_template": "{{ actie == 'BEHEER' and zekerheid >= (beheer_drempel | int(95)) }}"
                  },
                  {
                    "condition": "numeric_state",
                    "entity_id": "counter.luna_validatie_fouten",
                    "below": 1
                  },
                  {
                    "condition": "numeric_state",
                    "entity_id": "input_number.luna_prediction_betrouwbaarheid",
                    "above": 69
                  },
                  {
                    "condition": "template",
                    "value_template": "{{ prediction_beoordelingen | int(0) >= 10 }}"
                  },
                  {
                    "condition": "state",
                    "entity_id": "input_select.luna_actiemodus",
                    "state": "Safe Repair"
                  },
                  {
                    "condition": "template",
                    "value_template": "{{ autonomie_gereed | bool(false) }}"
                  },
                  {
                    "condition": "template",
                    "value_template": "{{ verifier_beheer_ok | bool(false) }}"
                  }
                ],
                "sequence": [
                  {
                    "action": "input_text.set_value",
                    "target": {
                      "entity_id": "input_text.luna_autonomie_voor_actie"
                    },
                    "data": {
                      "value": "{{ (now().strftime('%Y-%m-%d %H:%M') ~ ' | actie=' ~ actie ~ ' | zekerheid=' ~ zekerheid ~ '% | health=' ~ health ~ ' | kritiek=' ~ kritiek ~ ' | watchman=' ~ watchman ~ ' | conflict=' ~ conflict ~ ' | prediction=' ~ prediction_score ~ '%')[:255] }}"
                    }
                  },
                  {
                    "action": "automation.trigger",
                    "target": {
                      "entity_id": "automation.ai_luna_automation_beheer"
                    },
                    "data": {
                      "skip_condition": false
                    }
                  }
                ]
              },
              {
                "conditions": [
                  {
                    "condition": "template",
                    "value_template": "{{ actie == 'SAFE_REPAIR' and zekerheid >= (safe_drempel | int(95)) }}"
                  },
                  {
                    "condition": "numeric_state",
                    "entity_id": "counter.luna_validatie_fouten",
                    "below": 1
                  },
                  {
                    "condition": "state",
                    "entity_id": "input_select.luna_actiemodus",
                    "state": "Safe Repair"
                  },
                  {
                    "condition": "state",
                    "entity_id": "input_boolean.luna_veilig_zelfherstel",
                    "state": "on"
                  },
                  {
                    "condition": "template",
                    "value_template": "{{ verifier_safe_ok | bool(false) }}"
                  }
                ],
                "sequence": [
                  {
                    "action": "input_text.set_value",
                    "target": {
                      "entity_id": "input_text.luna_autonomie_voor_actie"
                    },
                    "data": {
                      "value": "{{ (now().strftime('%Y-%m-%d %H:%M') ~ ' | actie=' ~ actie ~ ' | zekerheid=' ~ zekerheid ~ '% | health=' ~ health ~ ' | kritiek=' ~ kritiek ~ ' | watchman=' ~ watchman ~ ' | conflict=' ~ conflict ~ ' | prediction=' ~ prediction_score ~ '%')[:255] }}"
                    }
                  },
                  {
                    "action": "logbook.log",
                    "data": {
                      "name": "Luna fail-closed",
                      "message": "Geblokkeerde productieactie: automation.trigger · target={\"entity_id\":\"automation.luna_shadow_automation_target\"}",
                      "entity_id": "input_text.luna_laatste_uitvoeringsstatus",
                      "domain": "Luna"
                    },
                    "continue_on_error": true
                  }
                ]
              }
            ]
          },
          {
            "action": "todo.add_item",
            "target": {
              "entity_id": "todo.luna_timeline"
            },
            "data": {
              "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · ZELFSTANDIG · {{ rol }} · {{ actie }}",
