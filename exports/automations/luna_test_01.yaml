[
  {
    "id": "1787235225760",
    "alias": "AI - Luna Automation Beheer",
    "description": "Luna Automation Beheer v1.6. Beoordeelt dubbele/verouderde automations met CONTROLE, VOORSTEL en AI-UIT. Verwijdert nooit iets. AI-UIT vereist Safe Repair, een actieve kandidaat uit de expliciete allowlist en een lokaal verifieerbare actieve automation-vervanger. De confidence-drempel wordt uitsluitend binnen deze actiecategorie verdiend: standaard 95%, na bewezen foutloze postchecks gecontroleerd lager, en bij rollback direct weer streng. Na uitschakelen volgt directe nacontrole en zo nodig rollback.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "time_pattern",
        "hours": "/6",
        "id": "periodiek"
      },
      {
        "trigger": "state",
        "entity_id": "input_text.luna_automation_conflict_advies",
        "id": "conflict_changed"
      }
    ],
    "conditions": [],
    "actions": [
      {
        "variables": {
          "advies": "{{ states('input_text.luna_automation_conflict_advies') }}",
          "bekende_kandidaten": "automation.luna_shadow_automation_target,automation.luna_shadow_automation_target,automation.luna_shadow_automation_target,automation.luna_shadow_automation_target,automation.luna_shadow_automation_target,automation.luna_shadow_automation_target",
          "actiemodus": "{{ states('input_select.luna_actiemodus') }}",
          "beheer_goed": "{{ states('counter.luna_autonomie_automation_beheer_goed') | int(0) }}",
          "beheer_niet_goed": "{{ states('counter.luna_autonomie_automation_beheer_niet_goed') | int(0) }}",
          "beheer_totaal": "{{ beheer_goed + beheer_niet_goed }}",
          "beheer_ratio": "{{ ((beheer_goed * 100 / beheer_totaal) if beheer_totaal > 0 else 0) | round(0) | int }}",
          "beheer_drempel": "{% if beheer_niet_goed > 0 and beheer_goed < 5 %}95{% elif beheer_totaal >= 15 and beheer_ratio >= 95 %}85{% elif beheer_totaal >= 5 and beheer_ratio >= 95 %}90{% else %}95{% endif %}"
        }
      },
      {
        "action": "script.luna_ollama_background_queue",
        "data": {
          "task_name": "Luna Automation Beheer beoordeling",
          "instructions": "Beoordeel uitsluitend of er op basis van de aangeleverde Home Assistant-context reden is om een automation als dubbel/verouderd te behandelen. Je mag NOOIT iets verwijderen. Gebruik drie niveaus:\n- AI-CONTROLE = lage zekerheid, alleen signaleren.\n- AI-VOORSTEL = middelmatige zekerheid, alleen voorstel; niets uitschakelen.\n- AI-UIT = hoge zekerheid; alleen toegestaan als de kandidaat in de expliciete allowlist staat, de functie aantoonbaar volledig door een actieve vervanger wordt overgenomen en er geen unieke veiligheidsfunctie overblijft.\n\nKritieke automations zoals rookmelders, brand, alarm, sloten, noodfuncties en veiligheidssturingen zijn nooit kandidaat en staan daarom niet in de allowlist.\n\nActueel conflictadvies:\n{{ advies }}\n\nExpliciete allowlist voor AI-UIT:\n{{ bekende_kandidaten }}\n\nActuele states allowlist:\n{% for e in bekende_kandidaten.split(',') %}- {{ e }}={{ states(e) }} | laatste={{ state_attr(e,'last_triggered') }}\n{% endfor %}\n\nGeef candidate alleen als exact automation.* entity_id uit de allowlist. Bij twijfel niveau AI-CONTROLE. Verzin geen vervanger of bewijs.\nActiemodus={{ actiemodus }}. Als de actiemodus niet exact Safe Repair is, mag het resultaat nooit AI-UIT zijn; kies dan maximaal AI-VOORSTEL. Een kandidaat die al uit staat mag niet opnieuw als AI-UIT worden behandeld.\nAutomation-Beheer leerbewijs: goed={{ beheer_goed }}, niet-goed={{ beheer_niet_goed }}, succesratio={{ beheer_ratio }}%, actuele AI-UIT drempel={{ beheer_drempel }}%. Dit bewijs geldt uitsluitend voor automation uitschakelen en nooit voor andere actietypen.",
          "structure": {
            "niveau": {
              "selector": {
                "select": {
                  "options": [
                    "AI-CONTROLE",
                    "AI-VOORSTEL",
                    "AI-UIT"
                  ]
                }
              },
              "required": true
            },
            "candidate": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "confidence": {
              "selector": {
                "number": {
                  "min": 0,
                  "max": 100,
                  "step": 1
                }
              },
              "required": true
            },
            "reason": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "replacement": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            }
          }
        },
        "response_variable": "beheer_ai",
        "continue_on_error": true
      },
      {
        "if": [
          {
            "condition": "template",
            "value_template": "{{ beheer_ai is defined and beheer_ai.data is defined }}"
          }
        ],
        "then": [
          {
            "variables": {
              "niveau": "{{ beheer_ai.data.niveau }}",
              "candidate": "{{ beheer_ai.data.candidate | trim }}",
              "confidence": "{% set c = beheer_ai.data.confidence | float(0) %}{{ ([0, [((c * 100) if c > 0 and c <= 1 else c), 100] | min] | max) | round(0) | int }}",
              "reason": "{{ beheer_ai.data.reason | trim }}",
              "replacement": "{{ beheer_ai.data.replacement | trim }}",
              "candidate_allowed": "{{ candidate in bekende_kandidaten.split(',') }}",
              "replacement_active": "{{ replacement.startswith('automation.') and is_state(replacement, 'on') }}"
            }
          },
          {
            "choose": [
              {
                "conditions": [
                  {
                    "condition": "template",
                    "value_template": "{{ niveau == 'AI-UIT' and confidence >= (beheer_drempel | int(95)) and candidate_allowed and replacement_active }}"
                  },
                  {
                    "condition": "state",
                    "entity_id": "input_select.luna_actiemodus",
                    "state": "Safe Repair"
                  },
                  {
                    "condition": "template",
                    "value_template": "{{ is_state(candidate, 'on') }}"
                  }
                ],
                "sequence": [
                  {
                    "action": "input_text.set_value",
                    "target": {
                      "entity_id": "input_text.luna_autonomie_voor_actie"
                    },
                    "data": {
                      "value": "{{ (now().strftime('%Y-%m-%d %H:%M') ~ ' | actie=BEHEER | categorie=automation_uit | candidate=' ~ candidate ~ ' | candidate_state=' ~ states(candidate) ~ ' | replacement=' ~ replacement ~ ' | replacement_state=' ~ states(replacement) ~ ' | zekerheid=' ~ confidence ~ '%')[:255] }}"
                    },
                    "continue_on_error": true
                  },
                  {
                    "action": "logbook.log",
                    "data": {
                      "name": "Luna fail-closed",
                      "message": "Geblokkeerde productieactie: pyscript.luna_mark_ai_uit · target=\"{{ candidate }}\"",
                      "entity_id": "input_text.luna_laatste_uitvoeringsstatus",
                      "domain": "Luna"
                    },
                    "continue_on_error": true
                  },
                  {
                    "delay": {
                      "seconds": 1
                    }
                  },
                  {
                    "choose": [
                      {
                        "conditions": [
                          {
                            "condition": "template",
                            "value_template": "{{ is_state(candidate, 'off') and is_state(replacement, 'on') }}"
                          }
                        ],
                        "sequence": [
                          {
                            "action": "counter.increment",
                            "target": {
                              "entity_id": "counter.luna_zelfstandige_acties"
                            },
                            "continue_on_error": true
                          },
                          {
                            "action": "counter.increment",
                            "target": {
                              "entity_id": "counter.luna_autonomie_automation_beheer_goed"
                            },
                            "continue_on_error": true
                          },
                          {
                            "action": "todo.add_item",
                            "target": {
                              "entity_id": "todo.luna_timeline"
                            },
                            "data": {
                              "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · AI-UIT · {{ candidate }}",
                              "description": "{{ ('Uitgeschakeld na lokale bewijspoort. Zekerheid=' ~ confidence ~ '%. Reden=' ~ reason ~ '. Vervanger=' ~ replacement ~ ' bleef actief. Verwijderd=nee. Postcheck=geslaagd.')[:500] }}"
                            }
                          },
                          {
                            "action": "logbook.log",
                            "data": {
                              "name": "Luna Automation Beheer",
                              "message": "{{ 'AI-UIT: ' ~ candidate ~ ' uitgeschakeld · zekerheid ' ~ confidence ~ '% · vervanger actief: ' ~ replacement ~ ' · ' ~ reason }}",
                              "entity_id": "input_text.luna_automation_conflict_advies",
                              "domain": "luna_automation_beheer"
                            }
                          }
                        ]
                      },
                      {
                        "conditions": [
                          {
                            "condition": "template",
                            "value_template": "{{ is_state(candidate, 'off') and not is_state(replacement, 'on') }}"
                          }
                        ],
                        "sequence": [
                          {
                            "action": "logbook.log",
                            "data": {
                              "name": "Luna fail-closed",
                              "message": "Geblokkeerde productieactie: automation.turn_on · target={\"entity_id\":\"{{ candidate }}\"}",
                              "entity_id": "input_text.luna_laatste_uitvoeringsstatus",
                              "domain": "Luna"
                            },
                            "continue_on_error": true
                          },
                          {
                            "action": "counter.increment",
                            "target": {
                              "entity_id": "counter.luna_autonomie_automation_beheer_niet_goed"
                            },
                            "continue_on_error": true
                          },
                          {
                            "action": "input_text.set_value",
                            "target": {
                              "entity_id": "input_text.luna_autonomie_leerervaring"
                            },
                            "data": {
                              "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · AUTOMATION_BEHEER · ROLLBACK · vervanger niet actief · ' ~ candidate)[:255] }}"
                            }
                          },
                          {
                            "action": "todo.add_item",
                            "target": {
                              "entity_id": "todo.luna_timeline"
                            },
                            "data": {
                              "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · ROLLBACK · {{ candidate }}",
                              "description": "{{ ('AI-UIT direct teruggedraaid: vervanger ' ~ replacement ~ ' was na uitschakelen niet meer actief. Kandidaat functioneel opnieuw ingeschakeld; niets verwijderd. AI-UIT naam blijft als auditmarkering zichtbaar.')[:500] }}"
                            },
                            "continue_on_error": true
                          }
                        ]
                      }
                    ],
                    "default": [
                      {
                        "action": "counter.increment",
                        "target": {
                          "entity_id": "counter.luna_autonomie_automation_beheer_niet_goed"
                        },
                        "continue_on_error": true
                      },
                      {
                        "action": "todo.add_item",
                        "target": {
                          "entity_id": "todo.luna_timeline"
                        },
                        "data": {
                          "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · AI-CONTROLE · uitschakeling niet bevestigd",
                          "description": "{{ ('Geen geslaagde state-postcheck voor ' ~ candidate ~ '; kandidaat=' ~ states(candidate) ~ ', vervanger=' ~ replacement ~ '=' ~ states(replacement) ~ '. Geen extra wijziging uitgevoerd.')[:500] }}"
                        },
                        "continue_on_error": true
                      }
                    ]
                  }
                ]
              },
              {
                "conditions": [
                  {
                    "condition": "template",
                    "value_template": "{{ niveau == 'AI-VOORSTEL' or (niveau == 'AI-UIT' and (confidence < 95 or not candidate_allowed or not replacement_active or actiemodus != 'Safe Repair' or not is_state(candidate, 'on'))) }}"
                  }
                ],
                "sequence": [
                  {
                    "action": "todo.add_item",
                    "target": {
                      "entity_id": "todo.luna_timeline"
                    },
                    "data": {
                      "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · AI-VOORSTEL · {{ candidate if candidate else 'geen kandidaat' }}",
                      "description": "Geen wijziging uitgevoerd. Zekerheid={{ confidence }}%. Reden={{ reason }}. Vervanger={{ replacement if replacement else 'onbekend' }}."
                    }
                  }
                ]
              }
            ],
            "default": [
              {
                "action": "todo.add_item",
                "target": {
                  "entity_id": "todo.luna_timeline"
                },
                "data": {
                  "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · AI-CONTROLE",
                  "description": "Alleen controle; geen wijziging. Zekerheid={{ confidence }}%. Kandidaat={{ candidate if candidate else 'geen' }}. Reden={{ reason }}."
                }
              }
            ]
          }
        ]
      }
    ],
    "mode": "single",
    "max_exceeded": "silent",
    "initial_state": false
  },
  {
    "id": "1787235231819",
    "alias": "AI - Luna Effectmeting Eigen Acties",
    "description": "Luna Effectmeting v3.0. Scheidt deterministisch UITVOERINGSRESULTAAT van werkelijk EFFECT. Kandidaat=off en vervanger=on bewijst alleen dat de beheeruitvoering intact bleef, niet dat HA beter werd. Werkbesparing/succes telt uitsluitend bij aantoonbaar effect BETER.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "state",
        "entity_id": "input_text.luna_autonomie_voor_actie"
      }
    ],
    "conditions": [
      {
        "condition": "template",
        "value_template": "{{ trigger.to_state is not none and trigger.to_state.state not in ['', 'unknown', 'unavailable'] }}"
      }
    ],
    "actions": [
      {
        "variables": {
          "voor": "{{ trigger.to_state.state }}",
          "beheer_candidate": "{% if 'candidate=' in voor %}{{ voor.split('candidate=',1)[1].split(' | ',1)[0] | trim }}{% elif 'kandidaat:' in voor %}{{ voor.split('kandidaat:',1)[1].split('→',1)[0] | trim }}{% else %}geen{% endif %}",
          "beheer_replacement": "{% if 'replacement=' in voor %}{{ voor.split('replacement=',1)[1].split(' | ',1)[0] | trim }}{% elif 'vervanger:' in voor %}{{ voor.split('vervanger:',1)[1].split('→',1)[0] | trim }}{% else %}geen{% endif %}",
          "beheer_direct": "{{ 'actie=BEHEER' in voor and ('categorie=automation_uit' in voor or 'automation_uit' in voor) and beheer_candidate.startswith('automation.') and beheer_replacement.startswith('automation.') }}"
        }
      },
      {
        "condition": "template",
        "value_template": "{{ 'actie=SAFE_REPAIR' not in voor }}",
        "note": "Safe Repair v3.1 doet een specifieke directe voor/na-meting; voorkom dubbele effecttelling en dubbel leren."
      },
      {
        "delay": {
          "minutes": 20
        }
      },
      {
        "condition": "template",
        "value_template": "{{ states('input_text.luna_autonomie_voor_actie') == voor }}"
      },
      {
        "parallel": [
          [
            {
              "action": "automation.trigger",
              "target": {
                "entity_id": "automation.luna_health_core"
              },
              "data": {
                "skip_condition": false
              }
            }
          ],
          [
            {
              "action": "automation.trigger",
              "target": {
                "entity_id": "automation.luna_conflict_watch_zonwering"
              },
              "data": {
                "skip_condition": false
              }
            }
          ],
          [
            {
              "action": "automation.trigger",
              "target": {
                "entity_id": "automation.luna_prediction_core"
              },
              "data": {
                "skip_condition": false
              }
            }
          ],
          [
            {
              "action": "automation.trigger",
              "target": {
                "entity_id": "automation.luna_conflict_watch_algemeen"
              },
              "data": {
                "skip_condition": false
              }
            }
          ]
        ]
      },
      {
        "delay": {
          "seconds": 3
        }
      },
      {
        "variables": {
          "na_health": "{{ states('input_text.luna_health_status') }}",
          "na_kritiek": "{{ states('input_number.luna_health_kritieke_storingen') }}",
          "na_watchman": "{{ states('input_number.luna_health_watchman_belangrijk') }}",
          "na_conflict": "{{ states('input_text.luna_automation_conflict_advies') }}",
          "na_prediction": "{{ states('input_number.luna_prediction_betrouwbaarheid') }}",
          "na_trace": "{{ states('input_text.luna_trace_status') }}",
          "na_conflict_algemeen": "{{ states('input_text.luna_automation_scan_advies') }}",
          "na_candidate": "{{ states(beheer_candidate) if beheer_direct else 'n.v.t.' }}",
          "na_replacement": "{{ states(beheer_replacement) if beheer_direct else 'n.v.t.' }}",
          "direct_beheer_ok": "{{ beheer_direct and na_candidate == 'off' and na_replacement == 'on' }}",
          "direct_beheer_slecht": "{{ beheer_direct and (na_candidate != 'off' or na_replacement != 'on') }}",
          "uitvoering_status": "{% if direct_beheer_ok %}UITVOERING_GESLAAGD{% elif direct_beheer_slecht %}UITVOERING_MISLUKT{% else %}UITVOERING_ONBEKEND{% endif %}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_laatste_uitvoeringsstatus"
        },
        "data": {
          "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · ' ~ uitvoering_status ~ ' · kandidaat=' ~ beheer_candidate ~ '=' ~ na_candidate ~ ' · vervanger=' ~ beheer_replacement ~ '=' ~ na_replacement)[:255] }}"
        }
      },
      {
        "if": [
          {
            "condition": "template",
            "value_template": "{{ uitvoering_status == 'UITVOERING_GESLAAGD' }}"
          }
        ],
        "then": [
          {
            "action": "counter.increment",
            "target": {
              "entity_id": "counter.luna_uitvoering_geslaagd"
            }
          }
        ]
      },
      {
        "action": "script.luna_ollama_background_queue",
        "data": {
          "task_name": "Luna effectmeting eigen actie",
          "instructions": "Beoordeel uitsluitend het effect van Luna's vorige eigen beheeractie. Vergelijk de toestand VOOR met de actuele toestand NA. Verzin geen oorzaak of verbetering. Bij onvoldoende vergelijkbaar bewijs kies ONZEKER.\n\nVOOR:\n{{ voor }}\n\nNA:\nHealth={{ na_health }}\nKritieke storingen={{ na_kritiek }}\nWatchman={{ na_watchman }}\nConflict zonwering={{ na_conflict }}\nConflict algemeen={{ na_conflict_algemeen }}\nPrediction betrouwbaarheid={{ na_prediction }}%\nTrace={{ na_trace }}\nUITVOERINGSBEWIJS: {{ uitvoering_status }}. Direct BEHEER={{ beheer_direct }}; kandidaat={{ beheer_candidate }}={{ na_candidate }}; vervanger={{ beheer_replacement }}={{ na_replacement }}. Dit bewijst uitsluitend of de beoogde configuratietoestand 20 minuten bleef staan. Het bewijst NOOIT automatisch dat Health, conflicten of huisgedrag beter werden. Classificeer BETER alleen bij zelfstandig vergelijkbaar effectbewijs in de overige VOOR/NA-data.\n\nClassificatie:\n- BETER: aantoonbaar minder problemen of duidelijk betere relevante status.\n- GEEN_EFFECT: relevante status aantoonbaar gelijk.\n- SLECHTER: aantoonbaar meer/relevantere problemen.\n- ONZEKER: onvoldoende bewijs of niet vergelijkbaar.\n\nGeef een korte Nederlandse reden, maximaal 160 tekens.",
          "structure": {
            "resultaat": {
              "selector": {
                "select": {
                  "options": [
                    "BETER",
                    "GEEN_EFFECT",
                    "SLECHTER",
                    "ONZEKER"
                  ]
                }
              },
              "required": true
            },
            "confidence": {
              "selector": {
                "number": {
                  "min": 0,
                  "max": 100,
                  "step": 1
                }
              },
              "required": true
            },
            "reden": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            }
          },
          "complexity": "light",
          "priority": "background"
        },
        "response_variable": "effect_ai",
        "continue_on_error": true
      },
      {
        "if": [
          {
            "condition": "template",
            "value_template": "{{ effect_ai is defined and effect_ai.data is defined }}"
          }
        ],
        "then": [
          {
            "variables": {
              "resultaat": "{{ effect_ai.data.resultaat }}",
              "zekerheid": "{% set c = effect_ai.data.confidence | float(0) %}{{ ([0, [((c * 100) if c > 0 and c <= 1 else c), 100] | min] | max) | round(0) | int }}",
              "reden": "{{ effect_ai.data.reden | trim }}"
            }
          },
          {
            "action": "counter.increment",
            "target": {
              "entity_id": "counter.luna_effectmetingen_totaal"
            }
          },
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_autonomie_leerervaring"
            },
            "data": {
              "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · BEHEER · ' ~ uitvoering_status ~ ' · effect=' ~ resultaat ~ ' · ' ~ zekerheid ~ '% · ' ~ reden)[:255] }}"
            }
          },
          {
            "if": [
              {
                "condition": "template",
                "value_template": "{{ resultaat == 'BETER' and zekerheid >= 70 }}"
              }
            ],
            "then": [
              {
                "action": "counter.increment",
                "target": {
                  "entity_id": "counter.luna_succesvolle_acties"
                }
              },
              {
                "action": "counter.increment",
                "target": {
                  "entity_id": "counter.luna_echte_werkbesparing"
                }
              }
            ]
          },
          {
            "action": "todo.add_item",
            "target": {
              "entity_id": "todo.luna_timeline"
            },
            "data": {
              "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · EFFECTMETING · {{ resultaat }}",
              "description": "Uitvoering={{ uitvoering_status }}. Effect={{ resultaat }} met zekerheid={{ zekerheid }}%. Reden={{ reden }}. Voor={{ voor | truncate(160, true, '') }}. Kandidaat={{ beheer_candidate }}={{ na_candidate }}, vervanger={{ beheer_replacement }}={{ na_replacement }}. Na: health={{ na_health }}, kritiek={{ na_kritiek }}, watchman={{ na_watchman }}, conflict={{ na_conflict_algemeen | truncate(100, true, '') }}."
            },
            "continue_on_error": true
          }
        ]
      }
    ],
    "mode": "restart",
    "initial_state": false
  },
  {
    "id": "1787235242053",
    "alias": "AI - Luna specialist vraag",
