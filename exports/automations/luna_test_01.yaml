        },
        "continue_on_error": true
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_analytics_score_onderbouwing"
        },
        "data": {
          "value": "{{ (now().strftime('%d-%m %H:%M:%S') ~ ' · ' ~ categorie ~ ' onbekend · geen feedback is geen succesbewijs · trace ' ~ (trace_bij_beslissing if trace_bij_beslissing not in ['unknown','unavailable',''] else 'geen bewijs'))[:255] }}"
        },
        "continue_on_error": true
      },
      {
        "action": "input_datetime.set_datetime",
        "target": {
          "entity_id": "input_datetime.luna_analytics_laatste_update"
        },
        "data": {
          "datetime": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        },
        "continue_on_error": true
      }
    ],
    "mode": "parallel",
    "max": 50,
    "max_exceeded": "silent",
    "initial_state": false
  },
