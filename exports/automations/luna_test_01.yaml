            },
            "continue_on_error": true
          },
          {
            "if": [
              {
                "condition": "template",
                "value_template": "{{ zelfstandig_ai.data.notify | default(false) and prioriteit == 'hoog' }}"
              }
            ],
            "then": [
              {
                "action": "logbook.log",
                "data": {
                  "name": "Luna fail-closed",
                  "message": "Geblokkeerde productieactie: notify.luna_placeholder · target=\"geen target\"",
                  "entity_id": "input_text.luna_laatste_uitvoeringsstatus",
                  "domain": "Luna"
                },
                "continue_on_error": true
              }
            ]
          }
        ]
      }
    ],
    "mode": "single",
    "max_exceeded": "silent",
    "initial_state": false
  },
