        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_autonomie_gereedheid"
        },
        "data": {
          "value": "{{ nieuwe_status }}"
        },
        "continue_on_error": true
      },
      {
        "if": [
          {
            "condition": "template",
            "value_template": "{{ nieuwe_status != oude_status }}"
          }
        ],
        "then": [
          {
            "action": "todo.add_item",
            "target": {
              "entity_id": "todo.luna_timeline"
            },
            "data": {
              "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · AUTONOMIE · {{ status }}",
              "description": "{{ reden }}. Bewijspoort voor niet-kritiek autonoom beheer; geen apparaatsturing."
            },
            "continue_on_error": true
          }
        ]
      }
    ],
    "mode": "restart",
    "initial_state": false
  },
  {
    "id": "1787235329135",
    "alias": "Luna Autonomie Raad - dubbele AI controle",
    "description": "Luna Autonomie Raad v1.3. Tweede AI-beoordeling kan BEHEER alleen doorlaten bij consensus én Deterministische Verifier BEHEER=OK. Safe Repair vereist ook verifier SAFE_REPAIR=OK. De verifier is lokaal en fail-closed; AI kan hem niet overrulen.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "time_pattern",
        "hours": "/4",
        "minutes": 7,
        "id": "periodiek"
      },
      {
        "trigger": "state",
        "entity_id": "input_text.luna_beheerder_laatste_advies",
        "id": "nieuw_advies"
      },
      {
        "trigger": "state",
        "entity_id": "counter.luna_validatie_fouten",
        "to": "0",
        "id": "kern_hersteld"
      }
    ],
    "conditions": [
      {
        "condition": "state",
        "entity_id": "counter.luna_validatie_fouten",
        "state": "0"
      }
    ],
    "actions": [
      {
        "variables": {
          "eerste": "{{ states('input_text.luna_beheerder_laatste_advies') }}",
          "health": "{{ states('input_text.luna_health_status') }}",
          "health_kritiek": "{{ states('input_number.luna_health_kritieke_storingen') }}",
          "watchman": "{{ states('input_text.luna_health_watchman') }}",
          "prediction": "{{ states('input_text.luna_prediction_laatste_voorspelling') }}",
          "prediction_score": "{{ states('input_number.luna_prediction_betrouwbaarheid') }}",
          "sensor_score": "{{ states('input_number.luna_analytics_sensorscore') }}",
          "conflict_zon": "{{ states('input_text.luna_automation_conflict_advies') }}",
          "conflict_algemeen": "{{ states('input_text.luna_automation_scan_advies') }}",
          "safe_goed": "{{ states('counter.luna_autonomie_safe_repair_goed') }}",
          "safe_fout": "{{ states('counter.luna_autonomie_safe_repair_niet_goed') }}",
          "beheer_goed": "{{ states('counter.luna_autonomie_automation_beheer_goed') }}",
          "beheer_fout": "{{ states('counter.luna_autonomie_automation_beheer_niet_goed') }}",
          "actiemodus": "{{ states('input_select.luna_actiemodus') }}",
          "zelfherstel": "{{ states('input_boolean.luna_veilig_zelfherstel') }}",
          "prediction_beoordelingen": "{{ states('counter.luna_prediction_goede_beslissingen_totaal') | int(0) + states('counter.luna_prediction_slechte_beslissingen_totaal') | int(0) }}",
          "autonomie_gereed": "{{ states('input_text.luna_autonomie_gereedheid').startswith('GEREED') }}",
          "verifier": "{{ states('input_text.luna_verifier_status') }}",
          "verifier_beheer_ok": "{{ verifier.startswith('BEHEER=OK') }}",
          "verifier_safe_ok": "{{ 'SAFE_REPAIR=OK' in verifier }}"
        }
      },
      {
        "action": "script.luna_ollama_background_queue",
        "data": {
          "task_name": "Luna tweede autonome controle",
          "instructions": "Je bent de onafhankelijke tweede beoordelaar van Luna. Controleer de eerste beheerconclusie streng tegen uitsluitend de aangeleverde lokale Home Assistant-data. Zoek verkeerde aannames, ontbrekend bewijs, alternatieve oorzaken, regressierisico en ontbrekende rollback. Veiligheid en actuele lokale data gaan voor AI.\n\nEerste Luna-advies:\n{{ eerste }}\n\nLokale data:\nHealth={{ health }}\nKritieke Health-storingen={{ health_kritiek }}\nWatchman={{ watchman }}\nPrediction={{ prediction }}\nPrediction-score={{ prediction_score }}% op {{ prediction_beoordelingen }} beoordeelde beslissingen\nCentrale autonomiebewijspoort={{ states('input_text.luna_autonomie_gereedheid') }}\nDeterministische verifier={{ verifier }}\nSensorscore={{ sensor_score }}%\nConflict zonwering={{ conflict_zon }}\nConflict algemeen={{ conflict_algemeen }}\nSafe Repair bewijs: goed={{ safe_goed }}, fout={{ safe_fout }}\nAutomation Beheer bewijs: goed={{ beheer_goed }}, fout={{ beheer_fout }}\nActiemodus={{ actiemodus }}, zelfherstel={{ zelfherstel }}\nValidatiefouten=0.\n\nKies uitsluitend GEEN, CONTROLE, BEHEER of SAFE_REPAIR. Geen nieuwe bevoegdheid. Geen apparaten direct bedienen. Veiligheidskritische functies nooit autonoom wijzigen. Een algemene conflictscan is geen bewijs voor BEHEER. Safe Repair alleen bij concrete lokaal bewezen uitval. agreement=true uitsluitend bij inhoudelijke overeenstemming én sterk lokaal bewijs. Voor BEHEER geldt bovendien: minimaal 70% Prediction, minimaal 10 bewezen beoordelingen, centrale bewijspoort GEREED én Deterministische Verifier BEHEER=OK. De AI mag deze lokale verifier nooit overrulen. Bij twijfel agreement=false. confidence=0-100. reason en missing_evidence kort.",
          "structure": {
            "agreement": {
              "selector": {
                "boolean": {}
              },
              "required": true
            },
            "action": {
              "selector": {
                "select": {
                  "options": [
                    "GEEN",
                    "CONTROLE",
                    "BEHEER",
                    "SAFE_REPAIR"
                  ]
                }
              },
              "required": true
            },
            "confidence": {
              "selector": {
                "number": {
                  "min": 0,
                  "max": 100,
                  "step": 1
                }
              },
              "required": true
            },
            "reason": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "missing_evidence": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            }
          }
        },
        "response_variable": "raad_ai",
        "continue_on_error": true
      },
      {
        "if": [
          {
            "condition": "template",
            "value_template": "{{ raad_ai is defined and raad_ai.data is defined }}"
          }
        ],
        "then": [
          {
            "variables": {
              "akkoord": "{{ raad_ai.data.agreement | default(false) }}",
              "actie": "{{ raad_ai.data.action }}",
              "zekerheid": "{% set c=raad_ai.data.confidence|float(0) %}{{ (((c*100) if c>0 and c<=1 else c)|round(0)|int) }}",
              "reden": "{{ raad_ai.data.reason | trim }}",
              "ontbreekt": "{{ raad_ai.data.missing_evidence | trim }}",
              "resultaat": "{{ 'CONSENSUS' if akkoord else 'CONFLICT' }}"
            }
          },
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_autonomie_leerervaring"
            },
            "data": {
              "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · AI-RAAD ' ~ resultaat ~ ' · ' ~ actie ~ ' · ' ~ zekerheid ~ '% · ' ~ reden ~ ((' · ontbreekt: ' ~ ontbreekt) if ontbreekt else ''))[:255] }}"
            }
          },
          {
            "action": "todo.add_item",
            "target": {
              "entity_id": "todo.luna_timeline"
            },
            "data": {
              "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · AI_RAAD · {{ resultaat }} · {{ actie }}",
              "description": "{{ ('Tweede onafhankelijke controle. Zekerheid=' ~ zekerheid ~ '%. Reden=' ~ reden ~ '. Ontbrekend bewijs=' ~ (ontbreekt if ontbreekt else 'geen genoemd') ~ '. Eerste advies=' ~ eerste)[:500] }}"
            },
            "continue_on_error": true
          },
          {
            "choose": [
              {
                "conditions": [
                  {
                    "condition": "template",
                    "value_template": "{{ akkoord and actie == 'BEHEER' and zekerheid >= 95 }}"
                  },
                  {
                    "condition": "state",
                    "entity_id": "input_select.luna_actiemodus",
                    "state": "Safe Repair"
                  },
                  {
                    "condition": "numeric_state",
                    "entity_id": "counter.luna_validatie_fouten",
                    "below": 1
                  },
                  {
                    "condition": "numeric_state",
                    "entity_id": "input_number.luna_prediction_betrouwbaarheid",
                    "above": 69
                  },
                  {
                    "condition": "template",
                    "value_template": "{{ prediction_beoordelingen | int(0) >= 10 }}"
                  },
                  {
                    "condition": "template",
                    "value_template": "{{ autonomie_gereed | bool(false) }}"
                  },
                  {
                    "condition": "template",
                    "value_template": "{{ verifier_beheer_ok | bool(false) }}"
                  }
                ],
                "sequence": [
                  {
                    "action": "automation.trigger",
                    "target": {
                      "entity_id": "automation.ai_luna_automation_beheer"
                    },
                    "data": {
                      "skip_condition": false
                    }
                  }
                ]
              },
              {
                "conditions": [
                  {
                    "condition": "template",
                    "value_template": "{{ akkoord and actie == 'SAFE_REPAIR' and zekerheid >= 95 }}"
                  },
                  {
                    "condition": "state",
                    "entity_id": "input_select.luna_actiemodus",
                    "state": "Safe Repair"
                  },
                  {
                    "condition": "state",
                    "entity_id": "input_boolean.luna_veilig_zelfherstel",
                    "state": "on"
                  },
                  {
                    "condition": "numeric_state",
                    "entity_id": "counter.luna_validatie_fouten",
                    "below": 1
                  },
                  {
                    "condition": "template",
                    "value_template": "{{ verifier_safe_ok | bool(false) }}"
                  }
                ],
                "sequence": [
                  {
                    "action": "logbook.log",
                    "data": {
                      "name": "Luna fail-closed",
                      "message": "Geblokkeerde productieactie: automation.trigger · target={\"entity_id\":\"automation.luna_shadow_automation_target\"}",
                      "entity_id": "input_text.luna_laatste_uitvoeringsstatus",
                      "domain": "Luna"
                    },
                    "continue_on_error": true
                  }
                ]
              }
            ]
          }
        ]
      }
    ],
    "mode": "restart",
    "max_exceeded": "silent",
    "initial_state": false
  },
