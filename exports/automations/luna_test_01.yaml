      {
        "variables": {
          "health": "{{ states('input_text.luna_health_status') }}",
          "health_advies": "{{ states('input_text.luna_health_advies') }}",
          "conflict": "{{ states('input_text.luna_automation_conflict_advies') }}",
          "analytics": "{{ states('input_text.luna_analytics_laatste_inzicht') }}",
          "sensor_score": "{{ states('input_number.luna_analytics_sensorscore') }}",
          "prediction": "{{ states('input_text.luna_prediction_laatste_voorspelling') }}",
          "prediction_score": "{{ states('input_number.luna_prediction_betrouwbaarheid') }}",
          "trace": "{{ states('input_text.luna_trace_status') }}",
          "beheer_laatste": "{{ states('input_text.luna_beheerder_laatste_advies') }}",
          "kritiek": "{{ states('input_number.luna_health_kritieke_storingen') }}",
          "watchman": "{{ states('input_number.luna_health_watchman_belangrijk') }}",
          "leerfeedback": "{{ states('input_text.luna_autonomie_leerervaring') }}",
          "leeradvies": "{% set f=leerfeedback|upper %}{% if 'SLECHTER' in f %}NEGATIEF: herhaal een vergelijkbare beheeractie niet autonoom; kies CONTROLE of VOORSTEL tenzij nieuw concreet bewijs de situatie wezenlijk verandert.{% elif 'ONZEKER' in f %}ONZEKER: verlaag vertrouwen en verzamel eerst nieuw bewijs; geen autonome BEHEER/SAFE_REPAIR op alleen dezelfde onderbouwing.{% elif 'BETER' in f %}POSITIEF: eerdere beheeractie had aantoonbaar positief effect; dit is ondersteunend bewijs, geen vrijbrief.{% elif 'GEEN_EFFECT' in f %}GEEN_EFFECT: herhaal dezelfde actie niet zonder nieuw bewijs of gewijzigde toestand.{% else %}NOG_GEEN_BEOORDEELD_BEWIJS: wees conservatief en leer van toekomstige effectmetingen.{% endif %}",
          "validatie": "{{ states('input_text.luna_validatie_status') }}",
          "validatiefouten": "{{ states('counter.luna_validatie_fouten') }}",
          "actiemodus": "{{ states('input_select.luna_actiemodus') }}",
