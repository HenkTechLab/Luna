  {
    "id": "1787222023777",
    "alias": "Luna AI OS Core",
    "description": "Luna AI OS Core v2.3. Centrale lokale coordinatielaag. Autonomie gebruikt dezelfde strengere bewijspoort als Luna v25: minimaal 10 beoordeelde Prediction-beslissingen en minstens 70% betrouwbaarheid, naast nul validatiefouten en nul kritieke Health-storingen. Stuurt geen apparaten aan.",
    "triggers": [
      {
        "trigger": "time_pattern",
