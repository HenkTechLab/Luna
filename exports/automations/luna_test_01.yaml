    "id": "1787235285678",
    "alias": "Luna Analytics - Beslissing beoordelen",
    "description": "Analytics Evaluator v2.0. Geen feedback is voortaan ONBEKEND, niet goed. Alleen expliciete positieve/negatieve feedback mag Prediction-leercounters wijzigen. Na 10 minuten zonder feedback wordt uitsluitend een onbekend leerpunt geregistreerd.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "state",
        "entity_id": "input_text.luna_memory_verlichting",
        "id": "verlichting"
      },
      {
        "trigger": "state",
        "entity_id": "input_text.luna_memory_zonwering",
        "id": "zonwering"
      }
    ],
    "conditions": [
      {
        "condition": "template",
        "value_template": "{{ trigger is defined and trigger.to_state is defined and trigger.to_state is not none and ' | automatisch |' in trigger.to_state.state }}"
      },
      {
        "condition": "template",
        "value_template": "{{ trigger is defined and trigger.to_state is defined and trigger.to_state is not none and '→opening' not in trigger.to_state.state and '→closing' not in trigger.to_state.state }}"
      }
    ],
    "actions": [
      {
        "variables": {
          "beslissingstijd": "{{ as_timestamp(now()) }}",
          "beslissingsrecord": "{{ trigger.to_state.state }}",
          "categorie": "{{ trigger.id }}",
          "trace_bij_beslissing": "{{ states('input_text.luna_trace_status') }}"
        }
      },
      {
        "delay": {
          "minutes": 10
        },
        "note": "Tien minuten observatie; stilte is geen bewijs van succes."
      },
      {
        "condition": "template",
        "value_template": "{{ states('input_text.luna_memory_' ~ categorie) == beslissingsrecord }}"
      },
      {
        "condition": "template",
        "value_template": "{{ states.input_text.luna_memory_leerfeedback is defined and as_timestamp(states.input_text.luna_memory_leerfeedback.last_changed, 0) <= beslissingstijd }}"
      },
      {
        "action": "counter.increment",
        "target": {
          "entity_id": "counter.luna_prediction_onbekende_beslissingen_totaal"
        },
        "continue_on_error": true
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_analytics_laatste_inzicht"
        },
        "data": {
