  {
    "id": "1787219545035",
    "alias": "Luna Persistent Memory Retention",
    "description": "Begrenst de publieke Luna persistente geheugenlijst fail-closed tot maximaal 200 records. Verwijdert uitsluitend de oudste Luna-memoryrecords en stuurt geen fysieke apparaten aan.",
    "triggers": [
      {
        "trigger": "time",
        "at": "03:15:00",
        "id": "daily"
      },
      {
        "trigger": "numeric_state",
        "entity_id": "todo.luna_persistent_memory",
        "above": 200,
        "id": "limit"
      }
    ],
    "conditions": [],
    "actions": [
      {
        "action": "todo.get_items",
        "target": {
          "entity_id": "todo.luna_persistent_memory"
        },
        "data": {
          "status": "needs_action"
        },
        "response_variable": "memory_response"
      },
      {
        "variables": {
          "items": "{{ memory_response['todo.luna_persistent_memory']['items'] | default([], true) }}",
          "remove_count": "{{ [0, (items | count) - 200] | max }}"
        }
      },
      {
        "repeat": {
          "for_each": "{{ items[:remove_count | int(0)] }}",
          "sequence": [
            {
              "action": "todo.remove_item",
              "target": {
                "entity_id": "todo.luna_persistent_memory"
              },
              "data": {
                "item": "{{ repeat.item.uid }}"
              },
              "continue_on_error": true
            }
          ]
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_storage_status"
        },
        "data": {
          "value": "{{ ('READY · persistent memory · retained=' ~ ([items | count, 200] | min) ~ ' · removed=' ~ remove_count)[:255] }}"
        }
      }
    ],
    "mode": "single",
    "max_exceeded": "silent"
  },
