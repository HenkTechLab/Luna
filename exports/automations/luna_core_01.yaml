[
  {
    "id": "1787174192186",
    "alias": "Luna AI Router Core",
    "description": "Generieke optionele AI-routerstatus voor Luna. Luna blijft volledig functioneren wanneer AI uit of niet geconfigureerd is. Deze automation roept geen AI aan en gebruikt AI nooit als autorisatiebron.",
    "triggers": [
      {
        "trigger": "homeassistant",
        "event": "start"
      },
      {
        "trigger": "state",
        "entity_id": "input_select.luna_ai_mode"
      },
      {
        "trigger": "state",
        "entity_id": "input_text.luna_ai_backend_light"
      },
      {
        "trigger": "state",
        "entity_id": "input_text.luna_ai_backend_heavy"
      }
    ],
    "conditions": [],
    "actions": [
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_ai_router_status"
        },
        "data": {
          "value": "{% set mode=states('input_select.luna_ai_mode') %}{% set light=states('input_text.luna_ai_backend_light') %}{% set heavy=states('input_text.luna_ai_backend_heavy') %}{% set empty=['','unknown','unavailable','none'] %}{% if mode == 'Uit' %}OFF · core active · no AI{% elif light in empty %}BLOCKED · no light backend · core active without AI{% elif heavy in empty %}READY · single backend · advisory only{% else %}READY · light/heavy routing · advisory only{% endif %}"
        }
      }
    ],
    "mode": "restart"
  },
  {
    "id": "1787207031920",
    "alias": "Luna Config Readiness Core",
    "description": "Generieke configuratiegereedheidscontrole voor Luna. Valideert alleen of optionele bronkeuzes en AI-keuzes logisch zijn; bestuurt geen fysieke apparaten.",
    "triggers": [
      {
        "trigger": "homeassistant",
        "event": "start"
      },
      {
        "trigger": "state",
        "entity_id": "input_text.luna_presence_source"
      },
      {
        "trigger": "state",
        "entity_id": "input_text.luna_temperature_source"
      },
      {
        "trigger": "state",
        "entity_id": "input_text.luna_energy_source"
      },
      {
        "trigger": "state",
        "entity_id": "input_text.luna_calendar_source"
      },
      {
        "trigger": "state",
        "entity_id": "input_select.luna_ai_mode"
      },
      {
        "trigger": "state",
        "entity_id": "input_text.luna_ai_backend_light"
      },
      {
        "trigger": "state",
        "entity_id": "input_text.luna_ai_backend_heavy"
      }
    ],
    "conditions": [],
    "actions": [
      {
        "variables": {
          "unset": [
            "",
            "unknown",
            "unavailable",
            "none"
          ],
          "presence": "{{ states('input_text.luna_presence_source') }}",
          "temperature": "{{ states('input_text.luna_temperature_source') }}",
          "energy": "{{ states('input_text.luna_energy_source') }}",
          "calendar": "{{ states('input_text.luna_calendar_source') }}",
          "ai_mode": "{{ states('input_select.luna_ai_mode') }}",
          "light": "{{ states('input_text.luna_ai_backend_light') }}",
          "heavy": "{{ states('input_text.luna_ai_backend_heavy') }}",
          "base_optional_ok": "{{ true }}",
          "ai_ok": "{{ ai_mode == 'Uit' or light not in unset }}",
          "configured_count": "{{ [presence,temperature,energy,calendar] | reject('in', unset) | list | count }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_config_readiness"
        },
        "data": {
          "value": "{{ ('READY' if ai_ok else 'BLOCKED') ~ ' · optional_sources=' ~ configured_count ~ '/4 · ai=' ~ ('off-ok' if ai_mode == 'Uit' else ('configured' if ai_ok else 'missing-backend')) }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_config_status"
        },
        "data": {
          "value": "{{ ('SAFE · generic core · physical control off · config=' ~ ('ready' if ai_ok else 'attention'))[:100] }}"
        }
      }
    ],
    "mode": "restart"
  },
  {
    "id": "1787224487217",
    "alias": "Luna - Deterministische verifier",
    "description": "Verifier v1.0. Lokale fail-closed bewijspoort vóór AI-autonomie. Controleert validatiefouten, kritieke Health, bewezen Prediction-beoordelingen, Prediction-score, centrale gereedheid, actiemodus en Safe Repair-schakelaar. Geen AI en geen apparaatsturing.",
    "triggers": [
      {
        "trigger": "homeassistant",
        "event": "start"
      },
      {
        "trigger": "time_pattern",
        "minutes": "/15"
      },
      {
        "trigger": "state",
        "entity_id": [
          "counter.luna_validatie_fouten",
          "input_number.luna_health_kritieke_storingen",
          "counter.luna_prediction_goede_beslissingen_totaal",
          "counter.luna_prediction_slechte_beslissingen_totaal",
          "input_number.luna_prediction_betrouwbaarheid",
          "input_text.luna_autonomie_gereedheid",
          "input_select.luna_actiemodus",
          "input_boolean.luna_veilig_zelfherstel"
        ]
      }
    ],
    "conditions": [],
    "actions": [
      {
        "variables": {
          "validatie": "{{ states('counter.luna_validatie_fouten')|int(99) }}",
          "kritiek": "{{ states('input_number.luna_health_kritieke_storingen')|int(99) }}",
          "goed": "{{ states('counter.luna_prediction_goede_beslissingen_totaal')|int(0) }}",
          "slecht": "{{ states('counter.luna_prediction_slechte_beslissingen_totaal')|int(0) }}",
          "bewezen": "{{ goed+slecht }}",
          "prediction": "{{ states('input_number.luna_prediction_betrouwbaarheid')|float(0) }}",
          "gereed": "{{ states('input_text.luna_autonomie_gereedheid').startswith('GEREED') }}",
          "modus": "{{ states('input_select.luna_actiemodus') }}",
          "zelfherstel": "{{ is_state('input_boolean.luna_veilig_zelfherstel','on') }}",
          "beheer_ok": "{{ validatie==0 and kritiek==0 and bewezen>=10 and prediction>=70 and gereed and modus=='Safe Repair' }}",
          "safe_ok": "{{ validatie==0 and modus=='Safe Repair' and zelfherstel }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_verifier_status"
        },
        "data": {
          "value": "{{ ('BEHEER=' ~ ('OK' if beheer_ok else 'BLOK') ~ ' · SAFE_REPAIR=' ~ ('OK' if safe_ok else 'BLOK') ~ ' · val=' ~ validatie ~ ' · kritiek=' ~ kritiek ~ ' · bewijs=' ~ bewezen ~ '/10 · P=' ~ prediction|round(0) ~ '% · modus=' ~ modus)[:255] }}"
        }
      },
      {
        "if": [
          {
            "condition": "template",
            "value_template": "{{ not beheer_ok and gereed }}"
          }
        ],
        "then": [
          {
            "action": "todo.add_item",
            "target": {
              "entity_id": "todo.luna_timeline"
            },
            "data": {
              "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · VERIFIER · FAIL-CLOSED",
              "description": "{{ ('Centrale gereedheid zei GEREED maar lokale verifier blokkeert BEHEER. ' ~ states('input_text.luna_verifier_status'))[:500] }}"
            },
            "continue_on_error": true
          }
        ]
      }
    ],
    "mode": "restart",
    "max_exceeded": "silent"
  },
