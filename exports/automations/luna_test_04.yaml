                  }
                ]
              },
              {
                "conditions": [
                  {
                    "condition": "template",
                    "value_template": "{{ sim_ai.data.resultaat == 'MIS' }}"
                  }
                ],
                "sequence": [
                  {
                    "action": "counter.increment",
                    "target": {
                      "entity_id": "counter.luna_simulatie_mislukte_dagen"
                    }
                  }
                ]
              }
            ],
            "default": [
              {
                "action": "counter.increment",
                "target": {
                  "entity_id": "counter.luna_simulatie_onzekere_dagen"
                }
              }
            ]
          },
          {
            "delay": {
              "seconds": 1
            }
          },
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_simulatie_status"
            },
            "data": {
              "value": "{% set g=states('counter.luna_simulatie_goede_dagen')|int(0) %}{% set m=states('counter.luna_simulatie_mislukte_dagen')|int(0) %}{% set o=states('counter.luna_simulatie_onzekere_dagen')|int(0) %}{{ (now().strftime('%d-%m %H:%M') ~ ' · ' ~ ('KLAAR_VOOR_VOORSTEL' if g>=7 and m<=1 else 'LEREN') ~ ' · ' ~ sim_ai.data.resultaat ~ ' · goed=' ~ g ~ ' mis=' ~ m ~ ' onzeker=' ~ o ~ ' · ' ~ sim_ai.data.reden)[:255] }}"
            }
          }
        ]
      }
    ],
    "mode": "single",
    "max_exceeded": "silent",
    "initial_state": false
  },
  {
    "id": "1787235763150",
    "alias": "Luna Simulatie Voorbereiding",
    "description": "Luna Simulatie v1.0 voorbereiding. Selecteert de actuele bewezen routine als virtuele kandidaat en reset alleen de simulatiestatistiek wanneer de kandidaat echt verandert. Geen sturing.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "time",
        "at": "03:49:00"
      }
    ],
    "actions": [
      {
        "variables": {
          "routine": "{{ states('input_text.luna_routine_status') }}",
          "fase": "{{ states('input_text.luna_leerfase') }}",
          "candidate": "{% if 'kandidaat=' in routine %}{{ routine.split('kandidaat=',1)[1].split(' · voorbeelden=',1)[0]|trim }}{% elif ' · BEWEZEN_PATROON' in routine %}{{ routine.split(' · BEWEZEN_PATROON',1)[0]|trim }}{% else %}geen{% endif %}",
          "vorige": "{{ states('input_text.luna_simulatie_kandidaat') }}"
        }
      },
      {
        "choose": [
          {
            "conditions": [
              {
                "condition": "template",
                "value_template": "{{ fase != 'BEWEZEN_PATROON' or candidate in ['', 'geen', 'Nog geen sterke routine gevonden'] }}"
              }
            ],
            "sequence": [
              {
                "action": "input_text.set_value",
                "target": {
                  "entity_id": "input_text.luna_simulatie_status"
                },
                "data": {
                  "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · WACHT · nog geen bewezen routine voor simulatie')[:255] }}"
                }
              }
            ]
          },
          {
            "conditions": [
              {
                "condition": "template",
                "value_template": "{{ candidate != vorige }}"
              }
            ],
            "sequence": [
              {
                "action": "input_text.set_value",
                "target": {
                  "entity_id": "input_text.luna_simulatie_kandidaat"
                },
                "data": {
                  "value": "{{ candidate[:255] }}"
                }
              },
              {
                "action": "counter.reset",
