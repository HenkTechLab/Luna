[
  {
    "id": "1787235703372",
    "alias": "Luna Prediction - expliciete positieve beoordeling",
    "description": "Prediction Feedback v1.0. Alleen een expliciete druk op Luna beslissing goed telt als bewezen positief leerpunt. De nieuwste automatische verlichting- of zonweringsbeslissing kan maximaal één keer positief worden beoordeeld. Stuurt geen apparaten aan.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "state",
        "entity_id": "input_button.luna_beslissing_goed",
        "id": "goed"
      }
    ],
    "conditions": [],
    "actions": [
      {
        "variables": {
          "licht": "{{ states('input_text.luna_memory_verlichting') }}",
          "zon": "{{ states('input_text.luna_memory_zonwering') }}",
          "licht_tijd": "{{ as_timestamp(states.input_text.luna_memory_verlichting.last_changed, 0) }}",
          "zon_tijd": "{{ as_timestamp(states.input_text.luna_memory_zonwering.last_changed, 0) }}",
          "categorie": "{{ 'verlichting' if licht_tijd >= zon_tijd else 'zonwering' }}",
          "record": "{{ licht if licht_tijd >= zon_tijd else zon }}",
          "sleutel": "{{ (categorie ~ '|' ~ record)[:220] }}",
          "vorige": "{{ states('input_text.luna_prediction_laatste_beoordeling') }}"
        }
      },
      {
        "choose": [
          {
            "conditions": [
              {
                "condition": "template",
                "value_template": "{{ ' | automatisch |' in record and sleutel not in vorige }}"
              }
            ],
            "sequence": [
              {
                "action": "counter.increment",
                "target": {
                  "entity_id": "counter.luna_prediction_goede_beslissingen_totaal"
                }
              },
              {
                "action": "counter.increment",
                "target": {
                  "entity_id": "counter.luna_analytics_goede_beslissingen_vandaag"
                },
                "continue_on_error": true
              },
              {
                "action": "input_text.set_value",
                "target": {
                  "entity_id": "input_text.luna_prediction_laatste_beoordeling"
                },
                "data": {
                  "value": "{{ ('GOED|' ~ sleutel)[:255] }}"
                }
              },
              {
                "action": "input_text.set_value",
                "target": {
                  "entity_id": "input_text.luna_analytics_laatste_inzicht"
                },
                "data": {
                  "value": "{{ (now().strftime('%d-%m %H:%M:%S') ~ ' · ' ~ categorie ~ ' BEWEZEN_GOED · expliciete positieve feedback')[:255] }}"
                }
              },
              {
                "action": "todo.add_item",
                "target": {
                  "entity_id": "todo.luna_timeline"
                },
                "data": {
                  "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · LEERBEWIJS · BEWEZEN_GOED",
                  "description": "{{ ('Expliciete positieve beoordeling voor ' ~ categorie ~ '. Beslissing=' ~ record)[:500] }}"
                },
                "continue_on_error": true
              },
              {
                "action": "automation.trigger",
                "target": {
                  "entity_id": "automation.luna_prediction_core"
                },
                "data": {
                  "skip_condition": false
                }
              }
            ]
          }
        ],
        "default": [
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_analytics_laatste_inzicht"
            },
            "data": {
              "value": "{{ now().strftime('%d-%m %H:%M:%S') }} · positieve beoordeling niet geteld · geen nieuwe automatische beslissing of al beoordeeld"
            }
          }
        ]
      }
    ],
    "mode": "queued",
    "max": 5,
    "initial_state": false
  },
  {
    "id": "1787235709141",
    "alias": "Luna Proactieve Voorstellen",
    "description": "Luna Proactief v1.1. Stelt alleen iets voor wanneer Routine Core deterministisch BEWEZEN_PATROON meldt: minimaal 5 passende voorbeelden op minimaal 3 verschillende dagen en minimaal 85% zekerheid. Dit bewijst herhaling, niet causaliteit. Voert nooit zelf een actie uit en herhaalt hetzelfde voorstel niet.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "state",
        "entity_id": "input_text.luna_routine_status"
      },
      {
        "trigger": "time",
        "at": "18:10:00"
      }
    ],
    "conditions": [
      {
        "condition": "numeric_state",
        "entity_id": "input_number.luna_routine_betrouwbaarheid",
        "above": 84
      },
      {
        "condition": "state",
        "entity_id": "input_text.luna_leerfase",
        "state": "BEWEZEN_PATROON"
      },
      {
        "condition": "numeric_state",
        "entity_id": "input_number.luna_routine_bewijsvoorbeelden",
        "above": 4
      },
      {
        "condition": "numeric_state",
        "entity_id": "input_number.luna_routine_bewijsdagen",
        "above": 2
      },
      {
        "condition": "template",
        "value_template": "{{ states('input_text.luna_routine_status') not in ['unknown','unavailable','none',''] and 'BEWEZEN_PATROON' in states('input_text.luna_routine_status') and states('input_text.luna_routine_status') != states('input_text.luna_proactief_voorstel') }}"
      }
    ],
    "actions": [
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_proactief_voorstel"
        },
        "data": {
          "value": "{{ states('input_text.luna_routine_status')[:255] }}"
        }
      },
      {
        "action": "logbook.log",
        "data": {
          "name": "Luna fail-closed",
          "message": "Geblokkeerde productieactie: notify.luna_placeholder · target=\"geen target\"",
          "entity_id": "input_text.luna_laatste_uitvoeringsstatus",
          "domain": "Luna"
        },
        "continue_on_error": true
      }
    ],
    "mode": "single",
    "initial_state": false
  },
