      }
    ],
    "conditions": [],
    "actions": [
      {
        "choose": [
          {
            "conditions": [
              {
                "condition": "trigger",
                "id": "start"
              }
            ],
            "sequence": [
              {
                "delay": {
                  "minutes": 5
                }
              }
            ]
          }
        ]
      },
      {
        "variables": {
          "oude_status": "{{ states('input_text.luna_selfcheck_status') }}",
          "backend_light": "{{ states('input_text.luna_ollama_backend_light') | trim }}",
          "backend_heavy": "{{ states('input_text.luna_ollama_backend_heavy') | trim }}",
          "kritieke_automations": [
            "automation.luna_timeline_hot_memory_retentie",
            "automation.luna_ollama_queue_watchdog",
            "automation.luna_ollama_resource_sampler",
            "automation.luna_ollama_metrics_samenvatting",
            "automation.luna_health_core",
            "automation.luna_prediction_core",
            "automation.luna_routine_core",
            "automation.luna_autonomie_bewijspoort",
            "automation.luna_memory_index_categoriegeheugen",
            "automation.luna_memory_duurzame_deduplicatie",
            "automation.luna_ollama_backend_status",
            "automation.luna_decision_journal_core",
            "automation.luna_impliciete_feedback_core",
            "automation.luna_kennisveroudering_core",
            "automation.luna_comfort_learning_core",
            "automation.luna_vooruitblik_en_afwijking_core",
            "automation.luna_simulatie_voorbereiding",
            "automation.luna_simulatie_evaluatie",
            "automation.luna_persoonlijke_assistent_core",
            "automation.luna_mega_integrator_core"
          ],
          "kritieke_scripts": [
            "script.luna_ollama_router",
            "script.luna_ollama_queue",
            "script.luna_ollama_background_queue"
          ],
          "kritieke_helpers": [
            "input_text.luna_mega_status",
            "input_text.luna_mega_pipeline_status",
            "input_text.luna_mega_memory_quality",
            "input_text.luna_mega_prediction_quality",
            "input_text.luna_mega_safety_status",
            "input_number.luna_prediction_coverage",
            "input_number.luna_ai_cache_ratio",
            "input_number.luna_ai_4b_share",
            "input_text.luna_forecast_10m",
            "input_text.luna_forecast_1h",
            "input_text.luna_forecast_later_today"
          ]
        }
      },
      {
        "variables": {
          "issues_json": "{% set ns=namespace(items=[]) %}{% if 'PASS' not in states('input_text.luna_regressietest_status') %}{% set ns.items=ns.items+['regressietest niet PASS'] %}{% endif %}{% if states('todo.luna_timeline')|int(0) > 200 %}{% set ns.items=ns.items+['Timeline placeholder_room 200 (' ~ states('todo.luna_timeline') ~ ')'] %}{% endif %}{% for e in kritieke_automations %}{% if states(e) != 'on' %}{% set ns.items=ns.items+[e ~ '=' ~ states(e)] %}{% endif %}{% endfor %}{% for e in kritieke_scripts %}{% if states(e) in ['unknown','unavailable'] %}{% set ns.items=ns.items+[e ~ '=' ~ states(e)] %}{% endif %}{% endfor %}{% for e in kritieke_helpers %}{% if states(e) in ['unknown','unavailable','none',''] %}{% set ns.items=ns.items+[e ~ '=' ~ states(e)] %}{% endif %}{% endfor %}{% if states('input_select.luna_actiemodus') != 'Safe Repair' and not states('input_text.luna_mega_safety_status').startswith('FAIL-CLOSED=JA') %}{% set ns.items=ns.items+['Mega safety niet fail-closed bij huidige actiemodus'] %}{% endif %}{% if backend_light in ['', 'unknown', 'unavailable', 'none'] or states(backend_light) in ['unknown','unavailable'] %}{% set ns.items=ns.items+['light AI-backend niet beschikbaar'] %}{% endif %}{% if backend_heavy in ['', 'unknown', 'unavailable', 'none'] or states(backend_heavy) in ['unknown','unavailable'] %}{% set ns.items=ns.items+['heavy AI-backend niet beschikbaar'] %}{% endif %}{% if is_state('input_boolean.luna_ollama_inference_actief','on') and is_state('script.luna_ollama_queue','off') and (as_timestamp(now())-as_timestamp(states.input_boolean.luna_ollama_inference_actief.last_changed,as_timestamp(now()))) > 180 %}{% set ns.items=ns.items+['stale inference-vlag >3 min'] %}{% endif %}{{ ns.items|to_json }}"
        }
      },
      {
        "variables": {
          "issues": "{{ issues_json|from_json([]) }}",
          "nieuwe_status": "{{ (now().strftime('%d-%m %H:%M') ~ ' · ' ~ ('FOUT · ' ~ (issues|count) ~ ' · ' ~ (issues|join(' | ')) if issues|count>0 else 'OK · kern/router/geheugen/fail-closed gezond'))[:255] }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_selfcheck_status"
        },
        "data": {
          "value": "{{ nieuwe_status }}"
        }
      },
      {
        "action": "input_datetime.set_datetime",
        "target": {
          "entity_id": "input_datetime.luna_selfcheck_laatste"
        },
        "data": {
          "datetime": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        }
      },
      {
        "choose": [
          {
            "conditions": [
              {
                "condition": "template",
                "value_template": "{{ issues|count > 0 and not oude_status.startswith('FOUT') and ' · FOUT · ' not in oude_status }}"
              }
            ],
            "sequence": [
              {
                "action": "persistent_notification.create",
                "data": {
                  "notification_id": "luna_selfcheck",
                  "title": "Luna selfcheck: fout",
                  "message": "{{ issues|join('\\n- ') }}"
                }
              },
              {
                "action": "logbook.log",
                "data": {
                  "name": "Luna Selfcheck",
                  "message": "{{ 'FOUT · ' ~ (issues|join(' | ')) }}",
                  "entity_id": "input_text.luna_selfcheck_status",
                  "domain": "luna_ai"
                }
              }
            ]
          },
          {
            "conditions": [
              {
                "condition": "template",
                "value_template": "{{ issues|count == 0 and ('FOUT' in oude_status) }}"
              }
            ],
            "sequence": [
              {
                "action": "persistent_notification.dismiss",
                "data": {
                  "notification_id": "luna_selfcheck"
                }
              },
              {
                "action": "logbook.log",
                "data": {
                  "name": "Luna Selfcheck",
                  "message": "Hersteld · alle gecontroleerde Luna-kernonderdelen OK",
                  "entity_id": "input_text.luna_selfcheck_status",
                  "domain": "luna_ai"
                }
              }
            ]
          }
        ]
      }
    ],
    "mode": "single",
    "max_exceeded": "silent"
  },
