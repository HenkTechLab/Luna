  {
    "id": "1787235749877",
    "alias": "Luna Routine Core",
    "description": "Luna Routine Core v2.0. Leert lokaal uit Timeline met dagdeel/dagtype/categorie, persistente kandidaatvergelijking en stabiliteit. Bewezen patroon blijft herhaling, nooit causaliteit; alleen shadow/simulatie, geen autonome uitvoering.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "time",
        "at": "03:25:00"
      }
    ],
    "conditions": [],
    "actions": [
      {
        "action": "todo.get_items",
        "target": {
          "entity_id": "todo.luna_timeline"
        },
        "data": {
          "status": "needs_action"
        },
        "response_variable": "routine_timeline"
      },
      {
        "variables": {
          "routine_context": "{% set items=routine_timeline['todo.luna_timeline']['items']|default([],true) %}{% set ns=namespace(rows=[]) %}{% for i in items|reverse|list %}{% set s=i.summary|default('',true) %}{% if ns.rows|count < 100 and 'GESPREK' not in s and 'BUILDER' not in s and 'TEST' not in s %}{% set ns.rows=ns.rows+[s ~ ' | ' ~ ((i.description|default('',true))[:220])] %}{% endif %}{% endfor %}{{ ns.rows|join('\\n') }}"
        },
        "note": "Gebruik maximaal 100 recente niet-gespreksmatige Timeline-waarnemingen zodat de analyse begrensd en toekomstbestendig blijft."
      },
      {
        "action": "script.luna_ollama_background_queue",
        "data": {
          "task_name": "Luna Routine Core",
          "instructions": "Je bent Luna Routine Core. Analyseer uitsluitend onderstaande lokale Home Assistant Timeline. Zoek maximaal EEN herhaalbare routine die placeholder_user werk kan besparen.\n\nStrikte bewijsregels:\n- Geef samples als het aantal concrete vergelijkbare voorbeelden dat je daadwerkelijk in de context ziet.\n- Geef distinct_days als het aantal verschillende kalenderdagen waarop die passende voorbeelden voorkomen. Tel alleen datums die letterlijk in de context staan.\n- Nabije gebeurtenissen, volgorde of correlatie bewijzen GEEN oorzaak. Beschrijf alleen een herhaald patroon.\n- Negeer test-, builder- en gespreksregels; die zijn al grotendeels voorgefilterd.\n- Geen apparaatbediening, geen configwijziging, geen autonome automation.\n- candidate is een korte stabiele Nederlandse omschrijving die bij herhaalde analyses zo gelijk mogelijk blijft.\n- classificeer category uitsluitend als verlichting, zonwering, klimaat, energie, aanwezigheid, media, auto, systeem of overig.\n- classificeer daypart uitsluitend als nacht, ochtend, middag, avond of gemengd op basis van de tijden van de passende voorbeelden.\n- classificeer daytype uitsluitend als werkdag, weekend of gemengd op basis van de letterlijk zichtbare datums/dagen; als dit niet betrouwbaar afleidbaar is kies gemengd.\n- confidence is 0-100 en gaat over zekerheid dat de HERHALING echt in deze Timeline staat, niet over causaliteit.\n- suggest=true uitsluitend bij samples>=5, distinct_days>=3 en confidence>=85.\n- Als er onvoldoende bewijs is: suggest=false, candidate='Nog geen sterke routine gevonden'.\n\nTimeline:\n{{ routine_context }}",
          "structure": {
            "candidate": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "confidence": {
              "selector": {
                "number": {
                  "min": 0,
                  "max": 100,
                  "step": 1
                }
              },
              "required": true
            },
            "samples": {
              "selector": {
                "number": {
                  "min": 0,
                  "max": 100,
                  "step": 1
                }
              },
              "required": true
            },
            "suggest": {
              "selector": {
                "boolean": {}
              },
              "required": true
            },
            "reason": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "distinct_days": {
              "selector": {
                "number": {
                  "min": 0,
                  "max": 30,
                  "step": 1
                }
              },
              "required": true
            },
            "category": {
              "selector": {
                "select": {
                  "options": [
                    "verlichting",
                    "zonwering",
                    "klimaat",
                    "energie",
                    "aanwezigheid",
                    "media",
                    "auto",
                    "systeem",
                    "overig"
                  ]
                }
              },
              "required": true
            },
            "daypart": {
              "selector": {
                "select": {
                  "options": [
                    "nacht",
                    "ochtend",
                    "middag",
                    "avond",
                    "gemengd"
                  ]
                }
              },
              "required": true
            },
            "daytype": {
              "selector": {
                "select": {
                  "options": [
                    "werkdag",
                    "weekend",
                    "gemengd"
                  ]
                }
              },
              "required": true
            }
          },
          "cacheable": true,
          "freshness": "stable",
          "task_category": "routine"
        },
        "response_variable": "routine_ai"
      },
      {
        "variables": {
          "routine_samples": "{{ [0,[routine_ai.data.samples|int(0),100]|min]|max }}",
          "routine_days": "{{ [0,[routine_ai.data.distinct_days|int(0),30]|min]|max }}",
          "routine_conf": "{{ [0,[routine_ai.data.confidence|int(0),100]|min]|max }}"
        }
      },
      {
        "variables": {
          "routine_phase": "{% if routine_samples|int(0) == 0 %}GEEN_DATA{% elif routine_samples|int(0) < 3 %}OBSERVATIE{% elif routine_samples|int(0) < 5 or routine_days|int(0) < 3 or routine_conf|int(0) < 85 %}VERMOEDEN{% else %}BEWEZEN_PATROON{% endif %}"
        }
      },
      {
        "variables": {
          "routine_candidate": "{{ routine_ai.data.candidate|default('Nog geen sterke routine gevonden',true)|trim }}",
          "routine_prev": "{{ states('input_text.luna_routine_candidate_previous')|trim }}",
          "routine_valid_candidate": "{{ routine_samples|int(0)>0 and routine_candidate|lower != 'nog geen sterke routine gevonden' }}",
          "routine_same": "{{ routine_samples|int(0)>0 and routine_candidate|lower != 'nog geen sterke routine gevonden' and routine_prev|lower == routine_candidate|lower }}",
          "routine_category": "{{ routine_ai.data.category|default('overig',true) }}",
          "routine_daypart": "{{ routine_ai.data.daypart|default('gemengd',true) }}",
          "routine_daytype": "{{ routine_ai.data.daytype|default('gemengd',true) }}"
        }
      },
      {
        "choose": [
          {
            "conditions": [
              {
                "condition": "template",
                "value_template": "{{ routine_same }}"
              }
            ],
            "sequence": [
              {
                "action": "counter.increment",
                "target": {
                  "entity_id": "counter.luna_routine_streak"
                }
              }
            ]
          }
        ],
        "default": [
          {
            "action": "counter.reset",
            "target": {
              "entity_id": "counter.luna_routine_streak"
            }
          },
          {
            "if": [
              {
                "condition": "template",
                "value_template": "{{ routine_valid_candidate }}"
              }
            ],
            "then": [
              {
                "action": "counter.increment",
                "target": {
                  "entity_id": "counter.luna_routine_streak"
                }
              }
            ]
          }
        ]
      },
      {
        "variables": {
          "routine_streak": "{{ states('counter.luna_routine_streak')|int(0) }}",
