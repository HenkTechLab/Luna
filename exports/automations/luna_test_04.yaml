  {
    "id": "1787235798688",
    "alias": "Luna Vooruitblik en Afwijking Core",
    "description": "Luna Vooruitblik/Afwijking v2.0. Scheidt drie voorspellingshorizons, bewijsniveau en anomaly-classificatie; vereist herhaling voordat een afwijking persistent heet. Alleen lokale analyse, nooit sturing.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "time_pattern",
        "hours": "/4",
        "minutes": 10
      }
    ],
    "actions": [
      {
        "action": "script.luna_ollama_background_queue",
        "data": {
          "task_name": "Luna vooruitblik en afwijking",
          "instructions": "Analyseer uitsluitend de actuele lokale Home Assistant-context hieronder. Maak drie afzonderlijke verwachtingen: circa 10 minuten, circa 1 uur en later vandaag. Voorspellingen zijn verwachtingen, geen feiten. Scheid bij afwijkingen BEWEZEN, WAARSCHIJNLIJK en ONBEKEND. Noem iets nooit een bewezen storing zonder letterlijk hard bewijs in de context. Gebruik geen actuele state als bewijs voor een historische oorzaak en verzin geen automationnaam.\n\nClassificeer anomaly_class exact als: geen, observatie, afwijking_mogelijk, storing_onbewezen of onbekend. Geef anomaly_key als een korte stabiele beschrijving zonder tijdstempel; gebruik 'geen' als er geen concrete afwijking is. evidence_level exact laag, middel of hoog, gebaseerd op hoeveelheid onafhankelijke lokale signalen. Eén signaal of alleen AI-afleiding kan nooit hoog zijn.\n\nConsistentieregel: als Kritiek groter dan 0 is of Health letterlijk aandacht/waarschuwing/fout meldt, mag je NOOIT schrijven dat er geen waarschuwingen of problemen actief zijn. Benoem het bestaande Health-aandachtspunt dan in evidence, maar behandel een bekend onderhoudspunt niet automatisch als nieuwe anomalie.\n\nGeen apparaatbediening en geen configuratiewijziging.\nDoel={{ states('input_text.luna_doelprofiel') }}\nHealth={{ states('input_text.luna_health_status') }}\nKritiek={{ states('input_number.luna_health_kritieke_storingen') }}\nEnergie={{ states('input_text.luna_energiecoach_status') }}\nAnalytics={{ states('input_text.luna_analytics_laatste_inzicht') }}\nSensorscore={{ states('input_number.luna_analytics_sensorscore') }}%\nRoutine={{ states('input_text.luna_routine_status') }}\nComfort={{ states('input_text.luna_comfortprofiel_status') }}\nPrediction={{ states('input_text.luna_prediction_laatste_voorspelling') }}\nLaatste sturing={{ states('input_text.luna_laatste_sturing') }}\nMega data={{ states('input_text.luna_mega_data_quality') }}",
          "structure": {
            "anomaly_class": {
              "selector": {
                "select": {
                  "options": [
                    "geen",
                    "observatie",
                    "afwijking_mogelijk",
                    "storing_onbewezen",
                    "onbekend"
                  ]
                }
              },
              "required": true
            },
            "anomaly_key": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "anomaly_summary": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "evidence_level": {
              "selector": {
                "select": {
                  "options": [
                    "laag",
                    "middel",
                    "hoog"
                  ]
                }
              },
              "required": true
            },
            "evidence": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "next_10m": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "confidence_10m": {
              "selector": {
                "number": {
                  "min": 0,
                  "max": 100,
                  "step": 1
                }
              },
              "required": true
            },
            "next_1h": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "confidence_1h": {
              "selector": {
                "number": {
                  "min": 0,
                  "max": 100,
                  "step": 1
                }
              },
              "required": true
            },
            "later_today": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "confidence_later": {
              "selector": {
                "number": {
                  "min": 0,
                  "max": 100,
                  "step": 1
                }
              },
              "required": true
            },
            "anomaly_confidence": {
              "selector": {
                "number": {
                  "min": 0,
                  "max": 100,
                  "step": 1
                }
              },
              "required": true
            }
          },
          "complexity": "light",
          "cacheable": false,
          "freshness": "live",
          "task_category": "status"
        },
        "response_variable": "vooruit_ai",
        "continue_on_error": true
      },
      {
        "if": [
          {
            "condition": "template",
            "value_template": "{{ vooruit_ai is defined and vooruit_ai.data is defined }}"
          }
        ],
        "then": [
          {
            "variables": {
              "aclass": "{{ vooruit_ai.data.anomaly_class|default('onbekend',true) }}",
              "akey": "{{ vooruit_ai.data.anomaly_key|default('geen',true)|trim|lower }}",
              "aprev": "{{ states('input_text.luna_anomaly_previous')|trim|lower }}",
              "meaningful": "{{ vooruit_ai.data.anomaly_class|default('onbekend',true) in ['observatie','afwijking_mogelijk','storing_onbewezen'] and vooruit_ai.data.anomaly_key|default('geen',true)|trim|lower not in ['','geen','onbekend'] }}",
              "same": "{{ vooruit_ai.data.anomaly_class|default('onbekend',true) in ['observatie','afwijking_mogelijk','storing_onbewezen'] and vooruit_ai.data.anomaly_key|default('geen',true)|trim|lower == states('input_text.luna_anomaly_previous')|trim|lower }}",
              "aconf": "{{ [0,[vooruit_ai.data.anomaly_confidence|int(0),100]|min]|max }}"
            }
          },
          {
            "choose": [
              {
                "conditions": [
                  {
                    "condition": "template",
                    "value_template": "{{ same }}"
                  }
                ],
                "sequence": [
                  {
                    "action": "counter.increment",
                    "target": {
                      "entity_id": "counter.luna_anomaly_streak"
                    }
                  }
                ]
              }
            ],
            "default": [
              {
                "action": "counter.reset",
                "target": {
                  "entity_id": "counter.luna_anomaly_streak"
                }
              },
              {
                "if": [
                  {
                    "condition": "template",
                    "value_template": "{{ meaningful }}"
                  }
                ],
                "then": [
                  {
                    "action": "counter.increment",
                    "target": {
                      "entity_id": "counter.luna_anomaly_streak"
                    }
                  }
                ]
              }
            ]
          },
          {
            "variables": {
              "astreak": "{{ states('counter.luna_anomaly_streak')|int(0) }}",
              "persist_label": "{% if not meaningful %}GEEN_PERSISTENTE_AFWIJKING{% elif states('counter.luna_anomaly_streak')|int(0) >= 2 %}PERSISTENTE_OBSERVATIE{% else %}EERSTE_OBSERVATIE{% endif %}"
            }
          },
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_anomaly_previous"
            },
            "data": {
              "value": "{{ (akey if meaningful else 'geen')[:255] }}"
            }
          },
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_anomaly_evidence_level"
            },
            "data": {
              "value": "{{ ('niveau=' ~ vooruit_ai.data.evidence_level ~ ' · confidence=' ~ aconf ~ '% · streak=' ~ astreak ~ ' · bewijs=' ~ vooruit_ai.data.evidence)[:255] }}"
            }
          },
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_forecast_10m"
            },
            "data": {
              "value": "{{ ('10m · ' ~ (vooruit_ai.data.confidence_10m|int(0)) ~ '% · ' ~ vooruit_ai.data.next_10m)[:255] }}"
            }
          },
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_forecast_1h"
            },
            "data": {
              "value": "{{ ('1u · ' ~ (vooruit_ai.data.confidence_1h|int(0)) ~ '% · ' ~ vooruit_ai.data.next_1h)[:255] }}"
            }
          },
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_forecast_later_today"
            },
            "data": {
              "value": "{{ ('later · ' ~ (vooruit_ai.data.confidence_later|int(0)) ~ '% · ' ~ vooruit_ai.data.later_today)[:255] }}"
            }
          },
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_afwijking_status"
            },
            "data": {
              "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · ' ~ persist_label ~ ' · class=' ~ aclass ~ ' · ' ~ aconf ~ '% · ' ~ vooruit_ai.data.anomaly_summary)[:255] }}"
            }
          },
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_vooruitblik_status"
            },
            "data": {
              "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · 10m=' ~ (vooruit_ai.data.confidence_10m|int(0)) ~ '% · 1u=' ~ (vooruit_ai.data.confidence_1h|int(0)) ~ '% · later=' ~ (vooruit_ai.data.confidence_later|int(0)) ~ '% · details in horizonhelpers')[:255] }}"
            }
          }
        ]
      }
    ],
    "mode": "single",
    "max_exceeded": "silent",
    "initial_state": false
  },
