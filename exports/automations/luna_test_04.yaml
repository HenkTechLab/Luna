                  "entity_id": [
                    "counter.luna_simulatie_goede_dagen",
                    "counter.luna_simulatie_mislukte_dagen",
                    "counter.luna_simulatie_onzekere_dagen"
                  ]
                }
              },
              {
                "action": "input_text.set_value",
                "target": {
                  "entity_id": "input_text.luna_simulatie_status"
                },
                "data": {
                  "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · NIEUWE_KANDIDAAT · ' ~ candidate ~ ' · tellers gereset')[:255] }}"
                }
              }
            ]
          }
        ]
      }
    ],
    "mode": "single",
    "initial_state": false
  },
  {
    "id": "1787235770538",
    "alias": "Luna Timeline - hot memory retentie",
    "description": "Timeline Retentie v1.2. Houdt todo.luna_timeline automatisch op circa 160 recente gebeurtenissen. placeholder_room 200 start direct retentie; elke 15 minuten en om 03:15 is er een vangnet. Verplaatst in veilige batches van maximaal 100: eerst archiveren, daarna verwijderen uit hot memory.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "numeric_state",
        "entity_id": "todo.luna_timeline",
        "above": 200,
        "id": "grens"
      },
      {
        "trigger": "time_pattern",
        "minutes": "/15",
        "id": "vangnet"
      },
      {
        "trigger": "time",
        "at": "03:15:00",
        "id": "dagelijks"
      }
    ],
    "conditions": [],
    "actions": [
      {
        "variables": {
          "start_count": "{{ states('todo.luna_timeline') | int(0) }}"
        }
      },
      {
        "repeat": {
          "while": [
            {
              "condition": "numeric_state",
              "entity_id": "todo.luna_timeline",
              "above": 160
            }
          ],
          "sequence": [
            {
              "action": "todo.get_items",
              "target": {
                "entity_id": "todo.luna_timeline"
              },
              "data": {
                "status": "needs_action"
              },
              "response_variable": "hot_response"
            },
            {
              "variables": {
                "hot_count": "{{ states('todo.luna_timeline') | int(0) }}",
                "excess": "{{ [0, hot_count - 160] | max }}",
                "batch": "{{ [excess | int(0), 100] | min }}",
                "items": "{{ (hot_response['todo.luna_timeline']['items'] | default([], true))[:batch | int(0)] }}"
              }
            },
            {
              "repeat": {
                "for_each": "{{ items }}",
                "sequence": [
                  {
                    "action": "todo.add_item",
                    "target": {
                      "entity_id": "todo.luna_timeline_archief"
                    },
                    "data": {
                      "item": "{{ repeat.item.summary }}",
                      "description": "{{ repeat.item.description | default('', true) }}"
                    }
                  },
                  {
                    "action": "todo.remove_item",
                    "target": {
                      "entity_id": "todo.luna_timeline"
                    },
                    "data": {
                      "item": "{{ repeat.item.uid }}"
                    }
                  }
                ]
              }
            }
          ]
        }
      },
      {
        "variables": {
          "final_count": "{{ states('todo.luna_timeline') | int(0) }}",
          "moved": "{{ [0, start_count - final_count] | max }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_onderhoud_status"
        },
        "data": {
          "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · Timeline retentie v1.2 · verplaatst=' ~ moved ~ ' · hot=' ~ final_count ~ ' · doel<=160')[:255] }}"
        },
        "continue_on_error": true
      }
    ],
    "mode": "queued",
    "max": 10,
    "max_exceeded": "silent",
    "initial_state": false
  },
  {
