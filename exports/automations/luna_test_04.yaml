  {
    "id": "1787235741462",
    "alias": "Luna - Regressietest Core",
    "description": "Regressietest v1.3. Deterministische gratis controle van Luna-kern plus Mega Integrator, kwaliteitsmeters, forecast-horizons, routine-stabiliteit en fail-closed consistentie.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "homeassistant",
        "event": "start",
        "id": "start"
      },
      {
        "trigger": "time",
        "at": "04:00:00",
        "id": "dagelijks"
      },
      {
        "trigger": "state",
        "entity_id": "input_button.luna_regressietest_nu",
        "id": "handmatig"
      }
    ],
    "conditions": [],
    "actions": [
      {
        "variables": {
          "proven": "{{ states('counter.luna_prediction_goede_beslissingen_totaal')|int(0) + states('counter.luna_prediction_slechte_beslissingen_totaal')|int(0) }}",
          "prediction": "{{ states('input_number.luna_prediction_betrouwbaarheid')|float(0) }}",
          "fouten": "{% set ns=namespace(x=[]) %}{% set required=['automation.ai_luna_specialist_vraag','automation.luna_prediction_core','automation.luna_analytics_core','automation.luna_analytics_beslissing_beoordelen','automation.luna_autonomie_bewijspoort','automation.luna_builder_veilige_uitvoerwachtrij','automation.luna_timeline_hot_memory_retentie','automation.luna_entity_relations_relatiekaart','automation.luna_routine_core','automation.luna_proactieve_voorstellen','automation.luna_ollama_metrics_samenvatting','automation.luna_ollama_backend_status','automation.luna_selfcheck_core','automation.luna_memory_duurzame_deduplicatie','automation.luna_decision_journal_core','automation.luna_impliciete_feedback_core','automation.luna_kennisveroudering_core','automation.luna_comfort_learning_core','automation.luna_vooruitblik_en_afwijking_core','automation.luna_simulatie_voorbereiding','automation.luna_simulatie_evaluatie','automation.luna_persoonlijke_assistent_core','automation.luna_mega_integrator_core'] %}{% for e in required %}{% if states(e) != 'on' %}{% set ns.x=ns.x+[e ~ '=' ~ states(e)] %}{% endif %}{% endfor %}{% if state_attr('automation.ai_luna_specialist_vraag','mode') != 'queued' %}{% set ns.x=ns.x+['vraagmotor mode!=' ~ (state_attr('automation.ai_luna_specialist_vraag','mode')|string)] %}{% endif %}{% if state_attr('automation.luna_analytics_beslissing_beoordelen','mode') != 'parallel' %}{% set ns.x=ns.x+['evaluator mode!=' ~ (state_attr('automation.luna_analytics_beslissing_beoordelen','mode')|string)] %}{% endif %}{% for e in ['counter.luna_prediction_goede_beslissingen_totaal','counter.luna_prediction_slechte_beslissingen_totaal','counter.luna_prediction_onbekende_beslissingen_totaal','input_text.luna_laatste_uitvoeringsstatus','input_text.luna_verifier_status'] %}{% if states(e) in ['unknown','unavailable'] %}{% set ns.x=ns.x+[e ~ '=' ~ states(e)] %}{% endif %}{% endfor %}{% if states('todo.luna_timeline')|int(9999) > 200 %}{% set ns.x=ns.x+['hot Timeline=' ~ states('todo.luna_timeline') ~ '>200'] %}{% endif %}{% if states('todo.luna_relatiekaart')|int(0) < 8 %}{% set ns.x=ns.x+['relatiekaart=' ~ states('todo.luna_relatiekaart') ~ '<8'] %}{% endif %}{% if proven|int(0) < 10 and not states('input_text.luna_autonomie_gereedheid').startswith('LEREN') %}{% set ns.x=ns.x+['autonomie niet LEREN bij <10 bewijs'] %}{% endif %}{% if prediction|float(0) < 70 and states('input_text.luna_autonomie_gereedheid').startswith('GEREED') %}{% set ns.x=ns.x+['autonomie GEREED bij Prediction<70'] %}{% endif %}{% for e in ['script.luna_ollama_router','script.luna_ollama_queue','script.luna_ollama_background_queue'] %}{% if states(e) in ['unknown','unavailable'] %}{% set ns.x=ns.x+[e ~ '=' ~ states(e)] %}{% endif %}{% endfor %}{% for e in ['input_text.luna_ollama_backend_light','input_text.luna_ollama_backend_heavy','input_text.luna_ollama_metrics_status','input_text.luna_selfcheck_status','input_text.luna_memory_dedup_status','input_text.luna_doelprofiel','input_text.luna_decision_journal_status','input_text.luna_impliciete_feedback_status','input_text.luna_kennisveroudering_status','input_text.luna_comfortprofiel_status','input_text.luna_afwijking_status','input_text.luna_vooruitblik_status','input_text.luna_simulatie_status','input_text.luna_persoonlijke_assistent_status','input_text.luna_mega_status','input_text.luna_mega_pipeline_status','input_text.luna_mega_memory_quality','input_text.luna_mega_prediction_quality','input_text.luna_mega_safety_status','input_text.luna_forecast_10m','input_text.luna_forecast_1h','input_text.luna_forecast_later_today'] %}{% if states(e) in ['unknown','unavailable','none',''] %}{% set ns.x=ns.x+[e ~ '=' ~ states(e)] %}{% endif %}{% endfor %}{% for e in ['input_number.luna_prediction_coverage','input_number.luna_ai_cache_ratio','input_number.luna_ai_4b_share','input_number.luna_routine_stability'] %}{% if states(e)|float(-1)<0 or states(e)|float(-1)>100 %}{% set ns.x=ns.x+[e ~ ' placeholder_room 0..100=' ~ states(e)] %}{% endif %}{% endfor %}{% if states('input_select.luna_actiemodus') != 'Safe Repair' and not states('input_text.luna_mega_safety_status').startswith('FAIL-CLOSED=JA') %}{% set ns.x=ns.x+['fail-closed inconsistent met actiemodus'] %}{% endif %}{% if states('input_text.luna_leerfase') not in ['GEEN_DATA','OBSERVATIE','VERMOEDEN','BEWEZEN_PATROON'] %}{% set ns.x=ns.x+['leerfase ongeldig=' ~ states('input_text.luna_leerfase')] %}{% endif %}{{ ns.x }}",
          "aantal": "{{ fouten | count }}",
          "status": "{{ 'PASS' if aantal|int(0)==0 else 'FAIL' }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_regressietest_status"
        },
        "data": {
          "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · ' ~ status ~ ' · fouten=' ~ aantal ~ ((' · ' ~ (fouten|join('; '))) if aantal|int(0)>0 else ' · kern/router/metrics/geheugen/leerfase/autonomie OK'))[:255] }}"
        }
      },
      {
        "if": [
          {
            "condition": "template",
            "value_template": "{{ aantal|int(0) > 0 }}"
          }
        ],
        "then": [
          {
            "action": "todo.add_item",
            "target": {
              "entity_id": "todo.luna_timeline"
            },
            "data": {
              "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · REGRESSIETEST · FAIL",
              "description": "{{ ('Deterministische Luna-regressietest faalde: ' ~ (fouten|join('; ')))[:500] }}"
            },
            "continue_on_error": true
          }
        ]
      }
    ],
    "mode": "restart",
    "max_exceeded": "silent",
    "initial_state": false
  },
