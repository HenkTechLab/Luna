    "actions": [
      {
        "action": "todo.get_items",
        "target": {
          "entity_id": "todo.luna_ervaringsgeheugen"
        },
        "data": {
          "status": "needs_action"
        },
        "response_variable": "sim_resp"
      },
      {
        "variables": {
          "items": "{{ sim_resp['todo.luna_ervaringsgeheugen']['items'] | default([], true) }}",
          "ctx": "{% set ns=namespace(r=[]) %}{% for i in items|reverse|list %}{% if ns.r|count < 50 %}{% set ns.r=ns.r+[i.summary ~ ' | ' ~ (i.description|default('',true))[:240]] %}{% endif %}{% endfor %}{{ ns.r|join(' || ') }}",
          "candidate": "{{ states('input_text.luna_simulatie_kandidaat') }}"
        }
      },
      {
        "action": "script.luna_ollama_background_queue",
        "data": {
          "task_name": "Luna routine simulatie",
          "instructions": "Toets kandidaat uitsluitend virtueel aan recente echte ervaringen. GOED alleen bij duidelijk positief bewijs; MIS bij duidelijke correctie of tegenspraak; anders ONZEKER. Stilte is geen succesbewijs. Geen apparaatbediening. Kandidaat={{ candidate }}. Ervaringen={{ ctx }}",
          "structure": {
            "resultaat": {
              "selector": {
                "select": {
                  "options": [
                    "GOED",
                    "MIS",
                    "ONZEKER"
                  ]
                }
              },
              "required": true
            },
            "reden": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            }
          },
          "complexity": "light"
        },
