            "choose": [
              {
                "conditions": [
                  {
                    "condition": "template",
                    "value_template": "{{ sim_ai.data.resultaat == 'GOED' }}"
                  }
                ],
                "sequence": [
                  {
                    "action": "counter.increment",
                    "target": {
                      "entity_id": "counter.luna_simulatie_goede_dagen"
