    "description": "Luna Simulatie v1.0 evaluatie. Toetst dagelijks de bewezen routine virtueel aan recente ervaringen. Alleen registratie; niets wordt uitgevoerd.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "time",
        "at": "03:50:00"
      }
    ],
    "conditions": [
      {
