  {
    "id": "1787235380935",
    "alias": "Luna Builder V3 - Autonome kwaliteitsbewaking",
    "description": "Veilige v3 kwaliteitslaag. Bewaakt alleen Luna Builder-statushelpers, berekent periodiek een lokale kwaliteitsstatus en blokkeert echte vrijgave impliciet door vakantie/testmodus ongemoeid te laten. Stuurt geen huisapparaten aan.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "time_pattern",
        "minutes": "/15"
      },
      {
        "trigger": "state",
        "entity_id": [
          "input_text.luna_builder_status",
          "input_text.luna_builder_laatste_validatie",
          "input_text.luna_builder_v3_effectstatus"
        ]
      }
    ],
    "conditions": [],
    "actions": [
      {
        "variables": {
