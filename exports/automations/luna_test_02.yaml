        "data": {
          "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · ACTIEF · ' ~ gevonden ~ ' · expliciet door placeholder_user: ' ~ states('input_text.luna_laatste_vraag'))[:255] }}"
