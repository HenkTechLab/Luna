  {
    "id": "1787235549345",
    "alias": "Luna Impliciete Feedback Core",
    "description": "Luna Impliciete Feedback v1.0. Herkent een handmatige correctie kort na een automatische Luna/HA-sturing van hetzelfde doel als impliciete negatieve feedback. Leert alleen van de correctie; voert zelf niets uit.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "state",
        "entity_id": "input_text.luna_laatste_sturing"
      }
    ],
    "conditions": [
      {
        "condition": "template",
        "value_template": "{% if trigger.from_state is none or trigger.to_state is none %}false{% else %}{% set oud=trigger.from_state.state %}{% set nieuw=trigger.to_state.state %}{% set oud_naam=(oud.split('·',1)[1].split('→',1)[0]|trim) if '·' in oud and '→' in oud else '' %}{% set nieuw_naam=(nieuw.split('·',1)[1].split('→',1)[0]|trim) if '·' in nieuw and '→' in nieuw else '' %}{{ 'automatisch' in oud and 'handmatig' in nieuw and oud_naam != '' and oud_naam == nieuw_naam and (as_timestamp(now()) - as_timestamp(trigger.from_state.last_changed)) <= 1800 }}{% endif %}"
      }
    ],
    "actions": [
      {
        "variables": {
          "oud": "{{ trigger.from_state.state }}",
          "nieuw": "{{ trigger.to_state.state }}",
          "doel": "{{ (oud.split('·',1)[1].split('→',1)[0]|trim) if '·' in oud and '→' in oud else 'onbekend' }}"
        }
      },
      {
        "action": "counter.increment",
        "target": {
          "entity_id": "counter.luna_impliciete_correcties"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_impliciete_feedback_status"
        },
        "data": {
          "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · CORRECTIE · ' ~ doel ~ ' · automatisch gevolgd door handmatige wijziging binnen 30 min')[:255] }}"
        }
      },
      {
        "action": "todo.add_item",
        "target": {
          "entity_id": "todo.luna_timeline"
        },
        "data": {
          "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · IMPLICIETE_FEEDBACK · {{ doel }}",
          "description": "{{ ('Negatieve impliciete feedback: vorige automatische sturing=' ~ oud ~ ' | handmatige correctie=' ~ nieuw ~ '. Dit is voorkeurssignaal, geen bewezen oorzaak.')[:700] }}"
        },
        "continue_on_error": true
      }
    ],
    "mode": "queued",
    "max": 10,
    "max_exceeded": "silent",
    "initial_state": false
  },
  {
    "id": "1787235557942",
    "alias": "Luna Kennisveroudering Core",
    "description": "Luna Kennisveroudering v1.0. Geeft langetermijnkennis een zachte vervaldatum: items ouder dan 90 dagen zonder herbevestiging gelden als verouderd en worden door de nieuwe leerlaag niet als actief bewijs gebruikt. Verwijdert niets.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "time",
        "at": "03:30:00"
      }
    ],
    "actions": [
      {
        "action": "todo.get_items",
        "target": {
          "entity_id": "todo.luna_langetermijngeheugen"
        },
        "data": {
          "status": "needs_action"
        },
        "response_variable": "memory_response"
      },
      {
        "variables": {
          "items": "{{ memory_response['todo.luna_langetermijngeheugen']['items'] | default([], true) }}",
          "cutoff": "{{ (now()-timedelta(days=90)).strftime('%Y-%m-%d') }}",
          "verouderd": "{% set ns=namespace(n=0) %}{% for i in items %}{% set d=i.description|default('',true) %}{% set ds=(d.split('opgeslagen=',1)[1][:10] if 'opgeslagen=' in d else '0000-00-00') %}{% if ds < cutoff %}{% set ns.n=ns.n+1 %}{% endif %}{% endfor %}{{ ns.n }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_kennisveroudering_status"
        },
        "data": {
          "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · actief=' ~ ((items|count)-(verouderd|int(0))) ~ ' · verouderd=' ~ verouderd ~ ' · cutoff=' ~ cutoff ~ ' · zachte veroudering, niets verwijderd')[:255] }}"
        }
      }
    ],
    "mode": "single",
    "initial_state": false
  },
