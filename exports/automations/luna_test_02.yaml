          "health": "{{ states('input_text.luna_health_negeerlijst').split(',')|map('trim')|reject('equalto','')|list }}",
          "globaal": "{{ states('input_text.luna_globale_negeerlijst').split(',')|map('trim')|reject('equalto','')|list }}"
