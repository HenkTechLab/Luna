  {
    "id": "1787235396615",
    "alias": "Luna Builder - veilige uitvoerwachtrij",
    "description": "Luna Builder v1.2. Veilige event-intake gebruikt hetzelfde v2-pipeprotocol als de actieve Builder-runtime. Geweigerde aanvragen wijzigen het opdrachtveld niet, zodat een correcte veiligheidsafwijzing niet meer door een tweede parser als onbekend formaat wordt overschreven. Alleen nieuwe niet-kritieke state→actie aanvragen met light/switch/input_boolean zijn toegestaan.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "event",
        "event_type": "luna_builder_request"
      }
    ],
    "conditions": [],
    "actions": [
      {
        "variables": {
          "bouwtype": "{{ trigger.event.data.build_type | default('geen') }}",
          "alias": "{{ trigger.event.data.build_alias | default('') }}",
          "trigger_entity": "{{ trigger.event.data.build_trigger_entity | default('') }}",
          "trigger_to": "{{ trigger.event.data.build_trigger_to | default('') }}",
          "action_service": "{{ trigger.event.data.build_action_service | default('') }}",
          "action_entity": "{{ trigger.event.data.build_action_entity | default('') }}",
          "verboden": "{{ trigger_entity.startswith(('alarm_control_panel.','lock.','siren.','cover.')) or action_entity.startswith(('alarm_control_panel.','lock.','siren.','cover.')) or action_service.startswith(('alarm_control_panel.','lock.','siren.','cover.')) }}",
          "toegestane_actie": "{{ action_service.startswith(('light.','switch.','input_boolean.')) and action_entity.startswith(('light.','switch.','input_boolean.')) }}"
        }
      },
      {
        "choose": [
          {
            "conditions": [
              {
                "condition": "template",
                "value_template": "{{ verboden or not toegestane_actie or bouwtype != 'automation_nieuw' or not alias or not trigger_entity or not trigger_to or not action_service or not action_entity }}"
              }
            ],
            "sequence": [
              {
                "action": "input_text.set_value",
                "target": {
                  "entity_id": "input_text.luna_builder_status"
                },
                "data": {
                  "value": "{{ ('GEWEIGERD · veiligheidsfilter · ' ~ alias ~ ' · ' ~ action_service ~ '→' ~ action_entity)[:255] }}"
                }
              },
              {
                "action": "todo.add_item",
                "target": {
                  "entity_id": "todo.luna_timeline"
                },
                "data": {
                  "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · BUILDER · GEWEIGERD",
                  "description": "{{ ('Event-aanvraag geweigerd door lokale Builder-intake. type=' ~ bouwtype ~ ' | alias=' ~ alias ~ ' | trigger=' ~ trigger_entity ~ '→' ~ trigger_to ~ ' | actie=' ~ action_service ~ '→' ~ action_entity ~ ' | opdrachtveld niet gewijzigd')[:500] }}"
                },
                "continue_on_error": true
              }
            ]
          }
        ],
        "default": [
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_builder_status"
            },
            "data": {
              "value": "{{ ('KLAAR_VOOR_BOUW · ' ~ alias ~ ' · ' ~ trigger_entity ~ '→' ~ trigger_to ~ ' · ' ~ action_service ~ '→' ~ action_entity)[:255] }}"
            }
          },
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_builder_opdracht"
            },
            "data": {
              "value": "{{ ('v2|' ~ alias ~ '|state|' ~ trigger_entity ~ '||' ~ trigger_to ~ '|0||||geen|0|||' ~ action_service ~ '|' ~ action_entity ~ '||')[:255] }}"
            }
          },
          {
            "action": "todo.add_item",
            "target": {
              "entity_id": "todo.luna_timeline"
            },
            "data": {
              "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · BUILDER · KLAAR",
              "description": "{{ ('Veilige bouwopdracht gevalideerd: ' ~ alias ~ ' | ' ~ trigger_entity ~ '→' ~ trigger_to ~ ' | ' ~ action_service ~ '→' ~ action_entity)[:500] }}"
            },
            "continue_on_error": true
          }
        ]
      }
    ],
    "mode": "queued",
    "max": 10,
    "initial_state": false
  },
  {
    "id": "1787235409759",
    "alias": "Luna Coach - sensorbetrouwbaarheid en verbeteradvies",
    "description": "Geeft periodiek lokaal advies over sensorstabiliteit, Health en gebruikspatronen. Observeert uitsluitend en wijzigt niets.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "time_pattern",
        "hours": "/6",
        "id": "periodiek"
      },
      {
        "trigger": "homeassistant",
        "event": "start",
        "id": "start"
      }
    ],
    "actions": [
      {
        "choose": [
          {
            "conditions": [
              {
                "condition": "trigger",
                "id": "start"
              }
            ],
            "sequence": [
              {
                "delay": {
                  "minutes": 5
                }
              }
            ]
          }
        ]
      },
      {
        "variables": {
          "advies": "{% set score=states('input_number.luna_analytics_sensorscore')|float(100) %}{% set wissels=states('counter.luna_analytics_snelle_wisselingen_vandaag')|int(0) %}{% set kritisch=states('input_number.luna_health_kritieke_storingen')|int(0) %}{% set watch=states('input_number.luna_health_watchman_belangrijk')|int(0) %}{% set instabiel=states('input_text.luna_analytics_laatste_instabiele_sensor')|trim %}{% if score < 80 and instabiel %}Coach: controleer eerst {{ instabiel }}; sensorscore is {{ score|round(0) }}% met {{ wissels }} snelle wisselingen vandaag.{% elif kritisch > 0 %}Coach: controleer eerst de {{ kritisch }} actuele unavailable/unknown apparaten uit Health; sensoranalyse volgt daarna.{% elif score < 95 %}Coach: sensorstabiliteit verdient aandacht ({{ score|round(0) }}%); laatste instabiele sensor: {{ instabiel if instabiel else 'nog niet vastgelegd' }}.{% elif watch > 0 %}Coach: Luna ziet geen sensorprobleem; ruim Watchman-verwijzingen later op ({{ watch }} belangrijk).{% else %}Coach: geen directe verbetering nodig; Luna blijft sensoren en patronen volgen.{% endif %}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_coach_advies"
        },
        "data": {
          "value": "{{ advies[:255] }}"
        }
      },
      {
        "action": "logbook.log",
        "data": {
          "name": "Luna Coach",
          "message": "{{ advies }}",
          "entity_id": "input_text.luna_coach_advies",
          "domain": "luna_coach"
        }
      }
    ],
    "mode": "restart",
    "initial_state": false
  },
  {
    "id": "1787235417198",
    "alias": "Luna Comfort Learning Core",
    "description": "Luna Comfort Learning v2.0. Leert uitsluitend uit echte/niet-test ervaringscontext, classificeert categorie/ruimte/dagdeel zonder persoonsaanname en vereist expliciet nul tegenspraken voor duurzame leerregels. Geen sturing.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "time",
        "at": "03:40:00"
      }
    ],
    "actions": [
      {
        "action": "todo.get_items",
        "target": {
          "entity_id": "todo.luna_ervaringsgeheugen"
        },
        "data": {
          "status": "needs_action"
        },
        "response_variable": "erv_resp"
      },
      {
        "action": "todo.get_items",
        "target": {
          "entity_id": "todo.luna_langetermijngeheugen"
        },
        "data": {
          "status": "needs_action"
        },
        "response_variable": "mem_resp"
      },
      {
        "variables": {
          "erv": "{{ erv_resp['todo.luna_ervaringsgeheugen']['items'] | default([], true) }}",
          "mem": "{{ mem_resp['todo.luna_langetermijngeheugen']['items'] | default([], true) }}",
          "ctx": "{% set ns=namespace(r=[]) %}{% for i in erv|reverse|list %}{% set s=i.summary|default('',true)|upper %}{% set d=i.description|default('',true) %}{% set u=d|upper %}{% set allowed=('REAL=TRUE' in u or 'REAL=1' in u or ('REAL=' not in u and 'SIMULATIE' not in s and 'SIMULATIE' not in u)) and 'BUILDER' not in s and 'BUILDER' not in u and 'TEST' not in s and 'TEST' not in u and 'GESIMULEERD' not in u %}{% if allowed and ns.r|count < 40 %}{% set ns.r=ns.r+[i.summary ~ ' | ' ~ d[:360]] %}{% endif %}{% endfor %}{{ ns.r|join(' || ') }}",
          "keys": "{{ mem | map(attribute='summary') | list }}"
        }
      },
      {
        "action": "script.luna_ollama_background_queue",
        "data": {
          "task_name": "Luna comfort learning",
          "instructions": "Zoek maximaal één terugkerende comfortvoorkeur in de gefilterde echte ervaringsrecords. Handmatige CORRECTIE na automatische sturing is een sterk voorkeurssignaal maar geen causaliteitsbewijs. Tel alleen letterlijk aantoonbare voorbeelden, kalenderdagen en tegenspraken.\n\nEen bewezen patroon vereist minimaal 5 voorbeelden op 3 dagen en 85% zekerheid. Een duurzame leerregel vereist minimaal 90% zekerheid én contradictions=0. Als er duidelijke tegenspraak is, verlaag confidence en sla niets duurzaam op. Geef key='geen' als niets duurzaam is.\n\nClassificeer category alleen als verlichting, zonwering, klimaat, media, energie of overig. Geef area alleen als een ruimte letterlijk uit de records blijkt, anders 'onbekend'. Geef daypart als nacht/ochtend/middag/avond/gemengd. Geef person uitsluitend als een persoon letterlijk uit het bewijs blijkt, anders 'onbekend'; aanwezigheid alleen bewijst nooit wie een correctie uitvoerde.\n\nGeen apparaatbediening. Doel={{ states('input_text.luna_doelprofiel') }}. Gefilterde ervaringen={{ ctx }}",
          "structure": {
            "voorkeur": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "key": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "samples": {
              "selector": {
                "number": {
                  "min": 0,
                  "max": 100,
                  "step": 1
                }
              },
              "required": true
            },
            "days": {
              "selector": {
                "number": {
                  "min": 0,
                  "max": 30,
                  "step": 1
                }
              },
              "required": true
            },
            "confidence": {
              "selector": {
                "number": {
                  "min": 0,
                  "max": 100,
                  "step": 1
                }
              },
              "required": true
            },
            "category": {
              "selector": {
                "select": {
                  "options": [
                    "verlichting",
                    "zonwering",
                    "klimaat",
                    "media",
                    "energie",
                    "overig"
                  ]
                }
              },
              "required": true
            },
            "area": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "daypart": {
              "selector": {
                "select": {
                  "options": [
                    "nacht",
                    "ochtend",
                    "middag",
                    "avond",
                    "gemengd"
                  ]
                }
              },
              "required": true
            },
            "person": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "contradictions": {
              "selector": {
                "number": {
                  "min": 0,
                  "max": 100,
                  "step": 1
                }
              },
              "required": true
            }
          },
          "complexity": "heavy",
          "cacheable": true,
          "freshness": "stable",
          "task_category": "comfort"
        },
        "response_variable": "comfort_ai",
        "continue_on_error": true
      },
      {
        "if": [
          {
            "condition": "template",
            "value_template": "{{ comfort_ai is defined and comfort_ai.data is defined }}"
          }
        ],
        "then": [
          {
            "variables": {
              "s": "{{ comfort_ai.data.samples|int(0) }}",
              "d": "{{ comfort_ai.data.days|int(0) }}",
              "c": "{{ comfort_ai.data.confidence|int(0) }}",
              "k": "{{ comfort_ai.data.key|trim }}",
              "contra": "{{ comfort_ai.data.contradictions|int(0) }}",
              "cat": "{{ comfort_ai.data.category|default('overig',true) }}",
              "area": "{{ comfort_ai.data.area|default('onbekend',true) }}",
              "daypart": "{{ comfort_ai.data.daypart|default('gemengd',true) }}",
              "person": "{{ comfort_ai.data.person|default('onbekend',true) }}",
              "fase": "{% if s >= 5 and d >= 3 and c >= 85 and contra==0 %}BEWEZEN_PATROON{% elif s >= 3 %}VERMOEDEN{% elif s > 0 %}OBSERVATIE{% else %}GEEN_DATA{% endif %}"
            }
          },
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_comfortprofiel_status"
            },
            "data": {
              "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · ' ~ fase ~ ' · cat=' ~ cat ~ ' · area=' ~ area ~ ' · dagdeel=' ~ daypart ~ ' · persoon=' ~ person ~ ' · ' ~ s ~ '/' ~ d ~ 'd · ' ~ c ~ '% · tegenspraak=' ~ contra ~ ' · ' ~ comfort_ai.data.voorkeur)[:255] }}"
            }
          },
          {
            "if": [
              {
                "condition": "template",
                "value_template": "{{ s >= 5 and d >= 3 and c >= 90 and contra==0 and k|lower != 'geen' and ('LEERREGEL · ' ~ k) not in keys }}"
              }
            ],
            "then": [
              {
                "action": "todo.add_item",
                "target": {
                  "entity_id": "todo.luna_langetermijngeheugen"
                },
                "data": {
                  "item": "{{ 'LEERREGEL · ' ~ k }}",
                  "description": "{{ ('status=ACTIEF | bron=comfort_learning | type=voorkeur | opgeslagen=' ~ now().strftime('%Y-%m-%d') ~ ' | voorbeelden=' ~ s ~ ' | dagen=' ~ d ~ ' | zekerheid=' ~ c ~ '% | tegenspraak=' ~ contra ~ ' | category=' ~ cat ~ ' | area=' ~ area ~ ' | daypart=' ~ daypart ~ ' | person=' ~ person ~ ' | voorkeur=' ~ comfort_ai.data.voorkeur)[:1000] }}"
                },
                "continue_on_error": true
              }
            ]
          }
        ]
      }
    ],
    "mode": "single",
    "max_exceeded": "silent",
    "initial_state": false
  },
  {
    "id": "1787235425361",
    "alias": "Luna Conflict Watch - algemeen",
    "description": "Algemene Luna-conflictscan v1.4. Conservatieve voorselectie over maximaal 260 actieve automations. Friendly name/alias weegt zwaarder dan een oude entity_id; numerieke suffixen zijn nooit zelfstandig duplicaatbewijs. Bekende geofence- en naamvals-positieven zijn verwerkt. De scan wijzigt niets. Mode restart voorkomt gemiste scans tijdens de startup-delay; een nieuwere scan vervangt dan de wachtende oudere run.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "time_pattern",
        "hours": "/12",
        "minutes": 17,
        "id": "periodiek"
      },
      {
        "trigger": "homeassistant",
        "event": "start",
        "id": "start"
      }
    ],
    "conditions": [],
    "actions": [
      {
        "choose": [
          {
            "conditions": [
              {
                "condition": "trigger",
                "id": "start"
              }
            ],
            "sequence": [
              {
                "delay": {
                  "minutes": 15
                }
              }
            ]
          }
        ]
      },
      {
        "variables": {
          "inventory": "{% set ns=namespace(items=[]) %}{% for a in states.automation if a.state == 'on' and not (a.name | upper).startswith('AI-UIT') %}{% if ns.items | count < 260 %}{% set ns.items=ns.items+[a.entity_id ~ ' | ' ~ a.name ~ ' | last=' ~ (a.attributes.last_triggered|string)] %}{% endif %}{% endfor %}{{ ns.items | join('\\n') }}",
          "actief_totaal": "{{ states.automation | selectattr('state','eq','on') | list | count }}"
        }
      },
      {
        "action": "script.luna_ollama_background_queue",
        "data": {
          "task_name": "Luna algemene automation conflictscan",
          "instructions": "Je bent een conservatieve Home Assistant-conflictscanner. Analyseer alleen onderstaande inventaris van actieve automations. Zoek hoogstens één waarschijnlijk duplicaat/conflict dat uit naam, tegengestelde bedoeling of zeer vergelijkbare functie aannemelijk is. Dit is alleen een VOORSELECTIE: zonder volledige automationconfig is overlap nooit bewezen.\n\nInventaris (maximaal 260 actieve automations; dit dekt momenteel de volledige actieve set):\n{{ inventory }}\n\nRegels:\n- Geef alleen exacte automation.* entity_id's die letterlijk in de inventaris staan.\n- Alarm, rook/brand, sloten, noodfuncties en andere veiligheidsfuncties nooit als kandidaat markeren.\n- Een logisch paar zoals 'zone betreden' en 'zone verlaten', 'aan' en 'uit', of 'koelen' en 'verwarmen' is normaal en geen conflict op zichzelf.\n- Persoons-/geofence-automations met verschillende plaats- of zonenamen zijn normaal en mogen zonder volledige triggerconfig nooit als conflict worden gemarkeerd.\n- Een eerdere scan koppelde McDonald's Malden en McDonald's Dukenbrug ten onrechte; configuratie-inspectie bewees verschillende zone-triggers. Herhaal dit type fout niet.\n- Verschillende drukknoppen/scenes zijn niet automatisch duplicaten.\n- De friendly name/alias in de inventaris is leidender dan het entity_id: entity_id kan historisch verkeerd of verouderd benoemd zijn. Een suffix zoals _2 is NOOIT op zichzelf duplicaatbewijs.\n- Een eerdere scan koppelde automation.luna_shadow_automation_target (alias Auto klaar met laden melding; EV-laden) ten onrechte aan automation.luna_shadow_automation_target (echte wasmachine). Volledige config bewees verschillende bronnen/functies. Herhaal dit type naamfout niet.\n- Bij onvoldoende bewijs: suspicious=false.\n- suspicious=true alleen bij confidence >=90 en benoem expliciet dat configuratie-inspectie nog nodig is.\n- Verzin geen entity_id, vervanger of bewijs.",
          "structure": {
            "suspicious": {
              "selector": {
                "boolean": {}
              },
              "required": true
            },
            "confidence": {
              "selector": {
                "number": {
                  "min": 0,
                  "max": 100,
                  "step": 1
                }
              },
              "required": true
            },
            "candidate_a": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "candidate_b": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            },
            "reason": {
              "selector": {
                "text": {
                  "multiline": false
                }
              },
              "required": true
            }
          }
        },
        "response_variable": "scan_ai",
        "continue_on_error": true
      },
      {
        "if": [
          {
            "condition": "template",
            "value_template": "{{ scan_ai is defined and scan_ai.data is defined }}"
          }
        ],
        "then": [
          {
            "variables": {
              "verdacht": "{{ scan_ai.data.suspicious | default(false) }}",
              "zekerheid": "{% set c=scan_ai.data.confidence|float(0) %}{{ (((c*100) if c>0 and c<=1 else c) | round(0) | int) }}",
              "a": "{{ scan_ai.data.candidate_a | trim }}",
              "b": "{{ scan_ai.data.candidate_b | trim }}",
              "reden": "{{ scan_ai.data.reason | trim }}",
              "a_geldig": "{{ a.startswith('automation.') and a in inventory }}",
              "b_geldig": "{{ b.startswith('automation.') and b in inventory }}",
              "status": "{% if verdacht and zekerheid >= 90 and a_geldig and b_geldig %}VERDACHT{% else %}GEEN_BEWEZEN_CONFLICT{% endif %}"
            }
          },
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_automation_scan_advies"
            },
            "data": {
              "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · ' ~ status ~ ' · ' ~ zekerheid ~ '% · ' ~ (a ~ ' ↔ ' ~ b ~ ' · ' ~ reden if status == 'VERDACHT' else 'algemene scan: geen voldoende sterke kandidaat; actieve automations=' ~ actief_totaal))[:255] }}"
            }
          },
          {
            "if": [
              {
                "condition": "template",
                "value_template": "{{ status == 'VERDACHT' }}"
              }
            ],
            "then": [
              {
                "action": "todo.add_item",
                "target": {
                  "entity_id": "todo.luna_timeline"
                },
                "data": {
                  "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · CONFLICT_SCAN · VOORSELECTIE",
                  "description": "{{ ('Mogelijke overlap ' ~ a ~ ' ↔ ' ~ b ~ ' · zekerheid=' ~ zekerheid ~ '% · ' ~ reden ~ ' · Nog niet bewezen; volledige configuratie-inspectie vereist vóór enige wijziging.')[:500] }}"
                },
                "continue_on_error": true
              }
            ]
          }
        ]
      }
    ],
    "mode": "restart",
    "initial_state": false
  },
  {
    "id": "1787235430921",
