          "validatie": "{{ states('input_text.luna_builder_laatste_validatie') }}",
          "effect": "{{ states('input_text.luna_builder_v3_effectstatus') }}",
          "goed": "{{ states('counter.luna_builder_v3_goede_tests') | int(0) }}",
          "fout": "{{ states('counter.luna_builder_v3_slechte_tests') | int(0) }}",
          "sim": "{{ states('counter.luna_builder_v3_gesimuleerde_builds') | int(0) }}",
          "weigering": "{{ states('counter.luna_builder_v3_geweigerde_builds') | int(0) }}",
          "modules": "{{ ['input_boolean.luna_builder_v3_01_veiligheidskern','input_boolean.luna_builder_v3_02_validatiepoort','input_boolean.luna_builder_v3_03_conflictcontrole','input_boolean.luna_builder_v3_04_planfase','input_boolean.luna_builder_v3_05_zelfdiagnose','input_boolean.luna_builder_v3_06_effectmeting','input_boolean.luna_builder_v3_07_rollback','input_boolean.luna_builder_v3_08_uitleg','input_boolean.luna_builder_v3_09_werkvoorraad','input_boolean.luna_builder_v3_10_onderhoud'] | select('is_state','on') | list | count }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_builder_v3_zelfdiagnose"
        },
        "data": {
          "value": "{{ ('OK' if modules == 10 and builder not in ['unknown','unavailable'] and validatie not in ['unknown','unavailable'] else 'LET OP') ~ ' · modules=' ~ modules ~ '/10 · simulaties=' ~ sim ~ ' · geweigerd=' ~ weigering ~ ' · praktijktests=' ~ goed ~ ' goed/' ~ fout ~ ' fout' }}"
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_builder_v3_onderhoud"
        },
        "data": {
          "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · kwaliteitsbewaking actief · Builder=' ~ builder ~ ' · validatie=' ~ validatie)[:255] }}"
        }
      },
      {
        "choose": [
          {
            "conditions": [
              {
                "condition": "state",
                "entity_id": "input_boolean.luna_builder_v3_01_veiligheidskern",
                "state": "off"
              }
            ],
            "sequence": [
              {
                "action": "input_text.set_value",
                "target": {
                  "entity_id": "input_text.luna_builder_v3_conflictstatus"
                },
                "data": {
                  "value": "BLOKKADE · veiligheidskern uit · geen autonome vrijgave"
                }
              }
            ]
          },
          {
            "conditions": [
              {
                "condition": "state",
                "entity_id": "input_boolean.luna_builder_v3_02_validatiepoort",
                "state": "off"
              }
            ],
            "sequence": [
              {
                "action": "input_text.set_value",
                "target": {
                  "entity_id": "input_text.luna_builder_v3_conflictstatus"
                },
                "data": {
                  "value": "BLOKKADE · validatiepoort uit · geen autonome vrijgave"
                }
              }
            ]
          }
        ]
      }
    ],
    "mode": "restart",
    "initial_state": false
  },
