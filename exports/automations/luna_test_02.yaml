  {
    "id": "1787235454392",
    "alias": "Luna Decision Journal Core",
    "description": "Luna Decision Journal v2.0. Ervaringslus met provenance, dagdeel/dagtype, real-vs-simulatie, outcomeclassificatie, exacte duplicaatbescherming en expliciete evidence-labels. Test/Builder-signalen worden niet als echte ervaring opgeslagen.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "state",
        "entity_id": "input_text.luna_autonomie_voor_actie",
        "id": "besluit"
      },
      {
        "trigger": "state",
        "entity_id": "input_text.luna_autonomie_leerervaring",
        "id": "uitkomst"
      },
      {
        "trigger": "state",
        "entity_id": "input_text.luna_impliciete_feedback_status",
        "id": "correctie"
      },
      {
        "trigger": "state",
        "entity_id": "input_text.luna_simulatie_status",
        "id": "simulatie"
      }
    ],
    "conditions": [
      {
        "condition": "template",
        "value_template": "{{ trigger.to_state is not none and trigger.to_state.state not in ['', 'unknown', 'unavailable', 'none'] and (trigger.id != 'correctie' or 'CORRECTIE' in trigger.to_state.state) and (trigger.id != 'simulatie' or ('LEREN' in trigger.to_state.state or 'KLAAR_VOOR_VOORSTEL' in trigger.to_state.state or 'NIEUWE_KANDIDAAT' in trigger.to_state.state)) }}"
      }
    ],
    "actions": [
      {
        "action": "todo.get_items",
        "target": {
          "entity_id": "todo.luna_ervaringsgeheugen"
        },
        "data": {
          "status": "needs_action"
        },
        "response_variable": "journal_items_response"
      },
      {
        "variables": {
          "items": "{{ journal_items_response['todo.luna_ervaringsgeheugen']['items'] | default([], true) }}",
          "soort": "{% if trigger.id == 'besluit' %}BESLUIT{% elif trigger.id == 'uitkomst' %}UITKOMST{% elif trigger.id == 'correctie' %}CORRECTIE{% else %}SIMULATIE{% endif %}",
          "bronwaarde": "{{ trigger.to_state.state }}",
          "provenance": "{{ trigger.entity_id }}",
          "situatie": "{{ states('input_text.luna_autonomie_voor_actie') }}",
          "verwachting": "{% if trigger.id == 'besluit' %}Beoogde configuratietoestand blijft intact; werkelijk effect wordt apart gemeten en nooit vooraf als succes aangenomen.{% elif trigger.id == 'simulatie' %}Virtuele keuze moet overeenkomen met later waargenomen gedrag zonder echte sturing uit te voeren.{% else %}n.v.t.{% endif %}",
          "uitkomst": "{{ states('input_text.luna_autonomie_leerervaring') }}",
          "doel": "{{ states('input_text.luna_doelprofiel') }}",
          "daypart": "{% if now().hour < 6 %}nacht{% elif now().hour < 12 %}ochtend{% elif now().hour < 18 %}middag{% else %}avond{% endif %}",
          "daytype": "{{ 'weekend' if now().weekday()>=5 else 'werkdag' }}",
          "record_class": "{% if trigger.id=='correctie' %}voorkeurssignaal{% elif trigger.id=='uitkomst' %}waargenomen_uitkomst{% elif trigger.id=='simulatie' %}simulatie{% else %}beslissing{% endif %}",
          "real_world": "{{ trigger.id != 'simulatie' }}",
          "test_like": "{{ trigger.id != 'simulatie' and ('TEST' in trigger.to_state.state|upper or 'BUILDER' in trigger.to_state.state|upper or 'GESIMULEERD' in trigger.to_state.state|upper) }}",
          "outcome_class": "{% set u=states('input_text.luna_autonomie_leerervaring')|upper %}{% if 'SLECHTER' in u or 'NEGATIEF' in u %}NEGATIEF{% elif 'BETER' in u or 'POSITIEF' in u %}POSITIEF{% elif 'GEEN_EFFECT' in u %}GEEN_EFFECT{% else %}ONBEKEND{% endif %}",
          "evidence_level": "{% if trigger.id=='correctie' %}middel{% elif trigger.id=='uitkomst' and ('BETER' in states('input_text.luna_autonomie_leerervaring')|upper or 'SLECHTER' in states('input_text.luna_autonomie_leerervaring')|upper or 'GEEN_EFFECT' in states('input_text.luna_autonomie_leerervaring')|upper) %}hoog{% else %}laag{% endif %}"
        }
      },
      {
        "variables": {
          "sig": "{{ sha256(soort ~ '|' ~ provenance ~ '|' ~ bronwaarde ~ '|' ~ situatie ~ '|' ~ outcome_class)[:20] }}",
          "duplicate": "{% set ns=namespace(found=false) %}{% for i in items %}{% if ('sig=' ~ sha256(soort ~ '|' ~ provenance ~ '|' ~ bronwaarde ~ '|' ~ situatie ~ '|' ~ outcome_class)[:20]) in (i.description|default('',true)) %}{% set ns.found=true %}{% endif %}{% endfor %}{{ ns.found }}",
          "bewijs": "{{ 'Health=' ~ states('input_text.luna_health_status') ~ ' | Prediction=' ~ states('input_number.luna_prediction_betrouwbaarheid') ~ '% | Leerfase=' ~ states('input_text.luna_leerfase') ~ ' | Routine=' ~ states('input_text.luna_routine_status') }}"
        }
      },
      {
        "if": [
          {
            "condition": "template",
            "value_template": "{{ not test_like and not duplicate }}"
          }
        ],
        "then": [
          {
            "repeat": {
              "for_each": "{{ items[:([0, (items | count) - 79] | max)] }}",
              "sequence": [
                {
                  "action": "todo.remove_item",
                  "target": {
                    "entity_id": "todo.luna_ervaringsgeheugen"
                  },
                  "data": {
                    "item": "{{ repeat.item.uid }}"
                  },
                  "continue_on_error": true
                }
              ]
            }
          },
          {
            "action": "todo.add_item",
            "target": {
              "entity_id": "todo.luna_ervaringsgeheugen"
            },
            "data": {
              "item": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} · JOURNAAL · {{ soort }}",
              "description": "{{ ('sig=' ~ sig ~ ' | provenance=' ~ provenance ~ ' | class=' ~ record_class ~ ' | real=' ~ real_world ~ ' | daypart=' ~ daypart ~ ' | daytype=' ~ daytype ~ ' | evidence=' ~ evidence_level ~ ' | outcome=' ~ outcome_class ~ ' | bron=' ~ bronwaarde ~ ' | situatie=' ~ situatie ~ ' | verwachting=' ~ verwachting ~ ' | actuele uitkomst=' ~ uitkomst ~ ' | doel=' ~ doel ~ ' | bewijs=' ~ bewijs)[:1600] }}"
            },
            "continue_on_error": true
          },
          {
            "action": "counter.increment",
            "target": {
              "entity_id": "counter.luna_decision_journal_entries"
            },
            "continue_on_error": true
          },
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_decision_journal_status"
            },
            "data": {
              "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · ' ~ soort ~ ' · ' ~ record_class ~ ' · real=' ~ real_world ~ ' · evidence=' ~ evidence_level ~ ' · outcome=' ~ outcome_class)[:255] }}"
            }
          }
        ],
        "else": [
          {
            "action": "input_text.set_value",
            "target": {
              "entity_id": "input_text.luna_decision_journal_status"
            },
            "data": {
              "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · OVERGESLAGEN · ' ~ ('test/builder-data' if test_like else 'exact duplicaat') ~ ' · geen leerrecord')[:255] }}"
            }
          }
        ]
      }
    ],
    "mode": "queued",
    "max": 20,
    "max_exceeded": "silent",
    "initial_state": false
  },
  {
    "id": "1787235504850",
    "alias": "Luna Energiecoach Core",
    "description": "Luna Energiecoach v1.0. Volledig lokaal en generiek: vergelijkt actueel netvermogen met een 24-uurs statistics-baseline en combineert dat met actuele zonneproductie en thuisaccu-SOC. Geeft alleen status/advies, schakelt niets. Drempels staan in helpers en zijn later aanpasbaar zonder automation-wijziging.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "time_pattern",
        "minutes": "/15"
      }
    ],
    "conditions": [],
    "actions": [
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_energiecoach_status"
        },
        "data": {
          "value": "{% set net=states('input_number.luna_shadow_numeric') %}{% set avg=states('sensor.all_house_p1_logger_luna_netvermogen_24u_gemiddeld') %}{% set zon=states('sensor.luna_shadow_numeric_sensor') %}{% set zavg=states('sensor.luna_zonnevermogen_24u_gemiddeld') %}{% set soc=states('input_number.luna_shadow_numeric') %}{% set marge=states('input_number.luna_energie_afwijking_marge')|float(1200) %}{% set hoog=states('input_number.luna_energie_hoge_import')|float(2500) %}{% if net in ['unknown','unavailable','none',''] or avg in ['unknown','unavailable','none',''] %}Baseline wordt opgebouwd; actuele energiestatus nog niet betrouwbaar vergelijkbaar.{% else %}{% set n=net|float(0) %}{% set a=avg|float(0) %}{% set d=n-a %}{% set s=zon|float(0) if zon not in ['unknown','unavailable','none',''] else none %}{% set b=soc|float(0) if soc not in ['unknown','unavailable','none',''] else none %}{% if n > hoog and d > marge %}AFWIJKING · net {{ n|round(0)|int }} W, 24u gem. {{ a|round(0)|int }} W, +{{ d|round(0)|int }} W{% if s is not none %}, zon {{ s|round(0)|int }} W{% endif %}{% if b is not none %}, thuisaccu {{ b|round(0)|int }}%{% endif %}. Controleer alleen bij behoefte welke grote verbruiker actief is.{% elif n < -1500 and b is not none and b < 80 %}KANS · teruglevering {{ (0-n)|round(0)|int }} W terwijl thuisaccu {{ b|round(0)|int }}% is{% if s is not none %}; zon {{ s|round(0)|int }} W{% endif %}. Mogelijke benuttingskans, geen automatische actie.{% elif d|abs > marge %}LET OP · net {{ n|round(0)|int }} W versus 24u gem. {{ a|round(0)|int }} W (verschil {{ d|round(0)|int }} W){% if s is not none %}; zon {{ s|round(0)|int }} W{% endif %}.{% else %}Normaal · net {{ n|round(0)|int }} W, 24u gem. {{ a|round(0)|int }} W{% if s is not none %}, zon {{ s|round(0)|int }} W{% endif %}{% if zavg not in ['unknown','unavailable','none',''] %} (24u gem. {{ zavg|float(0)|round(0)|int }} W){% endif %}{% if b is not none %}, thuisaccu {{ b|round(0)|int }}%{% endif %}.{% endif %}{% endif %}"
        }
      }
    ],
    "mode": "single",
    "initial_state": false
  },
  {
    "id": "1787235511675",
    "alias": "Luna Entity Relations - relatiekaart",
    "description": "Entity Relations v2.0. Bouwt iedere 6 uur een dynamische lokale relatiekaart uit actuele Home Assistant entity-, area- en device-metadata. De detailkaart staat in todo.luna_relatiekaart; input_text bevat alleen een compacte status. Observeert uitsluitend.\n\nLuna migratie: fail-closed. Productieacties en echte meldkanalen zijn vervangen door interne logboekregistratie; ontbrekende productie-entiteiten gebruiken veilige shadow-helpers.",
    "triggers": [
      {
        "trigger": "time_pattern",
        "hours": "/6"
      },
      {
        "trigger": "homeassistant",
        "event": "start"
      }
    ],
    "actions": [
      {
        "action": "todo.get_items",
        "target": {
          "entity_id": "todo.luna_relatiekaart"
        },
        "data": {
          "status": "needs_action"
        },
        "response_variable": "rel_response"
      },
      {
        "variables": {
          "oude_items": "{{ rel_response['todo.luna_relatiekaart']['items'] | default([], true) }}",
          "kern_entities": [
            "input_text.luna_shadow_state",
            "input_text.luna_shadow_state",
            "input_boolean.luna_shadow_binary",
            "input_text.luna_shadow_state",
            "input_boolean.luna_shadow_binary",
            "input_boolean.luna_shadow_binary",
            "input_number.luna_shadow_numeric",
            "input_number.luna_shadow_numeric",
            "input_number.luna_shadow_numeric",
            "input_number.luna_shadow_numeric",
            "input_boolean.luna_shadow_binary",
            "input_boolean.luna_shadow_binary"
          ]
        }
      },
      {
        "repeat": {
          "for_each": "{{ oude_items }}",
          "sequence": [
            {
              "action": "todo.remove_item",
              "target": {
                "entity_id": "todo.luna_relatiekaart"
              },
              "data": {
                "item": "{{ repeat.item.uid }}"
              },
              "continue_on_error": true
            }
          ]
        }
      },
      {
        "repeat": {
          "for_each": "{{ kern_entities }}",
          "sequence": [
            {
              "action": "todo.add_item",
              "target": {
                "entity_id": "todo.luna_relatiekaart"
              },
              "data": {
                "item": "{{ repeat.item }}",
                "description": "{% set e=repeat.item %}{% set did=device_id(e) %}naam={{ state_attr(e,'friendly_name') | default(e,true) }} | ruimte={{ area_name(e) | default('geen ruimte',true) }} | apparaat={{ (device_attr(did,'name') if did else 'geen apparaat') | default('geen apparaat',true) }} | domein={{ e.split('.')[0] }} | actuele_state={{ states(e) }} | bijgewerkt={{ relative_time(states[e].last_updated) if states[e] is defined else 'onbekend' }} geleden"
              },
              "continue_on_error": true
            }
          ]
        }
      },
      {
        "action": "input_text.set_value",
        "target": {
          "entity_id": "input_text.luna_entity_relaties"
        },
        "data": {
          "value": "{{ (now().strftime('%d-%m %H:%M') ~ ' · dynamische relatiekaart · ' ~ (kern_entities|count) ~ ' kern-entities · live area/device/state metadata in todo.luna_relatiekaart')[:255] }}"
        }
      }
    ],
    "mode": "restart",
    "initial_state": false
  },
