    "success": true,
    "script_id": "luna_ollama_queue",
    "config": {
      "alias": "Luna Ollama wachtrij",
      "description": "Centrale seriele en adaptieve Luna-wachtrij v2.1. Maximaal een lokale AI-taak tegelijk. Wacht op vrije systeemresources en interactieve prioriteit, kiest via configureerbare backend-helpers light/heavy, begrenst context en meet runtime/wachttijd/CPU/RAM. Alleen deze executor kent de concrete AI-task backend, zodat Luna later zonder logica-herbouw naar andere hardware kan verhuizen.\n\nLuna: fail-closed; zonder geconfigureerde lokale AI-backend wordt geen AI-taak uitgevoerd.",
      "mode": "queued",
      "max": 20,
      "fields": {
        "task_name": {
          "name": "Taaknaam",
          "required": true,
          "selector": {
            "text": {}
          }
        },
        "instructions": {
          "name": "Instructies",
          "required": true,
          "selector": {
            "text": {
              "multiline": true
            }
          }
        },
        "structure": {
          "name": "Structuur",
          "required": true,
          "selector": {
            "object": {}
          }
        },
        "complexity": {
          "name": "Complexiteit",
          "required": false,
          "selector": {
            "select": {
              "options": [
                "light",
                "heavy"
              ]
            }
          }
        },
        "priority": {
          "name": "Prioriteit",
          "required": false,
          "selector": {
            "select": {
              "options": [
                "background",
                "normal",
                "interactive"
              ]
            }
          }
        }
      },
      "sequence": [
        {
          "variables": {
            "selected_complexity": "{{ complexity | default('heavy', true) }}",
            "selected_priority": "{{ priority | default('background', true) }}",
            "request_ts": "{{ as_timestamp(now()) }}"
          }
        },
        {
          "variables": {
            "model_entity": "{% set fallback='input_text.luna_shadow_state' if selected_complexity == 'light' else 'input_text.luna_shadow_state' %}{% set configured=states('input_text.luna_ollama_backend_light')|trim if selected_complexity == 'light' else states('input_text.luna_ollama_backend_heavy')|trim %}{{ configured if configured not in ['', 'unknown', 'unavailable', 'none'] else fallback }}",
            "model_label": "{{ 'Qwen3 4B' if selected_complexity == 'light' else 'Qwen3 8B' }}",
            "bounded_instructions": "{% set txt=instructions|string %}{% set lim=12000 if selected_complexity=='light' else 24000 %}{% if txt|length <= lim %}{{ txt }}{% else %}{% set head=7000 if selected_complexity=='light' else 14000 %}{% set tail=5000 if selected_complexity=='light' else 10000 %}{{ txt[:head] }}\n\n[CONTEXT AUTOMATISCH BEGRENSD DOOR LUNA]\n\n{{ txt[-tail:] }}{% endif %}"
          }
        },
        {
          "if": [
            {
              "condition": "template",
              "value_template": "{{ states(model_entity) in ['unknown','unavailable','none',''] or (states(model_entity)|trim).startswith('GEEN_BACKEND') }}"
            }
          ],
          "then": [
            {
              "action": "input_boolean.turn_off",
              "target": {
                "entity_id": "input_boolean.luna_ollama_inference_actief"
              },
              "continue_on_error": true
            },
            {
              "action": "input_text.set_value",
              "target": {
                "entity_id": "input_text.luna_ollama_queue_status"
              },
              "data": {
                "value": "{{ ('GEBLOKKEERD · ' ~ model_label ~ ' · geen AI-backend in Luna · ' ~ task_name)[:255] }}"
              },
              "continue_on_error": true
            },
            {
              "stop": "Fail-closed: geen beschikbare lokale AI-backend in Luna",
              "error": true
            }
          ]
        },
        {
          "choose": [
            {
              "conditions": [
                {
                  "condition": "template",
                  "value_template": "{{ selected_priority == 'interactive' }}"
                }
              ],
              "sequence": [
                {
                  "if": [
                    {
                      "condition": "not",
                      "conditions": [
                        {
                          "condition": "state",
                          "entity_id": "binary_sensor.luna_ollama_systeem_vrij",
                          "state": "on"
                        }
                      ]
                    }
                  ],
                  "then": [
                    {
                      "action": "counter.increment",
                      "target": {
                        "entity_id": "counter.luna_ollama_uitgesteld"
                      },
                      "continue_on_error": true
                    },
                    {
                      "action": "input_text.set_value",
                      "target": {
                        "entity_id": "input_text.luna_ollama_queue_status"
                      },
                      "data": {
                        "value": "{{ ('WACHT · ' ~ model_label ~ ' · ' ~ task_name ~ ' · systeem niet vrij')[:255] }}"
                      },
                      "continue_on_error": true
                    }
                  ]
                },
                {
                  "repeat": {
                    "while": [
                      {
                        "condition": "not",
                        "conditions": [
                          {
                            "condition": "state",
                            "entity_id": "binary_sensor.luna_ollama_systeem_vrij",
                            "state": "on"
                          }
                        ]
                      }
                    ],
                    "sequence": [
                      {
                        "wait_for_trigger": [
                          {
                            "trigger": "state",
                            "entity_id": "binary_sensor.luna_ollama_systeem_vrij",
                            "to": "on"
                          }
                        ]
                      }
                    ]
                  }
                }
              ]
            }
          ],
          "default": [
            {
              "if": [
                {
                  "condition": "or",
                  "conditions": [
                    {
                      "condition": "not",
                      "conditions": [
                        {
                          "condition": "state",
                          "entity_id": "binary_sensor.luna_ollama_systeem_vrij",
                          "state": "on"
                        }
                      ]
                    },
                    {
                      "condition": "state",
                      "entity_id": "input_boolean.luna_interactieve_prioriteit",
                      "state": "on"
                    }
                  ]
                }
              ],
              "then": [
                {
                  "action": "counter.increment",
                  "target": {
                    "entity_id": "counter.luna_ollama_uitgesteld"
                  },
                  "continue_on_error": true
                },
                {
                  "action": "input_text.set_value",
                  "target": {
                    "entity_id": "input_text.luna_ollama_queue_status"
                  },
                  "data": {
                    "value": "{{ ('WACHT · ' ~ model_label ~ ' · ' ~ task_name ~ ' · HA/interactive heeft voorrang')[:255] }}"
                  },
                  "continue_on_error": true
                }
              ]
            },
            {
              "repeat": {
                "while": [
                  {
                    "condition": "or",
                    "conditions": [
                      {
                        "condition": "not",
                        "conditions": [
                          {
                            "condition": "state",
                            "entity_id": "binary_sensor.luna_ollama_systeem_vrij",
                            "state": "on"
                          }
                        ]
                      },
                      {
                        "condition": "state",
                        "entity_id": "input_boolean.luna_interactieve_prioriteit",
                        "state": "on"
                      }
                    ]
                  }
                ],
                "sequence": [
                  {
                    "wait_for_trigger": [
                      {
                        "trigger": "state",
                        "entity_id": "binary_sensor.luna_ollama_systeem_vrij",
                        "to": "on"
                      },
                      {
                        "trigger": "state",
                        "entity_id": "input_boolean.luna_interactieve_prioriteit",
                        "to": "off"
                      }
                    ]
                  }
                ]
              }
            }
          ]
        },
        {
          "variables": {
