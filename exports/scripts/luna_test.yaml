            "instructions": "{{ bounded_instructions }}",
            "structure": "{{ structure }}"
          },
          "response_variable": "ollama_queue_response",
          "continue_on_error": true
        },
        {
          "action": "input_boolean.turn_off",
          "target": {
            "entity_id": "input_boolean.luna_ollama_inference_actief"
          },
          "continue_on_error": true
        },
        {
          "if": [
            {
              "condition": "template",
              "value_template": "{{ ollama_queue_response is not defined or ollama_queue_response.data is not defined }}"
