          "target": {
            "entity_id": "input_text.luna_ollama_queue_status"
          },
          "data": {
            "value": "{{ ('DRAAIT · ' ~ model_label ~ ' · ' ~ task_name ~ ' · ctx=' ~ context_chars ~ ' chars')[:255] }}"
          },
          "continue_on_error": true
        },
        {
          "action": "input_boolean.turn_on",
          "target": {
            "entity_id": "input_boolean.luna_ollama_inference_actief"
