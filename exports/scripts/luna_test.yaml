              "input_text.luna_trace_status",
              "input_text.luna_explain_status",
              "input_text.luna_health_status",
              "input_text.luna_config_readiness",
              "input_text.luna_storage_status"
            ],
            "languages_ok": "{{ actual_languages == expected_languages }}",
            "physical_ok": "{{ is_state('input_boolean.luna_physical_control','off') }}",
            "safety_ok": "{{ is_state('input_boolean.luna_safety_ok','on') }}",
            "mode_ok": "{{ is_state('input_select.luna_actiemodus','Leren') }}",
            "automations_ok": "{{ core_automations | select('is_state','on') | list | count == core_automations | count }}",
            "modules_ok": "{{ module_entities | reject('is_state','unknown') | reject('is_state','unavailable') | list | count == module_entities | count }}",
            "ai_independent_ok": "{{ states('input_select.luna_ai_mode') in ['Uit','Home Assistant','Lokaal'] and states('input_text.luna_ai_router_status') not in ['unknown','unavailable'] }}",
            "config_ok": "{{ states('input_text.luna_config_readiness').startswith('READY') }}",
            "storage_ok": "{{ states('todo.luna_persistent_memory') not in ['unknown','unavailable'] and states('input_text.luna_storage_status') not in ['unknown','unavailable',''] }}"
          }
        },
        {
          "variables": {
            "passed": "{{ languages_ok and physical_ok and safety_ok and mode_ok and automations_ok and modules_ok and ai_independent_ok and config_ok and storage_ok }}",
            "result": {
              "passed": "{{ passed }}",
              "languages_ok": "{{ languages_ok }}",
              "physical_control_off": "{{ physical_ok }}",
              "safety_ok": "{{ safety_ok }}",
              "learning_mode": "{{ mode_ok }}",
              "core_automations_on": "{{ automations_ok }}",
              "modules_available": "{{ modules_ok }}",
              "ai_optional": "{{ ai_independent_ok }}",
              "config_ready": "{{ config_ok }}",
              "storage_ready": "{{ storage_ok }}"
            }
          }
        },
        {
          "action": "input_text.set_value",
          "target": {
            "entity_id": "input_text.luna_regression_status"
          },
          "data": {
            "value": "{{ ('PASS' if passed else 'FAIL') ~ ' · languages=' ~ languages_ok ~ ' · physical=' ~ physical_ok ~ ' · safety=' ~ safety_ok ~ ' · mode=' ~ mode_ok ~ ' · core=' ~ automations_ok ~ ' · modules=' ~ modules_ok ~ ' · ai_optional=' ~ ai_independent_ok ~ ' · config=' ~ config_ok ~ ' · storage=' ~ storage_ok }}"
          }
        },
        {
          "action": "input_datetime.set_datetime",
          "target": {
            "entity_id": "input_datetime.luna_regression_last_run"
          },
          "data": {
            "datetime": "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          }
        },
        {
          "stop": "Luna regression selftest complete",
          "response_variable": "result"
        }
      ]
    }
  }
]
