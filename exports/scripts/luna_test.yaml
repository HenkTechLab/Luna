[
  {
    "success": true,
    "script_id": "luna_end_to_end_selftest",
    "config": {
      "alias": "Luna End-to-End Selftest",
      "description": "Veilige end-to-end test voor de generieke Luna leerketen. Injecteert één intern testevent en controleert Memory, Decision Journal, Prediction Unknown, Routine, Comfort, Personal Assistant en Timeline. Geen fysieke apparaatsturing en geen AI-aanroep.",
      "mode": "single",
      "sequence": [
        {
          "variables": {
            "memory_before": "{{ states('counter.luna_memory_records') | int(0) }}",
            "decision_before": "{{ states('counter.luna_decision_records') | int(0) }}",
            "unknown_before": "{{ states('counter.luna_prediction_unknown') | int(0) }}",
            "test_event": "e2e-{{ now().strftime('%Y%m%d-%H%M%S') }}"
          }
        },
        {
          "action": "input_text.set_value",
          "target": {
            "entity_id": "input_text.luna_event_input"
          },
          "data": {
            "value": "{{ test_event }}"
          }
        },
        {
          "delay": {
            "seconds": 1
          }
        },
        {
          "variables": {
            "memory_ok": "{{ states('counter.luna_memory_records') | int(0) == memory_before + 1 }}",
            "decision_ok": "{{ states('counter.luna_decision_records') | int(0) == decision_before + 1 }}",
            "prediction_ok": "{{ states('counter.luna_prediction_unknown') | int(0) == unknown_before + 1 }}",
            "routine_ok": "{{ states('input_text.luna_routine_status').startswith('SHADOW') }}",
            "comfort_ok": "{{ states('input_text.luna_comfort_status').startswith('LEARNING') }}",
            "assistant_ok": "{{ states('input_text.luna_personal_assistant_status').startswith('READY') }}",
            "timeline_ok": "{{ states('input_text.luna_timeline_last_event') == test_event }}",
            "passed": "{{ memory_ok and decision_ok and prediction_ok and routine_ok and comfort_ok and assistant_ok and timeline_ok }}",
            "result": {
              "passed": "{{ passed }}",
              "event": "{{ test_event }}",
              "memory": "{{ memory_ok }}",
              "decision": "{{ decision_ok }}",
              "prediction_unknown": "{{ prediction_ok }}",
              "routine": "{{ routine_ok }}",
              "comfort": "{{ comfort_ok }}",
              "assistant": "{{ assistant_ok }}",
              "timeline": "{{ timeline_ok }}"
            }
          }
        },
        {
          "action": "input_text.set_value",
          "target": {
            "entity_id": "input_text.luna_regression_status"
          },
          "data": {
            "value": "{{ ('PASS E2E' if passed else 'FAIL E2E') ~ ' · memory=' ~ memory_ok ~ ' · decision=' ~ decision_ok ~ ' · prediction=' ~ prediction_ok ~ ' · routine=' ~ routine_ok ~ ' · comfort=' ~ comfort_ok ~ ' · assistant=' ~ assistant_ok ~ ' · timeline=' ~ timeline_ok }}"
          }
        },
        {
          "stop": "Luna end-to-end selftest complete",
          "response_variable": "result"
        }
      ]
    }
  },
